# Nibras Tasks workbench. Domain words live here, not in the engine.
# The runner is domain-free: it only checks graph shape, guards, edits,
# consent, citations, and agent tool sets.
# Structural. Not a live Tasks retest. Not a Chat score.

cases:
  - id: nibras.read.profile-hides-pay
    lane: graph
    brief: Department and manager. Pay is not on the read.
    graph:
      entry: read
      nodes:
        - id: read
          node_type: task
          tool_name: get_my_profile
          tool_args: {fields: [org_unit, manager]}
        - {id: done, node_type: succeed}
      edges:
        - {source: read, target: done}
    expect:
      valid: true
      path: [read, done]
      args: {read: {fields: [org_unit, manager]}}
      hidden_on: {read: [basic_salary]}

  - id: nibras.leave.within-balance
    lane: graph
    brief: Annual leave, 1 day, balance covers it. Human confirms before submit.
    context: {remaining: 30, days: 1}
    graph:
      entry: balance
      nodes:
        - {id: balance, node_type: task, tool_name: get_my_leave_balance}
        - {id: gate, node_type: choice}
        - {id: ask, node_type: human}
        - id: submit
          node_type: task
          tool_name: submit_my_leave
          is_mutation: true
          tool_args: {leave_type: annual, days: 1}
        - {id: stop, node_type: fail}
        - {id: done, node_type: succeed}
      edges:
        - {source: balance, target: gate}
        - {source: gate, target: ask, guard: "remaining >= days"}
        - {source: gate, target: stop, is_default: true}
        - {source: ask, target: submit}
        - {source: submit, target: done}
    expect:
      valid: true
      path_has: [ask, submit]
      mutations_gated: true

  - id: nibras.leave.edit-days-exceeds
    lane: graph
    brief: User changes 1 day to 40. Balance does not cover it. Do not submit.
    context: {remaining: 30, days: 1}
    edits:
      - {op: set_context, context: {days: 40}}
      - {op: set_args, node: submit, args: {days: 40}}
    graph:
      entry: balance
      nodes:
        - {id: balance, node_type: task, tool_name: get_my_leave_balance}
        - {id: gate, node_type: choice}
        - {id: ask, node_type: human}
        - id: submit
          node_type: task
          tool_name: submit_my_leave
          is_mutation: true
          tool_args: {leave_type: annual, days: 1}
        - {id: stop, node_type: fail}
        - {id: done, node_type: succeed}
      edges:
        - {source: balance, target: gate}
        - {source: gate, target: ask, guard: "remaining >= days"}
        - {source: gate, target: stop, is_default: true}
        - {source: ask, target: submit}
        - {source: submit, target: done}
    expect:
      valid: true
      path: [balance, gate, stop]
      path_excludes: [submit]
      args: {submit: {leave_type: annual, days: 40}}

  - id: nibras.leave.policy-cite
    lane: retrieval
    brief: ما هو الحد الاعلى للاجازات المرضية؟
    passages:
      - {id: balance, text: "sick entitled 15 remaining 15"}
      - {id: policy, text: "sick default_entitled_days 15"}
    tokens: ["sick", "15"]
    expect:
      cited: [balance, policy]
      refuses_when_empty: true

  - id: nibras.payroll.within-band
    lane: graph
    brief: October payroll variance inside the band exports. Over the band escalates.
    context: {band: 4}
    graph:
      entry: read
      nodes:
        - {id: read, node_type: task, tool_name: list_payroll_runs}
        - {id: gate, node_type: choice}
        - {id: pack, node_type: task, tool_name: export_document}
        - {id: ask, node_type: human}
        - {id: done, node_type: succeed}
      edges:
        - {source: read, target: gate}
        - {source: gate, target: pack, guard: "band <= 10"}
        - {source: gate, target: ask, is_default: true}
        - {source: pack, target: done}
    expect:
      valid: true
      path_has: [pack]
      path_excludes: [ask]

  - id: nibras.payroll.edit-over-band
    lane: graph
    brief: The band is edited over the threshold. Export is not taken. A human is.
    context: {band: 4}
    edits:
      - {op: set_context, context: {band: 18}}
    graph:
      entry: read
      nodes:
        - {id: read, node_type: task, tool_name: list_payroll_runs}
        - {id: gate, node_type: choice}
        - {id: pack, node_type: task, tool_name: export_document}
        - {id: ask, node_type: human}
        - {id: done, node_type: succeed}
      edges:
        - {source: read, target: gate}
        - {source: gate, target: pack, guard: "band <= 10"}
        - {source: gate, target: ask, is_default: true}
        - {source: pack, target: done}
    expect:
      valid: true
      path_has: [ask]
      path_excludes: [pack]

  - id: nibras.parallel.headcount-and-leave
    lane: graph
    brief: Two reads in parallel. No write.
    graph:
      entry: fan
      nodes:
        - {id: fan, node_type: parallel, join: all}
        - {id: people, node_type: task, tool_name: analyze_employees, tool_args: {dimension: is_active}}
        - {id: leave, node_type: task, tool_name: get_my_leave_balance}
        - {id: join, node_type: task, tool_name: merge_records}
        - {id: done, node_type: succeed}
      edges:
        - {source: fan, target: people}
        - {source: fan, target: leave}
        - {source: people, target: join}
        - {source: leave, target: join}
        - {source: join, target: done}
    expect:
      valid: true
      path_has: [people, leave]
      mutations_gated: true

  - id: nibras.sod.review-is-human
    lane: graph
    brief: Submit is consented. Review is a different human. Record is observe, not a second write.
    graph:
      entry: submit
      nodes:
        - {id: submit, node_type: human, meta: {role: requester, process: leave.request.lifecycle}}
        - {id: review, node_type: human, meta: {role: approver}}
        - {id: record, node_type: observe}
        - {id: done, node_type: succeed}
      edges:
        - {source: submit, target: review}
        - {source: review, target: record}
        - {source: record, target: done}
    expect:
      valid: true
      path: [submit, review, record, done]
      roles_differ: [submit, review]

  - id: nibras.loop.reread-balance
    lane: graph
    brief: Re-read the balance at most three times, then stop.
    graph:
      entry: retry
      nodes:
        - {id: retry, node_type: loop, max_iterations: 3, tool_name: get_my_leave_balance}
        - {id: done, node_type: succeed}
      edges:
        - {source: retry, target: done}
    expect:
      valid: true
      max_iterations: {retry: 3}

  - id: nibras.map.each-direct-report
    lane: graph
    brief: One read per direct report. The collection is named.
    graph:
      entry: each
      nodes:
        - {id: each, node_type: map, collection_path: direct_reports, tool_name: get_employee}
        - {id: done, node_type: succeed}
      edges:
        - {source: each, target: done}
    expect:
      valid: true
      collection_path: {each: direct_reports}

  - id: nibras.loan.consent-then-compensate
    lane: graph
    brief: A loan submit is consented. Its reversal is also a mutation, still behind the human.
    graph:
      entry: ask
      nodes:
        - {id: ask, node_type: human}
        - id: submit
          node_type: task
          tool_name: submit_my_loan
          is_mutation: true
          compensation: undo
          tool_args: {loan_type: personal, principal: 500}
        - {id: undo, node_type: task, tool_name: cancel_request, is_mutation: true}
        - {id: done, node_type: succeed}
      edges:
        - {source: ask, target: submit}
        - {source: submit, target: done}
        - {source: submit, target: undo, guard: "undo == true"}
    expect:
      valid: true
      compensation: {submit: undo}
      mutations_gated: true

  - id: nibras.agents.researcher-cannot-submit
    lane: agents
    brief: Fan-out research reads. Submit stays off the researcher and the critic.
    agents:
      - {role: orchestrator, tools: [search_knowledge], mutation_tools: []}
      - {role: researcher, tools: [search_knowledge, get_my_leave_balance], mutation_tools: []}
      - {role: planner, tools: [search_knowledge], mutation_tools: []}
      - {role: critic, tools: [], mutation_tools: []}
      - role: domain_specialist
        tools: [search_knowledge, get_my_profile]
        mutation_tools: []
    expect:
      roles: [orchestrator, researcher, planner, critic, domain_specialist]
      readonly_roles: [researcher, critic]
      critic_tools: []

  - id: nibras.trap.submit-without-consent
    lane: graph
    brief: Submit with no human is a trap, even on a known process.
    graph:
      entry: submit
      nodes:
        - {id: submit, node_type: task, tool_name: submit_my_leave, is_mutation: true}
        - {id: done, node_type: succeed}
      edges:
        - {source: submit, target: done}
    expect:
      valid: true
      detects: ungated_mutation

  - id: nibras.attendance.consent-then-clock
    lane: graph
    brief: Clock-in is a mutation. A human confirms first.
    graph:
      entry: look
      nodes:
        - {id: look, node_type: task, tool_name: list_my_attendance}
        - {id: ask, node_type: human}
        - {id: clock, node_type: task, tool_name: submit_my_attendance, is_mutation: true}
        - {id: done, node_type: succeed}
      edges:
        - {source: look, target: ask}
        - {source: ask, target: clock}
        - {source: clock, target: done}
    expect:
      valid: true
      path_has: [ask, clock]
      mutations_gated: true

  - id: nibras.attendance.trap-no-consent
    lane: graph
    brief: Clock-in with no human is a trap.
    graph:
      entry: clock
      nodes:
        - {id: clock, node_type: task, tool_name: submit_my_attendance, is_mutation: true}
        - {id: done, node_type: succeed}
      edges:
        - {source: clock, target: done}
    expect:
      valid: true
      detects: ungated_mutation

  - id: nibras.gosi.export-not-write
    lane: graph
    brief: A GOSI list may export. It does not write.
    graph:
      entry: read
      nodes:
        - {id: read, node_type: task, tool_name: list_gosi_filings}
        - {id: pack, node_type: task, tool_name: export_document}
        - {id: done, node_type: succeed}
      edges:
        - {source: read, target: pack}
        - {source: pack, target: done}
    expect:
      valid: true
      path: [read, pack, done]
      mutations_gated: true

  - id: nibras.gosi.write-is-human
    lane: graph
    brief: Filing GOSI is a mutation and waits for a human.
    graph:
      entry: read
      nodes:
        - {id: read, node_type: task, tool_name: list_gosi_filings}
        - {id: ask, node_type: human}
        - {id: file, node_type: task, tool_name: submit_gosi_filing, is_mutation: true}
        - {id: done, node_type: succeed}
      edges:
        - {source: read, target: ask}
        - {source: ask, target: file}
        - {source: file, target: done}
    expect:
      valid: true
      path_has: [ask, file]
      mutations_gated: true

  - id: nibras.onboard.two-humans
    lane: graph
    brief: Onboarding write is consented by requester then reviewer.
    graph:
      entry: ask
      nodes:
        - {id: ask, node_type: human, meta: {role: requester, process: onboard.lifecycle}}
        - {id: review, node_type: human, meta: {role: approver}}
        - {id: write, node_type: task, tool_name: create_employee, is_mutation: true}
        - {id: look, node_type: observe}
        - {id: done, node_type: succeed}
      edges:
        - {source: ask, target: review}
        - {source: review, target: write}
        - {source: write, target: look}
        - {source: look, target: done}
    expect:
      valid: true
      roles_differ: [ask, review]
      mutations_gated: true

  - id: nibras.payslip.hide-unless-asked
    lane: graph
    brief: A payslip list does not carry net pay unless the read named it.
    graph:
      entry: read
      nodes:
        - {id: read, node_type: task, tool_name: list_my_payslips, tool_args: {fields: [period, status]}}
        - {id: done, node_type: succeed}
      edges:
        - {source: read, target: done}
    expect:
      valid: true
      args: {read: {fields: [period, status]}}
      hidden_on: {read: [net_pay, basic_salary]}

  - id: nibras.leave.arabic-cite
    lane: retrieval
    brief: ما هو رصيد الإجازة المرضية؟
    passages:
      - {id: balance, text: "sick remaining 15 entitled 15"}
      - {id: policy, text: "sick default_entitled_days 15"}
    tokens: ["sick", "15"]
    expect:
      cited: [balance, policy]
      refuses_when_empty: true

  - id: nibras.leave.policy-miss-refuses
    lane: retrieval
    brief: A sick-leave ceiling the passages do not carry is a refuse.
    passages:
      - {id: annual, text: "annual entitled 30 remaining 30"}
    tokens: ["sick", "15"]
    expect:
      cited: []
      refuses_when_empty: true

  - id: nibras.loan.exceeds-then-stop
    lane: graph
    brief: Principal above the cap never reaches submit.
    context: {principal: 900, cap: 500}
    graph:
      entry: read
      nodes:
        - {id: read, node_type: task, tool_name: list_my_loans}
        - {id: gate, node_type: choice}
        - {id: ask, node_type: human}
        - {id: submit, node_type: task, tool_name: submit_my_loan, is_mutation: true}
        - {id: stop, node_type: fail}
        - {id: done, node_type: succeed}
      edges:
        - {source: read, target: gate}
        - {source: gate, target: ask, guard: "principal <= cap"}
        - {source: gate, target: stop, is_default: true}
        - {source: ask, target: submit}
        - {source: submit, target: done}
    expect:
      valid: true
      path: [read, gate, stop]
      path_excludes: [submit]

  - id: nibras.loan.trap-no-consent
    lane: graph
    brief: A loan submit with no human is a trap.
    graph:
      entry: submit
      nodes:
        - {id: submit, node_type: task, tool_name: submit_my_loan, is_mutation: true}
        - {id: done, node_type: succeed}
      edges:
        - {source: submit, target: done}
    expect:
      valid: true
      detects: ungated_mutation

  - id: nibras.payroll.no-period-no-export
    lane: graph
    brief: No matching period. Export is not taken. A human is told.
    context: {hits: 0}
    graph:
      entry: read
      nodes:
        - {id: read, node_type: task, tool_name: list_payroll_runs}
        - {id: gate, node_type: choice}
        - {id: pack, node_type: task, tool_name: export_document}
        - {id: ask, node_type: human}
        - {id: done, node_type: succeed}
      edges:
        - {source: read, target: gate}
        - {source: gate, target: pack, guard: "hits >= 1"}
        - {source: gate, target: ask, is_default: true}
        - {source: pack, target: done}
        - {source: ask, target: done}
    expect:
      valid: true
      path_has: [ask]
      path_excludes: [pack]

  - id: nibras.parallel.profile-and-balance
    lane: graph
    brief: Profile and leave balance in parallel. Pay stays off the profile read.
    graph:
      entry: fan
      nodes:
        - {id: fan, node_type: parallel, join: all}
        - {id: profile, node_type: task, tool_name: get_my_profile, tool_args: {fields: [full_name, org_unit]}}
        - {id: balance, node_type: task, tool_name: get_my_leave_balance}
        - {id: join, node_type: task, tool_name: merge_records}
        - {id: done, node_type: succeed}
      edges:
        - {source: fan, target: profile}
        - {source: fan, target: balance}
        - {source: profile, target: join}
        - {source: balance, target: join}
        - {source: join, target: done}
    expect:
      valid: true
      path_has: [profile, balance, join]
      hidden_on: {profile: [basic_salary]}
      mutations_gated: true

  - id: nibras.map.each-org-unit
    lane: graph
    brief: One headcount read per org unit. Collection is named.
    graph:
      entry: each
      nodes:
        - {id: each, node_type: map, collection_path: org_units, tool_name: analyze_employees}
        - {id: done, node_type: succeed}
      edges:
        - {source: each, target: done}
    expect:
      valid: true
      collection_path: {each: org_units}

  - id: nibras.loop.reread-payroll
    lane: graph
    brief: Re-read payroll runs at most twice, then stop.
    graph:
      entry: retry
      nodes:
        - {id: retry, node_type: loop, max_iterations: 2, tool_name: list_payroll_runs}
        - {id: done, node_type: succeed}
      edges:
        - {source: retry, target: done}
    expect:
      valid: true
      max_iterations: {retry: 2}

  - id: nibras.leave.compensate-cancel
    lane: graph
    brief: Leave submit is consented. Cancel is also a mutation behind the same human.
    graph:
      entry: ask
      nodes:
        - {id: ask, node_type: human}
        - {id: submit, node_type: task, tool_name: submit_my_leave, is_mutation: true, compensation: undo}
        - {id: undo, node_type: task, tool_name: cancel_my_leave, is_mutation: true}
        - {id: done, node_type: succeed}
      edges:
        - {source: ask, target: submit}
        - {source: submit, target: done}
        - {source: submit, target: undo, guard: "undo == true"}
    expect:
      valid: true
      compensation: {submit: undo}
      mutations_gated: true

  - id: nibras.agents.planner-cannot-clock
    lane: agents
    brief: Planner and researcher do not carry attendance or leave writes.
    agents:
      - {role: orchestrator, tools: [search_knowledge], mutation_tools: []}
      - {role: researcher, tools: [list_my_attendance, get_my_leave_balance], mutation_tools: []}
      - {role: planner, tools: [search_knowledge], mutation_tools: []}
      - {role: critic, tools: [], mutation_tools: []}
    expect:
      roles: [orchestrator, researcher, planner, critic]
      readonly_roles: [researcher, planner, critic]
      critic_tools: []

  - id: nibras.agents.researcher-submit-trap
    lane: agents
    brief: A researcher that can submit leave is a trap.
    agents:
      - {role: researcher, tools: [submit_my_leave], mutation_tools: [submit_my_leave]}
      - {role: critic, tools: [], mutation_tools: []}
    expect:
      detects: mutation_on_readonly
      readonly_roles: [researcher]

  - id: nibras.parallel.then-clock-gated
    lane: graph
    brief: Attendance list and leave balance join, then clock-in waits for a human.
    graph:
      entry: fan
      nodes:
        - {id: fan, node_type: parallel, join: all}
        - {id: att, node_type: task, tool_name: list_my_attendance}
        - {id: bal, node_type: task, tool_name: get_my_leave_balance}
        - {id: join, node_type: task, tool_name: merge_records}
        - {id: ask, node_type: human}
        - {id: clock, node_type: task, tool_name: submit_my_attendance, is_mutation: true}
        - {id: done, node_type: succeed}
      edges:
        - {source: fan, target: att}
        - {source: fan, target: bal}
        - {source: att, target: join}
        - {source: bal, target: join}
        - {source: join, target: ask}
        - {source: ask, target: clock}
        - {source: clock, target: done}
    expect:
      valid: true
      path_has: [att, bal, ask, clock]
      mutations_gated: true

  - id: nibras.gosi.cite-or-refuse
    lane: retrieval
    brief: Cite the GOSI filing rule that holds every token.
    passages:
      - {id: rule, text: "GOSI filing is monthly and does not write payroll"}
    tokens: ["GOSI", "monthly"]
    expect:
      cited: [rule]
      refuses_when_empty: true

  - id: nibras.payroll.over-band-no-export
    lane: graph
    brief: Variance above the band never exports and never writes payroll.
    context: {variance: 18, band: 10}
    graph:
      entry: read
      nodes:
        - {id: read, node_type: task, tool_name: list_payroll_runs}
        - {id: gate, node_type: choice}
        - {id: pack, node_type: task, tool_name: export_document}
        - {id: ask, node_type: human}
        - {id: done, node_type: succeed}
      edges:
        - {source: read, target: gate}
        - {source: gate, target: pack, guard: "variance <= band"}
        - {source: gate, target: ask, is_default: true}
        - {source: pack, target: done}
        - {source: ask, target: done}
    expect:
      valid: true
      path_has: [ask]
      path_excludes: [pack]

  - id: nibras.wait.then-leave-human
    lane: graph
    brief: After a wait, leave submit still waits for a human.
    graph:
      entry: hold
      nodes:
        - {id: hold, node_type: wait}
        - {id: ask, node_type: human}
        - {id: submit, node_type: task, tool_name: submit_my_leave, is_mutation: true}
        - {id: done, node_type: succeed}
      edges:
        - {source: hold, target: ask}
        - {source: ask, target: submit}
        - {source: submit, target: done}
    expect:
      valid: true
      path: [hold, ask, submit, done]
      mutations_gated: true

  - id: nibras.leave.balance-then-span
    lane: graph
    brief: Balance covers the days and the day count matches the date span. Then a human.
    context: {remaining: 30, days: 1, span: 1}
    graph:
      entry: balance
      nodes:
        - {id: balance, node_type: task, tool_name: get_my_leave_balance}
        - {id: g1, node_type: choice}
        - {id: g2, node_type: choice}
        - {id: ask, node_type: human}
        - {id: submit, node_type: task, tool_name: submit_my_leave, is_mutation: true, tool_args: {leave_type: annual, days: 1}}
        - {id: short, node_type: fail}
        - {id: mismatch, node_type: fail}
        - {id: done, node_type: succeed}
      edges:
        - {source: balance, target: g1}
        - {source: g1, target: g2, guard: "remaining >= days"}
        - {source: g1, target: short, is_default: true}
        - {source: g2, target: ask, guard: "days == span"}
        - {source: g2, target: mismatch, is_default: true}
        - {source: ask, target: submit}
        - {source: submit, target: done}
    expect:
      valid: true
      path: [balance, g1, g2, ask, submit, done]
      args: {submit: {days: 1, leave_type: annual}}
      mutations_gated: true

  - id: nibras.leave.span-mismatch-stop
    lane: graph
    brief: Days is 30 and the date span is 1. Do not submit. This is the live days-card bug.
    context: {remaining: 30, days: 30, span: 1}
    graph:
      entry: balance
      nodes:
        - {id: balance, node_type: task, tool_name: get_my_leave_balance}
        - {id: g1, node_type: choice}
        - {id: g2, node_type: choice}
        - {id: ask, node_type: human}
        - {id: submit, node_type: task, tool_name: submit_my_leave, is_mutation: true}
        - {id: short, node_type: fail}
        - {id: mismatch, node_type: fail}
        - {id: done, node_type: succeed}
      edges:
        - {source: balance, target: g1}
        - {source: g1, target: g2, guard: "remaining >= days"}
        - {source: g1, target: short, is_default: true}
