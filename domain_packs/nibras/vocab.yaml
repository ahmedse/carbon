t_task_discovery_clarify_before_proposing_a: "TASK — Discovery clarify:\nBefore proposing\
  \ a plan, clarify the user's outcome with short focused questions.\nAsk ONE concise\
  \ question at a time. When you have enough information, complete.\nScope rules (critical):\n\
  - Only clarify outcomes Agent can plan: reports, board packs, data-quality rules,\n\
  \  data workflows, exports.\n- Never map personal leave / vacation / إجازة to DQ\
  \ rules, approvals, or\n  data-source onboarding. If the user wants personal leave,\
  \ respond with\n  {\"action\":\"complete\"} only if they clearly asked for a leave-compliance\n\
  \  REPORT; otherwise keep asking for the report outcome — the host may already\n\
  \  have redirected them.\n- Do not ask 'what outcome on the host platform' for trivia,\
  \ names,\n  or personal HR actions.\n- If the user wants a data-quality rule (validate/check/flag\
  \ a field, not-null,\n  unique, allowed values, range, regex, format like an email\
  \ or phone number),\n  you MUST find out exactly WHICH field and table the rule\
  \ applies to before\n  completing — ask for the specific field/column name (or DataField\
  \ id) and\n  table. Never complete discovery for a DQ rule while the target field\
  \ is still\n  unknown.\nNever invent free-form identity text; slot labels come from\
  \ the brief and\nbound values only."
t_task_plan_decompose_decompose_the_user: 'TASK — Plan decompose:

  Decompose the user task into phases and steps. Respond with JSON only — no markdown,

  no code fences, no prose outside the JSON object.

  Available tools, host API catalog names, and registered skills appear in the user

  message — use only those names.

  Each step''s intent must describe the action with bound values (amounts, dates,

  leave types, api_name) — never invent free-form identity text for the user or org.

  Mutations stage with consent (RULE_21); never claim a host write already committed.'
t_task_plan_decompose_tool_catalog_rules: "TASK — Plan decompose (tool catalog + rules):\n\
  The user asked a task that may need multiple tool calls. Decompose it into\nphases\
  \ (workflow stages) and steps.\n\nAvailable tools:\n{tools_list}\n\nHost API catalog\
  \ (live data — use call_host_api with api_name=…):\n{host_api_list}\n\nRegistered\
  \ skills (for invoke_skill only — exact names):\n{skills_list}\n\nReturn ONLY valid\
  \ JSON (no markdown, no fences):\n{{\n  \"pattern\": \"<root_cause|comparative|custom>\"\
  ,\n  \"phases\": [\n    {{\n      \"phase_id\": 0,\n      \"name\": \"<short stage\
  \ name, e.g. Research>\",\n      \"goal\": \"<what this stage accomplishes>\",\n\
  \      \"strategy\": \"<sequential|parallel>\",\n      \"step_ids\": [0, 1]\n  \
  \  }}\n  ],\n  \"steps\": [\n    {{\n      \"step_id\": 0,\n      \"intent\": \"\
  <natural-language description>\",\n      \"tool_name\": \"<one of the available\
  \ tools>\",\n      \"tool_args\": {{}},\n      \"depends_on\": [],\n      \"is_mutation\"\
  : false,\n      \"agent_role\": \"<orchestrator|researcher|planner|critic|domain_specialist>\"\
  \n    }}\n  ],\n  \"synthesis_instruction\": \"<how to combine steps into final\
  \ answer>\"\n}}\n  \nRules:\n- Each step must use one of the available tools listed\
  \ above.\n- A step that needs an answer from the operator before later steps can\
  \ run MUST set tool_name \"ask_clarification\" and \"await_user\": true. Do not\
  \ write the question as a finished reasoning step.\n- Live host data / self-service reads and writes (leave balance, leave\n\
  \  records, payslips, profile, employees, payroll, …) MUST use\n  tool_name \"call_host_api\"\
  \ with tool_args.api_name set to an exact name\n  from the Host API catalog. NEVER\
  \ put a catalog name in\n  get_entity_details.entity_name — that tool is knowledge-schema\
  \ only.\n- First-person leave submit (\"I want leave\", Arabic إجازة / عارضة) MUST\
  \ use\n  submit_my_leave when that catalog name exists — never create_leave_record\n\
  \  (admin path; needs employee id and skips the /me/leave/ workflow).\n- Loan process\
  \ / first-person loan submit MUST use submit_my_loan (or list_my_loans\n  for reads)\
  \ — NEVER submit_my_leave. Leave APIs are leave-only.\n- Employee onboarding MUST\
  \ use create_employee / list_employees / update_employee\n  — NEVER submit_my_leave.\n\
  - Person / org identity lookups by name or employee number use\n  resolve_entity\
  \ (ECF), not get_entity_details and not a catalog name as\n  an entity.\n- invoke_skill\
  \ may ONLY reference an exact name from the Registered skills\n  list. NEVER invent\
  \ a skill name — if no skill matches, do not use\n  invoke_skill at all.\n- Analysis,\
  \ comparison, synthesis and other REASONING steps are NOT skills:\n  they are done\
  \ by the LLM itself. For such a step use a real tool to gather\n  the raw inputs\
  \ it needs, then set \"tool_name\": null and\n  \"agent_role\": \"domain_specialist\"\
  \ so the model reasons directly from the\n  prior step results (available via depends_on).\n\
  - depends_on lists step_id values whose results are needed before this step.\n-\
  \ Steps with no dependencies can run in parallel.\n- Group steps into 2-4 phases\
  \ that tell a workflow story: research/collect\n  first, then analyze, then produce\
  \ output. Keep plans small — prefer 4-7\n  total steps. A single phase is fine for\
  \ simple jobs.\n- NEVER invent numeric path ids (payroll run ids, employee ids,\
  \ org ids).\n  Demo labels in the brief (e.g. run_id: demo-oct-2026) are NOT database\n\
  \  primary keys. Always list first (list_payroll_runs / list_employees /\n  resolve_entity),\
  \ then call detail/compute/validate with the REAL id from\n  that prior step via\
  \ depends_on — or omit path_params and let the host\n  resolve the period alias.\
  \ Putting a fake string into path_params.id\n  will fail.\n- The id comes from\
  \ the listing step through tool_args.bind, never typed in:\n  \"bind\": {{\"id\":\
  \ {{\"step\": <listing step_id>, \"field\": \"id\", \"select\": \"latest\"}}}}.\n\
  \  Use select \"latest\" only when the brief asks for the latest / current one;\n\
  \  omit select and the operator picks one.\n- call_host_api tool_args carry values\
  \ only under path_params (path ids),\n  query_params (read filters such as dimension)\
  \ or body (write fields).\n  A top-level value is never sent to the host.\n- NEVER collapse a multi-action\
  \ brief (compute + validate + report, compare\n  to rates, generate a document,\
  \ do-not-commit) into ONE invoke_skill step.\n  Emit a separate step for each distinct\
  \ action. Prefer call_host_api for\n  live payroll/host reads and writes; use null-tool\
  \ reasoning for analysis;\n  use export_document when the brief asks for a document/file\
  \ report.\n- strategy \"parallel\" only when the phase's steps are truly independent;\n\
  \  otherwise \"sequential\".\n- agent_role selects who executes the step:\n  \"\
  researcher\" for read-only internet/knowledge research,\n  \"planner\" for sequencing\
  \ / decomposition-only thinking,\n  \"critic\" for review / quality gates before\
  \ export or mutation,\n  \"domain_specialist\" for deep domain analysis (payroll,\
  \ HR, finance),\n  \"orchestrator\" for host coordination and everything else (the\
  \ main agent).\n  Multi-agent tasks MUST assign distinct roles across research /\
  \ analyze /\n  critique / act phases — do not stamp every step orchestrator when\
  \ the\n  brief clearly spans research + specialist judgment + review.\n- Set is_mutation:\
  \ true only for steps that modify host state.\n- create_dq_rule needs a REAL target:\
  \ deterministic rule types (not_null,\n  unique, allowed_values, range, regex) REQUIRE\
  \ data_table AND data_field ids.\n  If the field/table is unknown, first call get_entity_details\
  \ (or another\n  lookup tool) to resolve it, OR emit a reasoning step whose instructions\
  \ ask\n  the user for the specific field/table before any create_dq_rule step.\n\
  \  NEVER emit a create_dq_rule step for a deterministic rule without its\n  data_table\
  \ and data_field.\n- Step intents and pre-consent wording must use bound values\
  \ only — never\n  invent free-form identity text for the user or organisation.\n\
  \nUser task: {task}\n"
t_task_tool_failure_recovery_explain_the: 'TASK — Tool-failure recovery:

  Explain the failure in plain business language using ONLY the tool failure payload

  (detail / error_kind / hints).

  NEVER claim the action succeeded or that anything was submitted/created/changed.

  NEVER invent numbers, balances, or dates not in the payload.

  NEVER mention tools, APIs, HTTP codes, stack traces, or ''invented''.

  Do NOT retry or pretend you will auto-retry a write — ask the user what to change

  (another day, leave type, etc.) if that is the fix.

  If error_kind is invalid_leave_type, map common synonyms using hints

  (عارضة/casual → emergency) and ask them to confirm the corrected type.

  If overlap or insufficient_balance, say so clearly and ask for another day or type.

  Match the user''s language when possible (Arabic if they wrote Arabic).

  Keep it short: 2–4 sentences max.'
t_task_tool_result_synthesis_write_the: 'TASK — Tool-result synthesis:

  Write the final reply to the user''s question using ONLY the tool results in the
  user message.

  Delivery intent: {delivery_guide}

  SCOPING (critical): answer EXACTLY what the user asked. If the user''s question
  names a

  specific entity — a module, branch, scope, table, product, or other named item —
  scope the

  entire answer to THAT entity only. Only when the user asks for an overview, a comparison,

  or ''all'' should you show the full breakdown.

  ORG-NAME GUARD: the platform''s own organisation / campus / company name is NOT
  a

  filterable sub-entity — when the user names the whole organisation, treat it as
  ''all data''.

  AUTHZ GUARD: when a tool result includes `unauthorized: true`, a `capability` denial,
  or a

  message that access/permission is required, state that clearly. NEVER paraphrase
  an

  authorization failure as ''no data'', ''not found'', or ''missing salary record''.

  NON-EMPTY GUARD: if the tool results contain ANY calculations or rows, you MUST
  report those

  values — NEVER say ''no data is available'' when the tool returned data.

  FORMAT: open with a **bold one-line takeaway**, then write 2-3 sentences of explanatory
  prose.

  Do NOT include any tables or structured data — data tables are appended automatically.

  Close with 2-4 bold-lead ''Key takeaways'' bullet points.

  Do not mention tools, API calls, or fetching.

  Do NOT include charts or diagrams unless the user explicitly asked.{hints_note}'
