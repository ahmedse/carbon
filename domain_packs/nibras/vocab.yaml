t_bilingual_en_ar_navigation_grounding_navigation: "Bilingual (EN + AR) navigation\
  \ GROUNDING.\n\nNavigation is a first-class intent, but *comprehension* of it belongs\
  \ to the\nLLM intent classifier (``intent.py``): only the LLM can tell an actual\
  \ request\nto navigate (\"take me to the people app\") from a question or complaint\
  \ that\nmerely mentions a place (\"why are you designed to show all employees' leaves?\"\
  ,\n\"مش بسألك روح مكان\"). A keyword/verb matcher cannot — it fires on any sentence\n\
  that happens to contain a verb + a place noun, including negations and\nmeta-questions.\n\
  \nSo this module does NOT decide *whether* the user wants to navigate. It only\n\
  *grounds* a target concept the LLM already chose against the instance's\n*declared*\
  \ navigation targets (see ``navigation_routes`` in ``instance.yaml``).\nThis is\
  \ the anti-hallucination guard: it never invents a destination and never\ntrusts\
  \ a raw route from the LLM — it maps a concept to a real, enumerated route.\n\n\
  Design:\n  1. Unicode normalisation — NFKC, strip tashkeel/diacritics, fold Arabic\n\
  \     orthographic variants (أإآ→ا · ة→ه · ى→ي · ؤ/ئ→ء) and kashida.\n  2. Alias\
  \ matching      — each target declares its own en/ar synonyms.\n  3. Graceful ambiguity\
  \  — multiple matches return candidates, never a dead-end.\n  4. No match      \
  \      — returns ``none`` and the normal pipeline proceeds.\n\nEntry point: :func:`ground_navigation`\
  \ — a pure function of\n``(concept, instance_config)``, no LLM, no I/O, deterministic.\n"
