t_per_message_tool_digests_pv2_1c: "Per-message tool digests (PV2-1C · Intelligence\
  \ Contract §4.3 HistoryBlock).\n\nA digest is a ≤ 200-char, scalar-only restatement\
  \ of what a turn's tools\nreturned (\"call_host_api get_my_loan_eligibility: eligible=true,\n\
  max_amount=8000, currency=SAR\"), persisted on the assistant message so the\nmodel\
  \ can recall tool facts turns later without re-querying.\n\nNever a raw payload:\n\
  \  * only successful, non-staged tool results contribute;\n  * only scalar leaves\
  \ (bool / number / short string) are kept;\n  * internal ids and restricted identifiers\
  \ (national id, IBAN, secrets…) are\n    dropped (RULE_23);\n  * records carrying\
  \ an ``org_unit_id`` outside the user's retrieval scope\n    (``{\"org_unit_ids\"\
  : [...], \"org_unit_id\": n}`` — the same dict the S2\n    applicability-first filter\
  \ consumes) are dropped (RULE_20). With no scope,\n    only unscoped records survive.\n\
  \nPure function — no Django, no I/O.\n"
