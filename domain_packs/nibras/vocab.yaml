t_true_when_message_is_a_question: "True when ``message`` is a question (> 3 tokens)\
  \ without a nav verb.\n\n    Interrogative = ends with ``?``/``؟`` or starts with\
  \ an EN/AR question word.\n    Pure noun phrases (\"payroll\", \"الرواتب\") and\
  \ explicit commands\n    (\"Can you open payroll?\") are not affected.\n    "
t_true_when_text_is_a_short: "True when ``text`` is a short \"yes, commit what you\
  \ proposed\".\n\n    :func:`is_affirmation` plus the commit vocabulary (\"apply\"\
  , \"accept\",\n    \"اعتمدها\"). Same bar: no question mark, at most\n    ``MAX_AFFIRMATION_WORDS``\
  \ words, every word affirmative. Meant for a\n    pending typed ``open_question``\
  \ (a proposed plan revision) — a longer\n    message like \"apply for three days\
  \ leave\" is a fresh request and fails.\n    "
t_true_when_the_ask_names_a: "True when the ask names a topic in ``topic_guard.in_scope``\
  \ (EN/AR).\n\n    Used to narrow the classifier's ``off_limits`` refusal: an in-scope\
  \ HR ask\n    («أريد قرض طارئ») must not be scope-refused. Bypass / credential wording\n\
  \    is never treated as in scope.\n    "
t_true_when_the_brief_asks_to: "True when the brief asks to stage a loan, not only\
  \ to read loans/leave.\n\n    «راجع قروضي ورصيد إجازتي في الوقت نفسه» is a read.\
  \ A conditional\n    «إذا لا، قدّم طلب قرض» or «أريد قرض» is a submit.\n    "
t_true_when_the_brief_has_a: "True when the brief has a condition, branch, parallel\
  \ ask, or read→write gate.\n\n    «راجع قروضي ورصيد إجازتي في الوقت نفسه. إذا كان\
  \ لدي قرض مفتوح، توقف. إذا لا،\n    قدّم طلب قرض» is a plan with a guard, not a\
  \ loan form missing its type.\n    A plain «أريد قرض طوارئ ٥٠٠٠ لمدة ١٢ شهراً» is\
  \ not composite.\n    "
t_true_when_the_tool_came_back: "True when the tool came back empty-handed in a way\
  \ a retry could fix.\n\n    A legitimately empty answer (\"you have no leave records\"\
  ) is NOT a miss —\n    only a lookup that never reached real data is.\n    "
t_true_when_the_user_explicitly_asked: True when the user explicitly asked for payslip
  lines (not basic pay).
t_true_when_the_user_wants_a: "True when the user wants a reviewable Agent plan, not\
  \ a silent skill run.\n\n    Signals (deterministic):\n    - \"make this a task\"\
  \ phrasing on the user's words;\n    - the composer dial was **Plan** (``[Pulse\
  \ mode: Plan.`` prefix) — the\n      header promises \"Pulse drafts a plan\", so\
  \ draft one.\n\n    Composite briefs (condition / parallel) do **not** force plan_task\
  \ by\n    themselves — Ask and Plan are separate sessions, and Ask must never\n\
  \    create a Tasks plan. The slot-filler still steps aside for composites\n   \
  \ so Chat does not answer a guarded brief with \"which loan type?\".\n    "
