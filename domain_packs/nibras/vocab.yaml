t_p4_3_skills_admission_gate_three: "P4.3 — Skills Admission Gate — Three Critics\
  \ + Marginal-Gain Check.\n\nBefore a draft skill can be promoted to instance_promoted,\
  \ it must pass\nthree heterogeneous critics and a marginal-gain check. This is the\n\
  non-negotiable gate from MASTER-PLAN §4.\n\nCritics\n-------\n1. STRUCTURAL   (rules,\
  \ no LLM) — validates signature/body JSON, kind,\n   name collision with existing\
  \ tools.\n2. HARMLESSNESS (rules + optional LLM) — checks for dangerous patterns.\n\
  \   Only calls LLM for api_call / code_snippet kinds.\n3. CONSISTENCY  (LLM) — checks\
  \ that the new skill doesn't contradict\n   any existing instance_promoted skill.\n\
  4. MARGINAL GAIN (eval) — runs the skill on a small sample, compares\n   to baseline.\n\
  \nAll results are written to SkillAdmissionLog. Critic exceptions are\nfail-closed:\
  \ if a critic raises or returns an unparseable LLM response it\nrejects the skill\
  \ (reason ``critic_error``) and leaves it pending, so removing\nthe LLM key means\
  \ nothing is promoted.\n"
