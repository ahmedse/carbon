# Domain pack manifest (ADR-0050). The engine addresses packs by `id` through
# the registry — never by name in core code. Bump `version` when catalog,
# processes, vocabulary or banks change in a way a running instance must notice.
id: nibras
version: 1
domain: hrms
display_name: Nibras — GOFSCO People & Payroll
instance: backend/ai/engine/instances/nibras/instance.yaml
compat:
  engine: ">=2.1"
owns:
  catalog: api_catalog.yaml            # tools ⊆ instance.yaml api_catalog (ADR-0044)
  processes: processes/               # governed lifecycles + RULE_21 consent dials
  assurance: assurance/               # pack-level honesty / sim scripts
  banks:                              # per-instance behaviour evidence (gauge columns)
    g6: backend/ai/eval/g6_bank.yaml
    g5: backend/ai/eval/multiturn/scripts
    fabrication: backend/ai/eval/fabrication_bank.yaml
vocabulary_note: >
  Leave, loan, payslip, GOSI, attendance and their Arabic forms are this
  pack's words. Any occurrence inside backend/ai/engine is a leak measured by
  harness_budget.domain_terms_in_core and must trend to zero.
