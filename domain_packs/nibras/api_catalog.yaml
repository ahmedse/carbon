  # ── Submit (stage hire package) ─────────────────────────────────────────
  - capability_id: employee.onboarding.submit
    business_name: Submit employee onboarding
    purpose: >
      Stage a pending employee onboarding package capturing personal data,
      position, org unit, basic salary, join date, and contract type.
    kind: mutation
    inputs:
      request:
        type: employee.onboarding
    preconditions:
      preparer_is_authorized: true
      required_hire_fields_present: true
    permissions:
      - employee.onboarding.submit
    effects:
      mutates: employee.onboarding
      sets: status=submitted
      produces: OnboardingRequest
    side_effects:
      - onboarding_request_created
    approval_requirements:
      requires_grant: true
    requires_confirmation: true
    idempotency: dedupe by onboarding fingerprint (employee_no+join_date)
    verification:
      predicate: employee.onboarding.status_is_submitted
    failure_semantics: abort
    recovery: retry_after_fix
    owner: ai
    version: "1.0"
    host_action: employee.onboarding.submit

  # ── Review (human task, preparer ≠ approver) ────────────────────────────
  - capability_id: employee.onboarding.review
    business_name: Review employee onboarding
    purpose: >
      Create a durable human review task so an approver distinct from the
      preparer signs off before the hire is activated as payroll-eligible.
    kind: human_task
    inputs:
      onboarding_id:
        type: string
    preconditions:
      onboarding_status_is_submitted: true
    permissions:
      - employee.onboarding.review
    effects:
      creates: HumanTask
    side_effects:
