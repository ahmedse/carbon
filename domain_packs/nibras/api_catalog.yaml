    effects:
      mutates: employee.onboarding
      sets: status=active
      produces: EmployeeRecord
    side_effects:
      - employee_activated
      - contract_activated
      - irreversible
    approval_requirements:
      requires_grant: true
      human_reviewer: true
    requires_confirmation: true
    idempotency: dedupe by onboarding_id (an activated hire cannot be re-activated)
    verification:
      predicate: employee.onboarding.completed_and_payroll_eligible
    failure_semantics: abort
    recovery: manual_reconciliation
    owner: ai
    version: "1.0"
    host_action: employee.onboarding.activate

