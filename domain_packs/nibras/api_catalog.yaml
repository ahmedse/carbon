  # ── Activate (approved onboarding → active employee + contract) ─────────
  - capability_id: employee.onboarding.activate
    business_name: Activate employee onboarding
    purpose: >
      Finalize an approved onboarding package as an active employee with an
      active contract, making the hire eligible for the next payroll draft.
      Irreversible for payroll eligibility purposes.
    kind: mutation
    inputs:
      onboarding_id:
        type: string
    preconditions:
      onboarding_status_is_approved: true
      review_approved: true
    permissions:
