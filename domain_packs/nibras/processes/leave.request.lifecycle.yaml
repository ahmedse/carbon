# Nibras leave request lifecycle — governed ProcessDefinition (P5a).
#
# Plane A (ADR-0045): ESS submit → Team Correspondence review → host signal
# records LeaveRecord + entitlement used_days. Agent dial (Plane B) stages
# **submit only** with RULE_21 consent; it does not run record/activate.
#
# submit (act_confirm) → review (human_only / Team) → record (host effect of
# approve — observe) → verify (observe).
id: leave.request.lifecycle
version: "1.1"
owner: ai
status: active

objects:
  - type: leave.request
    selector: request_id

inputs:
  request_id:
    type: string

scope:
  source: authenticated_host_context

objective:
  predicate: leave.request.recorded_and_entitlement_decremented

steps:
  - id: submit
    kind: command
    capability: leave.request.submit
    depends_on: []
    autonomy: act_confirm
    binds_to: leave.request
    consent: true
    idempotency_scope: request_id
    unknown_outcome: escalate

  - id: review
    kind: human_task
    capability: leave.request.review
    depends_on:
      - submit
    autonomy: human_only
    separation_of_duties:
      - requester
      - approver
    # Plane A surface: Team Approvals Inbox (Correspondence), not Pulse Agent.
    binds_to: inbox
    consent: false
    approval_ref: leave.request.review

  - id: record
    kind: command
    capability: leave.request.record
    depends_on:
      - review
    # Host side-effect of Team approve (correspondence_subject_sync) — not an
    # Agent mutation. Autonomy observe keeps the dial honest (ADR-0045).
    autonomy: observe
    binds_to: leave.request
    consent: false
    idempotency_scope: request_id
    unknown_outcome: escalate

  - id: verify
    kind: assertion
    capability: leave.request.recorded_and_entitlement_decremented
    depends_on:
      - record
    autonomy: observe
    binds_to: leave.request
    consent: false

constraints:
  precedence:
    - from: submit
      to: review
    - from: review
      to: record
    - from: record
      to: verify

evidence:
  - type: LeaveRequest
    from_step: submit
  - type: ApprovalGrant
    from_step: review
  - type: LeaveRecord
    from_step: record
  - type: LeaveEntitlement
    from_step: record

policies:
  refuse_if:
    - requester equals approver
    - request is not reviewed before record
    # Host ESS (self_views / leave_revise) returns HTTP 400 when days > remaining.
    - entitlement would go negative
  ask_if: []

exceptions: []

kill_switch: false

tests:
  - name: happy-path-recorded-and-entitlement-decremented
  - name: refuse-record-when-not-reviewed
  - name: submit-requires-human-consent
