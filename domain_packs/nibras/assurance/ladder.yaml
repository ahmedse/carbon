# Nibras tier — Excellence Ladder (ADR-0051). Seat: Nibras Master.
# Lives beside the existing assurance rules pack (pack.yaml + rules/).
tier: nibras
title: Nibras (People · My · Team · Payroll · Correspondence)
owner: nibras-master
level_names: [Unmanaged, Declared, Specified, Built, Proven, Operated, Excellent]

subjects:
  - id: nibras.module.people
    kind: module
    title: people (HRIS, payroll, attendance, loans)
    owner: nibras-master
    paths: [backend/people]
    tests: [backend/people/tests]
    adr: [.ai-toolkit/decisions/0027-governed-lookup-fk-to-referencevalue.md, .ai-toolkit/decisions/0028-single-root-org-unit-instance-gated-seeds.md]
    spec: [docs/DESIGN-NIBRAS-ENTERPRISE-HR-DATA-MODEL.md]
    app: people
  - id: nibras.module.correspondence
    kind: module
    title: correspondence (ESS spine)
    owner: nibras-master
    paths: [backend/correspondence]
    tests: [backend/correspondence/tests]
    adr: [.ai-toolkit/decisions/0030-eoffice-correspondence-engine.md]
    app: correspondence
  - id: nibras.pack
    kind: ai_pack
    title: nibras domain pack (catalog, processes, banks)
    owner: nibras-master
    paths: [domain_packs/nibras/pack.yaml, domain_packs/nibras]
    adr: [.ai-toolkit/decisions/0050-pulse-core-domain-free-versioned-packs.md]
    runbook: [docs/nibras/DEV-CREDENTIALS.md]

checks:
  - id: NIBRAS-SPC-00
    title: Nibras HR design is declared
    dimension: specified
    rank: 1
    collector: repo
    probe: { type: file_exists, file: docs/DESIGN-NIBRAS-ENTERPRISE-HR-DATA-MODEL.md }
    applies_to: [module, process, journey, ai_pack]
    solution: Keep the Nibras HR data-model design.
    source: NSR
  - id: NIBRAS-COR-01
    title: Nibras module names its test tree
    dimension: correct
    rank: 1
    collector: repo
    probe: { type: tests_present }
    applies_to: [module]
    solution: "Declare tests: for the module."
    source: NSR
  - id: NIBRAS-REL-01
    title: Nibras subject has a failure owner
    dimension: reliable
    rank: 1
    collector: repo
    probe: { type: field_nonempty, field: owner }
    applies_to: [module, process, journey, ai_pack]
    solution: Set owner on the subject.
    source: NSR
  - id: NIBRAS-OBS-01
    title: Nibras assurance pack is the declared signal
    dimension: observed
    rank: 1
    collector: repo
    probe: { type: file_exists, file: domain_packs/nibras/assurance/pack.yaml }
    applies_to: [module, process, journey, ai_pack]
    solution: Keep the Nibras assurance pack beside the ladder.
    source: assurance pack
  - id: NIBRAS-MNT-01
    title: Nibras subject paths exist
    dimension: maintainable
    rank: 1
    collector: repo
    probe: { type: paths_exist, field: paths }
    applies_to: [module, process, journey, ai_pack]
    solution: Declare paths that exist in the tree.
    source: ADR-0020
  - id: NIBRAS-SPC-01
    title: HR data model / design doc linked
    dimension: specified
    rank: 2
    collector: repo
    probe: { type: paths_exist, field: spec }
    applies_to: [module]
    solution: Link DESIGN-NIBRAS-ENTERPRISE-HR-DATA-MODEL.md under `spec:`.
    source: NSR
