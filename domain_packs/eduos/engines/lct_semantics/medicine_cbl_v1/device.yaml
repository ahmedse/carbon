id: medicine_cbl_semantics
version: 1
engine: lct_semantics
name: Medicine CBL — clinical reasoning Semantics (draft)
description: TranslationDevice for case-based learning write-ups. SD = clinical concept
  condensation; SG = case-particular vs principle. Not NAA reflective — separate pack.
discipline: medicine
genre: case_based_learning
level: ug_y3
status: draft
dimension_set:
- semantic_gravity
- semantic_density
scale:
  semantic_gravity:
    type: ordinal
    levels: [SG++, SG+, SG-, SG--]
    numeric: [1, 2, 3, 4]
    axis_note: SG+ = this patient/case particulars; SG- = pathophysiological principle.
  semantic_density:
    type: binary
    levels: [SD-, SD+]
    map:
      narrative: SD-
      condensed_clinical: SD+
    axis_note: SD+ = condensed clinical concepts (e.g. peritonism, SIRS); SD- = plain narrative.
reliability_gate:
  metric: cohen_kappa
  minimum: 0.4
  minimum_sd: 0.3
  required_for_summative: true
  held_out_status: instrument_coded_disjoint
  soft_floor_note: "Disjoint Instrument Trust coding (not clinical faculty wave yet) — soft κ floors"
hitl:
  learning_enabled: true
  promote_edits_to_anchors: true
  require_review_below_confidence: 0.7
anchors_file: anchors.yaml
boundary_pairs_file: boundary_pairs.yaml
segmentation_file: segmentation.yaml
held_out_file: held_out.jsonl
