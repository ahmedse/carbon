brief:
  title: 'OSCE Station: Abdominal Examination'
  instructions: 'You have just completed an abdominal examination on a 22-year-old
    male presenting with right iliac fossa pain, nausea, and low-grade fever (37.8°C).
    Write a structured clinical reflection (250-400 words) that:

    1. Describes the systematic approach you used in examining the patient

    2. Reports your clinical findings for each stage of the examination

    3. Identifies the key positive and negative findings

    4. Discusses the differential diagnosis based on your findings

    5. Reflects on any procedural steps you may have missed or could improve


    Your reflection should demonstrate both clinical knowledge (what you found) and
    metacognitive awareness (how well you performed the examination).'
