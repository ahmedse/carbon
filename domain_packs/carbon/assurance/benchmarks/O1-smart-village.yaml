# O1 leaf. Passed only when the open period matches close. Otherwise the API stays open.
id: O1
title: Smart Village electricity and diesel
status: passed
owner: carbon-inventory-lead
locked: 2026-09-29
product: Carbon on AASTMT
target: O1
evidence: >
  GET /carbon-api/carbon/onboarding/o1/. Scope 2 1239599.320800 kg
  location-based (2,704,187 kWh). Scope 1 8040.000000 kg (generators
  3,000 L). evaluate_o1 stays pure. Do not create
  docs/carbon/evidence/O1-smart-village.json.
limit: >
  Passed is the Smart Village match. not_assured stays unmet. Fleet
  5161 L is not this stream. Does not pass O2, O3, O4, O5, P1, P2, or
  a market-based Scope 2 total.
campus: Smart Village
campus_code: AASTMT-SV
period:
  count_open: 1
  status: open
  period_type: annual
  start_before_end: true
  boundary_required: true
sources:
  - name: Smart Village electricity
    scope: 2
    scope3_category: null
    approach: location-based
    activity_unit: kWh
    org_unit_name: Smart Village
  - name: Smart Village diesel
    scope: 1
    scope3_category: null
    activity_unit: litre
    stream:
      field: description
      exactly_one_of: [generators, fleet]
      both_is_fail: true
      empty_is_fail: true
    org_unit_name: Smart Village
coverage:
  goal_scope: "1+2"
  completeness_definition: materiality_bounded
  min_quality_tier: 4
  goal_status_until_sources_exist: absent
  goal_status_after_sources_exist: draft
  covered_requires:
    - linked_tables non-empty on this period's InventorySourceStatus
    - a Calculation row for the same reporting_period
close:
  period:
    start_date: "2023-07-01"
    end_date: "2024-06-30"
  electricity_kwh:
    "2023-07-01": 284379
    "2023-08-01": 233019
    "2023-09-01": 248068
    "2023-10-01": 264041
    "2023-11-01": 233830
    "2023-12-01": 257163
    "2024-01-01": 232689
    "2024-02-01": 199364
    "2024-03-01": 194412
    "2024-04-01": 183368
    "2024-05-01": 160356
    "2024-06-01": 213498
  diesel_litres: 3000
  diesel_stream: generators
  evidence:
    - raw/Carbon footprint app/csv/smart_village_monthly_electricity.csv
    - raw/Carbon footprint app/csv/smart_village_inventory_fy2324.csv
  limit: >
    These twelve months sum to 2704187 kWh, the FY 2023-24 inventory electricity
    total. Diesel is the annual generators row, 3000 L, not twelve invented
    months. Fleet diesel 5161 L is in that same inventory and is not this
    stream. FY 2025-26 has no Smart Village file. Do not fabricate it.
    not_assured stays unmet. Passed is this match. It is not external assurance.
evaluator:
  module: emissions.onboarding_o1
  function: evaluate_o1
  writes: false
  endpoint: GET /carbon-api/carbon/onboarding/o1/
  codes:
    - open_period_count
    - open_period_dates
    - open_period_type
    - open_period_met
    - boundary_missing
    - boundary_approach
    - boundary_met
    - source_missing
    - source_no_status
    - source_excluded
    - source_covered
    - source_covered_invalid
    - source_declared
    - diesel_stream_missing
    - diesel_stream_both
    - diesel_stream_met
    - no_calculation
    - summary_kg
    - not_assured
    - other_campus_absent
    - other_campus_no_status
    - other_campus_declared
    - other_campus_excluded
    - other_campus_excluded_notes
    - other_campus_not_material
    - other_campus_covered
    - factor_missing
    - factor_inactive
    - factor_country
    - factor_source_blank
    - factor_met
    - coverage_goal_absent
    - coverage_goal_completeness
    - coverage_goal_tier
    - coverage_goal_status
    - coverage_goal_met
  open_period_count_fields: [count, periods]
  period_fields: [id, name, period_type, start_date, end_date, status]

pulse:
  legal_number_tools:
    - get_calculation_summary
    - get_chairman_overview
  if_payload_has_no_number: say the period is opening
pass:
  - Exactly one ReportingPeriod with status open, start_date < end_date.
  - That period's organizational_boundary.consolidation_approach is equity_share, financial_control, or operational_control.
  - InventorySource "Smart Village electricity" scope 2 exists.
  - InventorySource "Smart Village diesel" scope 1 exists, and its description contains exactly one of the words generators or fleet.
  - Covered is used only under coverage.covered_requires.
  - Pulse repeats a kg or tonne figure only when that figure is in the named tool payload.
  - South Valley, Abu Qir, and Alamein are declared or excluded. They are not required to be covered.
fail:
  - A tonne figure with no calculation-summary or chairman payload.
  - status covered with empty linked_tables.
  - A second ReportingPeriod with status open, including a count that omits each period's id, name, start_date, and end_date.
  - O1 marked passed from another campus or from Scope 3.
  - target_coverage_pct stored before any InventorySource exists for the period.
