# AASTMT Carbon onboarding principles. Locked 2026-09-29.
# Target O1. Product: Carbon on AASTMT. These are not a completed inventory.
id: carbon-onboarding-principles
version: 1
owner: carbon-inventory-lead
target: O1
product: Carbon on AASTMT
locked: 2026-09-29
limit: >
  P-01–P-20 govern the O1 leaf. P-21–P-25 lock Dual Scope 2, O2–O4, O5,
  P2, and P1 as closed contracts. They do not pass those leaves. P-26
  locks later-year activity and a missing factor. On 1 Oct 2026 the
  open data-entry period is Calendar year 2026. Required streams for
  that year start missing. A missing stream is not 0 kg. Closed
  FY 2023-24 holds the Smart Village electricity and generator-diesel
  history. Closed FY 2025-26 holds only the rows already stored on it.
  Ranks stay module L2, UI L2, pack L2, and journey L5 on carbon_dev
  only. GHG Protocol Corporate Standard version 3 is a draft (CR-INV-01).

principles:
  - id: P-01
    name: Boundary before tonnes
    statement: >
      No kilogram or tonne figure is repeatable by staff until the open
      ReportingPeriod points at an OrganizationalBoundary whose
      consolidation_approach is equity_share, financial_control, or
      operational_control.
    binds: [CR-BND-01, CR-PER-01]
    violation: A footprint number is shown or spoken with no boundary on the open period.
    target: O1
    product: Carbon on AASTMT
    evidence: GET /carbon-api/carbon/onboarding/o1/ codes boundary_missing, boundary_approach, boundary_met
    locked: 2026-09-29
    limit: Does not name the boundary. Does not close O2, O3, O4, O5, P1, or P2.

  - id: P-02
    name: One open period
    statement: >
      Onboarding has exactly one ReportingPeriod with status open.
      start_date is strictly before end_date. A second open period fails CR-PER-01.
    binds: [CR-PER-01]
    violation: >
      Two periods are open, or the open period has start_date >= end_date.
      A count with no period id, name, start_date, and end_date is an incomplete
      failure record.
    target: O1
    product: Carbon on AASTMT
    evidence: GET /carbon-api/carbon/onboarding/o1/ codes open_period_count, open_period_dates, open_period_type, open_period_met
    locked: 2026-09-29
    limit: Does not choose which period to close. Draft is not open. Does not close the academy.

  - id: P-03
    name: Declared denominator
    statement: >
      Coverage uses InventorySource rows. A campus with no source row is
      absent. It is not zero percent and it is not covered.
    binds: [CR-SRC-01, CR-COV-01]
    violation: A coverage percent is published when the source list for that period is empty.
    target: O1
    product: Carbon on AASTMT
    evidence: InventorySource rows for the open period. An empty list is not zero percent.
    locked: 2026-09-29
    limit: Does not publish a coverage percent. Absence is not covered.

  - id: P-04
    name: Same-period coverage
    statement: >
      InventorySourceStatus may be covered only on the open period, only when
      that status row's linked_tables is non-empty, and only when a Calculation
      exists for that same reporting_period. A link stored on another period
      does not carry forward.
    binds: [CR-COV-01]
    violation: Status covered with an empty linked_tables, or covered because last year's link still exists.
    target: O1
    product: Carbon on AASTMT
    evidence: O1-smart-village.yaml coverage.covered_requires; codes source_covered and source_covered_invalid
    locked: 2026-09-29
    limit: A link stored on another period does not carry forward.

  - id: P-05
    name: Quality is not completeness
    statement: >
      data_quality_tier is the model scale, where 1 is better:
      1 Audited, 2 Verified, 3 Calculated, 4 Estimated, 5 Proxy.
      Onboarding accepts tier 4 Estimated. A figure that leaves the
      organisation (chairman share beyond the project, or an external report)
      needs tier 3 or better (a smaller number). Tier 5 may be stored and
      must be labeled Proxy. It is not the academy footprint.
    binds: [CR-COV-01, CR-FAC-01]
    violation: A proxy-only total is repeated as the AASTMT footprint, or tier is mixed into the coverage percent.
    target: O1
    product: Carbon on AASTMT
    evidence: InventorySourceStatus tier scale. Onboarding minimum is 4 Estimated.
    locked: 2026-09-29
    limit: Tier 5 may be stored and must be labeled Proxy. It is not the academy footprint. Does not open P1.

  - id: P-06
    name: Exclusion is a record
    statement: >
      An unmeasured campus stays declared, or becomes excluded with
      exclusion_reason insufficient_data, not_material, out_of_boundary, or
      other. Reason other requires notes. Silence is neither covered nor excluded.
    binds: [CR-EXC-01]
    violation: A campus disappears from the source list with no status row.
    target: O1
    product: Carbon on AASTMT
    evidence: Codes other_campus_absent, other_campus_no_status, other_campus_declared, other_campus_excluded
    locked: 2026-09-29
    limit: Exclusion does not cover South Valley, Abu Qir, or Alamein. Does not open O2, O3, or O4.

  - id: P-07
    name: Leaf before the academy
    statement: >
      The open benchmark is O1: campus Smart Village, source
      "Smart Village electricity" (scope 2, location-based, activity unit kWh),
      and source "Smart Village diesel" (scope 1, activity unit litre, one
      stream: generators or fleet). South Valley, Abu Qir, Alamein, and
      Scope 3 are not in O1.
    binds: [CR-SRC-01]
    violation: O1 is marked passed because another campus or a Scope 3 category was entered.
    target: O1
    product: Carbon on AASTMT
    evidence: Source names in benchmarks/O1-smart-village.yaml
    locked: 2026-09-29
    limit: Does not close Scope 3 or the other three campuses.

  - id: P-08
    name: Factors are records
    statement: >
      The factor used for O1 is an EmissionFactor row with factor_value,
      factor_unit, activity_unit, scope, and source. The activity unit on the
      data row matches the factor. Chat does not invent a factor.
    binds: [CR-FAC-01, CR-DQ-01]
    violation: A factor number appears in chat, in the onboarding checklist, or in a note with no EmissionFactor row.
    target: O1
    product: Carbon on AASTMT
    evidence: Codes factor_missing, factor_inactive, factor_country, factor_source_blank, factor_met. factor_value is omitted.
    locked: 2026-09-29
    limit: Chat does not invent a factor. This does not freeze a methodology.

  - id: P-09
    name: Pulse quotes the tool
    statement: >
      A kilogram or tonne figure in Pulse is legal only when that same number
      is in the get_calculation_summary or get_chairman_overview payload for
      the named reporting_period_id. Otherwise the answer is that the period
      is opening.
    binds: [CR-PULSE-01]
    violation: Pulse states a tonne figure that is not in the tool payload.
    target: O1
    product: Carbon on AASTMT
    evidence: summary_kg on the O1 GET. Period-wide 405271.000000 and 5269592.116320 are not O1.
    locked: 2026-09-29
    limit: get_chairman_overview is not the Smart Village footprint.

  - id: P-10
    name: Chat does not write the inventory
    statement: >
      Chat may read boundaries, periods, sources, factors, and the calculation
      summary. Creating or changing a boundary, period, source, factor, activity
      row, calculation, or coverage status is an Agent action after a person
      approves, or a host screen. ADR-0046.
    binds: [CR-WRITE-01, CR-PULSE-01]
    violation: Chat calls a host write, or Agent runs a write without approval.
    target: O1
    product: Carbon on AASTMT
    evidence: ADR-0046; instance.yaml requires_confirmation on non-GET tools; test_write_tools_require_confirmation
    locked: 2026-09-29
    limit: Does not make Agent writes silent. Memory confirm stays the only Chat write.

  - id: P-11
    name: Methodology stays provisional
    statement: >
      CR-INV-01 records that the emissions app has scopes 1, 2, and 3.
      Its catalogue stays planned. It does not block release. Corporate
      Standard version 3 is a draft and is not the binding method.
    binds: [CR-INV-01]
    violation: A release is blocked on CR-INV-01, or v3 is cited as the method in force.
    target: O1
    product: Carbon on AASTMT
    evidence: pack.yaml blocks_release is empty. Catalogue stays planned.
    locked: 2026-09-29
    limit: Does not block a release. Corporate Standard version 3 is not the method in force.

  - id: P-12
    name: Ready is a sentence
    statement: >
      A principle, rule, benchmark, or ladder cell is ready only when it names
      the target (O1), the product (Carbon on AASTMT), the evidence (file, API
      payload, or test), the date, and the limit (what it does not close).
    binds: [CR-PULSE-01]
    violation: A status of ready with no target, no evidence, no date, or no limit.
    target: O1
    product: Carbon on AASTMT
    evidence: Each principle and each CR rule names target, product, evidence, locked, and limit.
    locked: 2026-09-30
    limit: A file-level lock date does not make a row ready when one of those five is missing.

  - id: P-13
    name: Label the Scope 2 method
    statement: >
      Location-based and market-based are two totals. A Scope 2 kilogram is
      shown or spoken only with the method named. O1 electricity is
      location-based. Do not mix an unlabelled Scope 2 figure into either total.
      Do not invent a residual mix for Egypt. Do not publish a market-based
      total that copies the grid factor.
    binds: [CR-S2-01, CR-SRC-01]
    violation: A Scope 2 total is shown without location-based or market-based, or both methods are added into one unlabelled mix.
    target: O1
    product: Carbon on AASTMT
    evidence: InventorySource.scope2_method and Calculation.scope2_method. GET calculations/summary by_scope2_method. O1 electricity persists location_based.
    locked: 2026-09-30
    limit: Does not invent a residual mix. Does not add a fake market-based total. Does not open dual reporting as O2.

  - id: P-14
    name: Inventory is not an offset
    statement: >
      A credit, REC, or EAC does not reduce Calculation.co2e_kg. Inventory
      math is activity × factor. Credits stay a separate statement. Egypt
      FRA Decree 31/2024 is a market, not this footprint.
    binds: [CR-OFF-01, CR-INV-01]
    violation: A kilogram is net of an offset, credit, REC, or EAC field.
    target: O1
    product: Carbon on AASTMT
    evidence: emissions/inventory_math.py. Calculation.create_from_data_row ignores offset keys. CR-OFF-01 tests.
    locked: 2026-09-30
    limit: Does not build an Egypt credit registry. Does not treat a listed credit as assurance.

  - id: P-15
    name: Activity before factor
    statement: >
      A kWh or litre DataRow exists before a kilogram is shown. The factor is
      an EmissionFactor row. Chat does not invent either.
    binds: [CR-DQ-01, CR-FAC-01]
    violation: A kilogram appears with no activity row, or a factor is spoken with no EmissionFactor.
    target: O1
    product: Carbon on AASTMT
    evidence: Host screen /carbon/my-data. CR-DQ-01. evaluate_o1 emits no CR-DQ-01 code.
    locked: 2026-09-30
    limit: Does not create a DataTable. Does not open O5.

  - id: P-16
    name: One dataset for act and report
    statement: >
      Targets, coverage, chairman, and Pulse read the same Calculation rows.
      A ranking export or a chairman mix is not a second inventory.
    binds: [CR-COV-01, CR-PULSE-01]
    violation: A target, coverage percent, or Pulse quote uses a kilogram that is not on Calculation for that period.
    target: O1
    product: Carbon on AASTMT
    evidence: ChairmanService and CalculationSummaryService read Calculation. get_chairman_overview is not the Smart Village footprint.
    locked: 2026-09-30
    limit: Chairman mix is not O1. Does not open P2 disclosure packs.

  - id: P-17
    name: Campus owner is a person
    statement: >
      Each campus has a dataowners_group writer scoped to that org unit.
      Global enter_data is not granted to a campus user. The academy lead is
      not a silent proxy for campus entry.
    binds: [CR-OWN-01]
    violation: A campus user has unrestricted carbon:enter_data, or writes another campus's rows.
    target: O1
    product: Carbon on AASTMT
    evidence: ScopedRole dataowners_group with org_unit set. CR-OWN-01 tests. emp_1067 is not granted people:view.
    locked: 2026-09-30
    limit: Does not grant people:view to emp_1067. Does not make campus owners Django staff.

  - id: P-18
    name: Restate, do not overwrite
    statement: >
      A correction archives the old DataRow (is_archived) and appends a new
      row. values are immutable. History stays.
    binds: [CR-REST-01]
    violation: A live DataRow.values field is mutated in place.
    target: O1
    product: Carbon on AASTMT
    evidence: DataRow.save append-only. POST /rows/{id}/restate/. queryset.update cannot write values.
    locked: 2026-09-30
    limit: Does not rewrite Calculation.co2e_kg on the old run. Recalc supersedes; it does not edit the predecessor.

  - id: P-19
    name: Assurance is earned
    statement: >
      not_assured remains visible and unmet until a named verification
      engagement exists. Credits are not assurance. A VVB pack is P1.
    binds: [CR-PULSE-01]
    violation: not_assured is hidden, marked met, or treated as closed because a credit exists.
    target: O1
    product: Carbon on AASTMT
    evidence: evaluate_o1 code not_assured met false. P1 stays closed in O1-smart-village.yaml.
    locked: 2026-09-30
    limit: Does not open P1. Does not invent a VVB.

  - id: P-20
    name: Rankings are exports
    statement: >
      UI GreenMetric, QS, and STARS consume named sources. They do not
      create an academy total. A ranking file is a report.
    binds: [CR-PULSE-01]
    violation: A ranking-driven kilogram is published that is not on a named InventorySource and Calculation.
    target: O1
    product: Carbon on AASTMT
    evidence: Reports page is a shell. Ranking is not an O1 close. CR-PULSE-01.
    locked: 2026-09-30
    limit: Does not build a ranking as a goal. Does not invent campus tonnes for GreenMetric.

  - id: P-21
    name: Market-based is absent until a distinct factor
    statement: >
      Dual Scope 2 holds two labelled totals. Location-based is the Egypt
      grid factor on InventorySource.scope2_method location_based. A
      market-based row exists only when CalculationRule.factor_selector_mapping
      __market__ names an active EmissionFactor whose primary key is not the
      grid factor. Without that factor the market-based total is absent, not
      zero, and not a copy of the grid. Egypt has no residual mix in this
      product.
    binds: [CR-S2-01, CR-S2-02]
    violation: >
      A market-based kilogram is shown that used the Egypt grid factor, or
      a residual mix is invented, or market-based is shown as 0 kg because
      no contractual factor exists.
    target: O1
    product: Carbon on AASTMT
    evidence: >
      CalculationRule.calculate_for_row. GET calculations/summary
      by_scope2_method.market_based present false with reason
      no_distinct_contractual_factor. CR-S2-02 tests.
    locked: 2026-09-30
    limit: >
      Does not invent an Egypt residual mix. Does not treat unbundled RECs
      as used electricity. Does not open O2.

  - id: P-22
    name: A campus leaf is a named file
    statement: >
      O2 South Valley, O3 Abu Qir, and O4 New Alamein each require two
      InventorySource names, activity units, scopes, one diesel stream
      word, one annual period, and an exclusion record for every other
      unmeasured campus. Status stays closed until the named source file
      exists. Absence is insufficient_data, not zero kilograms.
    binds: [CR-CAM-01, CR-SRC-01, CR-EXC-01, CR-INT-01]
    violation: A campus leaf is marked passed without the named file, or kilograms are invented for a campus.
    target: O2
    product: Carbon on AASTMT
    evidence: >
      domain_packs/carbon/assurance/benchmarks/O2-south-valley.yaml,
      O3-abu-qir.yaml, O4-new-alamein.yaml. Each status closed.
    locked: 2026-09-30
    limit: >
      Does not invent kg. Does not open a second ReportingPeriod.
      evaluate_o1 stays the only O1 checklist.

  - id: P-23
    name: One named Scope 3 category
    statement: >
      O5 is GHG Protocol Scope 3 Standard 2011 category 5, Waste generated
      in operations. The only named source is "Smart Village waste disposal",
      activity unit tonne, scope 3, scope3_category 5. It is not a sector
      soup of paper, commuting, meals, and leased assets. Status stays
      closed until that InventorySource and a matching EmissionFactor exist.
    binds: [CR-S3-01]
    violation: >
      O5 is marked passed from a mixed Scope 3 pile, or a kilogram is
      invented from the 73 tonne activity line.
    target: O5
    product: Carbon on AASTMT
    evidence: >
      domain_packs/carbon/assurance/benchmarks/O5-scope3-waste.yaml.
      Activity line exists in smart_village_inventory_fy2324.csv. No kg.
    locked: 2026-09-30
    limit: >
      Does not convert 73 tonne to kg. Does not open categories 1–4 or 6–15.
      Does not treat water or chilled-water files as this category.

  - id: P-24
    name: Disclosure is a projection
    statement: >
      P2 is a labelled export of existing Calculation, InventorySource,
      ReportingPeriod, and OrganizationalBoundary fields into ESRS E1-6,
      IFRS S2, and CDP C6 column names. It does not compute a new total.
      Market-based is absent unless CR-S2-02 is met. Scope 3 is omitted
      until O5. Status stays closed until a real filing consumes the export.
    binds: [CR-DIS-01, CR-S2-01]
    violation: An export column contains a kilogram that is not on Calculation for that period.
    target: P2
    product: Carbon on AASTMT
    evidence: >
      GET /carbon-api/carbon/disclosure/. emissions/disclosure.py.
      CR-DIS-01 tests. P2-disclosure.yaml status closed.
    locked: 2026-09-30
    limit: >
      Not an ESRS, IFRS, or CDP filing. Does not mark P2 passed. Does not
      invent datapoints.

  - id: P-25
    name: A VVB pack is the only assurance close
    statement: >
      P1 stays closed while evaluate_o1 code not_assured is unmet. Closing
      P1 requires a named verification pack: assurer_name, engagement_type
      limited or reasonable, standard ISO 14064-3, opinion_date, statement_id.
      Credits, RECs, and a UI badge are not that pack.
    binds: [CR-ASR-01, CR-OFF-01]
    violation: not_assured is hidden, marked met, or treated as closed because a credit exists.
    target: P1
    product: Carbon on AASTMT
    evidence: >
      evaluate_o1 code not_assured met false. P1-assurance.yaml status closed.
      No VVB is named on carbon_dev.
    locked: 2026-09-30
    limit: Does not invent a VVB. Does not treat Egypt FRA credits as assurance.

  - id: P-26
    name: A later year stays on that year
    statement: >
      Activity for a locked later year may be stored and shown on that year.
      It never adds kilograms to the open period. A missing factor stores
      activity with inventory kg absent, not zero. The open data-entry
      period is Calendar year 2026. Required streams for that year start
      missing. A missing stream is not 0 kg.
    binds: [CR-INT-01, CR-DQ-01, CR-PER-01]
    violation: >
      A closed-year quantity is added to Calendar year 2026, a missing
      stream is stored or shown as 0 kg, or FY 2023-24 is treated as the
      open data-entry period.
    target: O2
    product: Carbon on AASTMT
    evidence: >
      emissions/campus_intake.py coverage_board and store_discovered_activity.
      emissions/tests/test_campus_intake.py. Date 1 Oct 2026. Product
      Carbon on AASTMT. The open data-entry period is Calendar year 2026,
      2026-01-01 to 2026-12-31. Required streams for that year start
      missing. A missing stream is not 0 kg. Closed FY 2023-24 holds the
      Smart Village electricity and generator-diesel history. Closed
      FY 2025-26 holds only the rows already stored on it.
    locked: 2026-10-01
    limit: >
      Does not open FY 2023-24 or FY 2025-26. Does not pass O2, O3, O4,
      or O5. Does not invent a New Alamein file. Does not move the closed
      FY 2023-24 kilograms into 2026. Does not deploy. EMISSIONS_AUTO_CALC
      stays off. evaluate_o1 stays pure. Ranks stay L2, L2, L2, and
      journey L5 on carbon_dev only.
