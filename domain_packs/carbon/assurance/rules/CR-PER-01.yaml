id: CR-PER-01
journey: INV
meaning: >
  Onboarding has exactly one ReportingPeriod with status open. start_date is
  strictly before end_date. period_type is annual for O1. Status open means
  the model choice "Open for Data Entry", not draft, locked, submitted,
  verified, rejected, or closed.
source: backend/emissions/models.py ReportingPeriod.STATUS_CHOICES
owner: carbon-inventory-lead
failure: Two open periods, a zero-length period, or activity posted against a period that is not open.
validation: >
  Filter ReportingPeriod.status == open. Fail when the count is not 1.
  Fail when start_date >= end_date. O1 fails when period_type is not annual.
when_count_is_not_one:
  code: open_period_count
  met: false
  stops_checklist: true
  fields: [count, periods]
  periods_sorted_by: id ascending
  period_fields: [id, name, period_type, start_date, end_date, status]
  status_value: open
  empty_name: the period id, as text
  omit: [closed periods, draft periods, kilograms, tonnes, calculation summary]
  lead_chooses: which period to close. The checklist does not pick one.
implementation: >
  Host screen for periods. Process step open_period is human_only and depends
  on name_boundary. This rule does not insert a period.
confidence: high-code
catalogue: planned
residual: >
  The period's display name is chosen by the inventory lead. The rule does not
  insert a period. On 1 Oct 2026 the open data-entry period is Calendar year
  2026. Required streams for that year start missing. A missing stream is not
  0 kg. Closed FY 2023-24 holds the Smart Village electricity and
  generator-diesel history. Closed FY 2025-26 holds only the rows already
  stored on it. Draft is not open. Ranks stay where the ladder files put them.
target: O1
product: Carbon on AASTMT
evidence: >
  GET /carbon-api/carbon/onboarding/o1/ codes open_period_count,
  open_period_dates, open_period_type. Date 1 Oct 2026. Product Carbon
  on AASTMT. The open data-entry period is Calendar year 2026. Required
  streams for that year start missing. A missing stream is not 0 kg.
locked: 2026-09-29
limit: Does not choose which period to close. Does not treat draft as open. Does not close O2–P2.
