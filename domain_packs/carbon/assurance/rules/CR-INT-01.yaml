id: CR-INT-01
journey: INV
meaning: >
  Activity for a locked later year may be stored and shown on that year.
  It never adds kilograms to the open period. A missing factor stores
  activity with inventory kg absent, not zero. O2, O3, O4, O5,
  market-based Scope 2, and P1 are operable without inventing a kilogram.
  A discovered file is quoted cell by cell. An open-period file that is
  absent stays a named wait, with the columns required, and the coverage
  panel shows 0 tCO2e because no Calculation was stored. Market-based
  stays absent until a ContractualScope2Factor row differs from the grid
  factor. P1 records five VVB fields and not_assured stays unmet until
  all five are present. P2 stays shape_only.
source: >
  domain_packs/carbon/assurance/benchmarks/O2-south-valley.yaml,
  O3-abu-qir.yaml, O4-new-alamein.yaml, O5-scope3-waste.yaml,
  S2-market-based.yaml, P1-assurance.yaml;
  emissions/campus_intake.py
owner: carbon-inventory-lead
failure: >
  A leaf is marked passed without its open-period file, a discovered
  FY file is posted onto the FY 2023-24 period, a later-year quantity
  adds kilograms to the open period, a missing factor is stored as 0 kg,
  a kilogram is stored from a blank month or from both diesel streams,
  market-based copies 0.4584 or an Egypt residual mix, or not_assured
  is marked met with fewer than five VVB fields.
validation: >
  intake catalogue kilograms are null. Open-period inventory filenames
  are absent. Discovered FY files that exist are quoted.
  test_campus_intake.py. evaluate_o1 stays pure.
implementation: >
  Template download, upload validation, append-only DataRow,
  archive and restate. Activity for a locked later year is stored on
  that year and is not calculated into the open period. A missing
  factor stores the activity and leaves inventory kg absent, not zero.
  Activity times factor only when the row matches the single open
  period and the factor is legal. Campus writes use carbon:enter_data
  on that org (CR-OWN-01). FY 2025-26 is not opened.
confidence: high-code
catalogue: planned
residual: >
  South Valley and Abu Qir FY 2025-26 files are not the open period.
  New Alamein has no inventory file. Waste has 73.0 ton and no tonne
  factor file. No contractual factor is committed. No VVB is committed.
target: O2
product: Carbon on AASTMT
evidence: >
  CR-INT-01. Date 1 Oct 2026. emissions/tests/test_campus_intake.py.
  raw/Carbon footprint app/csv/south_valley_scope12_fy2526.csv,
  abu_qir_monthly_electricity_fy2526.csv, abu_qir_fuel_fy2526.csv,
  smart_village_inventory_fy2324.csv. Open-period files
  south_valley_inventory.csv, abu_qir_inventory.csv,
  new_alamein_inventory.csv, and smart_village_waste_factor.csv
  are absent.
locked: 2026-10-01
limit: >
  Does not invent kg. Does not open a second ReportingPeriod.
  Does not pass O2, O3, O4, O5, P1, P2, or S2MB. Does not write an
  Egypt residual mix. Does not grant people:view to emp_1067.
  Does not edit backend/ai/engine/**. This slice is not a deploy.
