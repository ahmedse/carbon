id: CR-COV-01
journey: INV
meaning: >
  CoverageGoal for onboarding, once InventorySource rows exist, uses scope
  "1+2", completeness_definition materiality_bounded, min_quality_tier 4
  (Estimated), and status draft. target_coverage_pct is not written before
  at least the two O1 sources exist. InventorySourceStatus covered is legal
  only when that period's linked_tables is non-empty and a Calculation exists
  for the same reporting_period. Tier 1 is Audited through tier 5 Proxy, as
  on InventorySourceStatus.TIER_CHOICES. A smaller tier is better data.
source: backend/emissions/models.py CoverageGoal; InventorySourceStatus; ADR-0020
owner: carbon-inventory-lead
failure: A coverage percent with an empty source list, status covered carried from another year, or min_quality_tier left null so proxy counts as the goal.
validation: >
  While catalogue is planned, this rule reports. It does not reject a save.
  Status covered still fails the checklist when linked_tables is empty or no
  Calculation matches the open reporting_period. A CoverageGoal has no
  reporting_period field. It is org unit, scope, target year, and tier.
  Emit a goal check only when both O1 source names exist and exactly one
  period is open. Scope must be the string 1+2. Several 1+2 goals: use the
  lowest id among rows that are draft, materiality_bounded, and min_quality_tier
  4. If none match, use the lowest id 1+2 row and emit that row's failure.
  An active SBTi goal is not the O1 onboarding row when a matching draft
  exists. Do not copy target_coverage_pct onto the checklist.
codes:
  - code: coverage_goal_absent
    when: no CoverageGoal has scope 1+2
    met: false
  - code: coverage_goal_completeness
    when: completeness_definition is not materiality_bounded
    met: false
    fields: [record_id, name, completeness]
  - code: coverage_goal_tier
    when: min_quality_tier is not 4
    met: false
    fields: [record_id, name, tier]
  - code: coverage_goal_status
    when: status is not draft
    met: false
    fields: [record_id, name, status]
  - code: coverage_goal_met
    when: scope 1+2, materiality_bounded, tier 4, status draft
    met: true
    fields: [record_id, name, scope, completeness, tier, status, target_year]
    omit: [target_coverage_pct]
implementation: >
  compute_coverage on GET /carbon-api/carbon/coverage/?reporting_period=<id>.
  The onboarding page reads. It does not POST a goal.
confidence: high-code
catalogue: planned
residual: >
  target_coverage_pct is a required decimal on the model, so the goal row
  stays absent until the lead chooses a percent of the declared list. The
  page must not default that percent to 100.
target: O1
product: Carbon on AASTMT
evidence: Codes coverage_goal_absent, coverage_goal_completeness, coverage_goal_tier, coverage_goal_status, coverage_goal_met
locked: 2026-09-29
limit: Does not copy target_coverage_pct onto the checklist. An active SBTi goal is not the O1 row when a matching draft exists. Does not open P1.
