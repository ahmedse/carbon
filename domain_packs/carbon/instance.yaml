# Carbon Data Trust Platform — Pulse instance configuration.
#
# This file is the ONLY place where Carbon-specific domain knowledge is
# declared for the intelligence layer. engine_runtime.py reads it at boot;
# the engine core (cognition/, memory/, learning/) never imports from here.
#
# To bootstrap Pulse for a new project: copy engine/ to the new project,
# replace this file with instances/<new_name>/instance.yaml, write a new
# host_executor.py, and update the api_catalog + navigation_routes below.

display_name: "Carbon Data Trust Platform"

dials:
  - ask
  - plan
  - agent

description: >
  A data trust platform for the organisation's data workflows —
  the assistant helps with the data areas the user can access.

# Whole-organisation identity for Chat grounding (ORG-NAME GUARD).
tenant_org:
  name: "AASTMT"
  short_name: "AASTMT"
  aliases:
    - AASTMT
    - aastmt
    - Arab Academy
    - Arab Academy for Science, Technology & Maritime Transport
  summary: >
    Arab Academy for Science, Technology & Maritime Transport. This Carbon
    instance holds the campus data-trust spine (catalog, DQ, emissions).

persona: >
  A precise, grounded data-platform assistant. Never claim an action
  succeeded unless a tool result confirmed it. Never reveal other users'
  data, platform internals (components, databases, technologies, or how
  the assistant works), or capabilities the current user cannot access.
  For questions about platform data, ground every answer in tool results.
  For general knowledge and domain concepts, answer helpfully and connect
  to platform data when relevant. For real-time lookups relevant to the
  user's work (regulatory updates, external standards, exchange rates),
  answer and connect to platform context. For personal or unrelated
  real-time lookups (weather, sports scores, entertainment), politely
  redirect to platform capabilities instead of answering.
  Never disclose the underlying model name, AI provider, or vendor
  (e.g. Claude, GPT, OpenAI, Anthropic) — if asked what model or AI
  system powers you, reply only: "I'm the Carbon Data Trust assistant."
  You have long-term memory.
  When a user asks you to remember or store something, propose it; it is
  only saved after the user confirms the proposal.
  Never claim you lack memory or that memory is unavailable.
  For the AASTMT inventory onboarding, do not state a kilogram or tonne
  figure unless the tool result for this turn contains that figure. If it
  does not, say the period is opening. Do not copy quantities from a
  deployment sketch. The open work is Smart Village electricity and Smart
  Village diesel for one open period.   South Valley, Abu Qir, and Alamein
  stay declared or explicitly excluded. Chat does not create or change
  inventory records.

# Audience-scoped domain guidance. This is the carbon-footprint expertise a
# reader is entitled to; it names no tool, so routing stays on the catalog
# entry. It never asserts a kilogram the current turn's payload does not hold.
guidance_by_audience:
  admin: >
    You are the carbon-footprint specialist for AASTMT. Anchor every answer in
    the GHG Protocol Corporate Standard (Scope 1 direct, Scope 2 purchased
    energy, Scope 3 value chain) and IPCC AR6 global warming potentials. A total
    is kg CO2e; a tonne is kg / 1000. Inventory math is activity x emission
    factor and never subtracts an offset, credit, REC or EAC. A Scope 2 figure
    must be labelled location-based or market-based; market-based is absent
    until a distinct contractual factor exists — never the grid factor, and
    Egypt has no residual mix here. Data quality follows PCAF tiers 1-5
    (smaller is better): onboarding accepts tier 4 Estimated, tier 5 Proxy may
    be stored but is not the academy footprint. Streams are the only reporter
    of Missing / Entered / Excluded; a missing stream is not 0 kg and coverage
    never reads "complete". One reporting period is open at a time and its
    state machine is draft > open > locked > submitted > verified > closed
    (rejected returns to submitted). Assurance is not earned by recording the
    five verification fields; it needs a named ISO 14064-3 engagement with an
    opinion dated on or after the period end. A disclosure export is a labelled
    projection into ESRS E1-6, IFRS S2 and CDP C6 columns — not a filing.
    The named campuses are Smart Village (O1: electricity scope 2 location-based
    kWh, diesel scope 1 litre), South Valley, Abu Qir and New Alamein; Scope 3
    O5 is GHG Protocol category 5 only.
  hr: >
    You are the carbon-footprint specialist for AASTMT. Explain GHG Protocol
    Scope 1/2/3, kg CO2e versus tonnes, and that inventory math is activity x
    emission factor with no offset subtracted. A Scope 2 number must name its
    method (location-based or market-based); market-based is absent without a
    distinct contractual factor. Data quality is PCAF tier 1-5 (smaller is
    better); tier 5 Proxy is not the academy footprint. Coverage is the only
    reporter of Missing / Entered / Excluded and a missing stream is not 0 kg.
    One period is open at a time. Read the number from this turn's payload
    before quoting a kilogram; otherwise say the period is opening.
  ess: >
    You are the carbon-footprint helper for AASTMT. Explain in plain language:
    scopes 1/2/3, kg CO2e, that a kilogram comes from activity x emission
    factor with no offsets, and that a Scope 2 total must say location-based or
    market-based. Enter activity rows on the host screens; a missing row stays
    missing, not 0 kg. Only quote a kilogram that is in this turn's payload.

domain_topics:
  - data quality
  - data catalog
  - governance
  - carbon emissions
  - sustainability reporting
  - general knowledge and reasoning

# Opt in to Phase 6 Carbon business context injection (reporting period,
# emission factors, DQ-rule count). Other instances omit this flag or set
# it to false; they never receive Carbon-domain context.
domain_context_enabled: true

api_catalog:
  - name: get_data_product_details
    app: carbon
    method: GET
    path: /carbon-api/dataschema/tables/?module_id={id}
    description: >
      Get the data tables belonging to a data product (module).
      Path param {id} is the module/data-product id.
    requires_auth: true
    requires_confirmation: false

  - name: list_data_tables
    app: carbon
    method: GET
    path: /carbon-api/dataschema/tables/
    description: >
      List data tables visible to the user, optionally filtered
      by query param module_id.
    requires_auth: true
    requires_confirmation: false

  - name: list_dq_rules
    app: carbon
    method: GET
    path: /carbon-api/dq/rules/
    description: >
      List data-quality rules so an existing rule can be reused
      instead of creating a duplicate.
    requires_auth: true
    requires_confirmation: false

  - name: create_table
    app: carbon
    method: POST
    path: /carbon-api/dataschema/tables/
    description: >
      Create a new data table (schema change). Body:
      {"title": str, "description": str, "module": <module id>,
      "fields": [{"name": str, "label": str,
      "type": "string|number|date|boolean|select|multiselect",
      "required": bool, "description": str}]}
    requires_auth: true
    requires_confirmation: true

  - name: create_dq_rule
    app: carbon
    method: POST
    path: /carbon-api/dq/rules/
    description: >
      Create a new data-quality rule. Body:
      {"name": str, "rule_level": "business|field",
      "rule_type": str, "severity": "error|warn|info",
      "description": str,
      "dimension": "accuracy|completeness|consistency|integrity|reasonability|timeliness|uniqueness|validity",
      "definition": {"schema_version": 1, "name": str, "type": str,
      "level": "business|field", "dimension": str,
      "severity": "error|warn|info", "active": true, "params": {}}}
    requires_auth: true
    requires_confirmation: true

  - name: bind_dq_rules
    app: carbon
    method: POST
    path: /carbon-api/dq/rule-assignments/
    description: >
      Bind a DQ rule to a data table. Body:
      {"rule": <rule id>, "data_table": <table id>, "data_field": <field id|null>}.
      Alternatively pass {"table_id": <id>, "dq_rule_ids": [<ids>]}.
    requires_auth: true
    requires_confirmation: true

  - name: list_emission_factors
    app: carbon
    method: GET
    path: /carbon-api/carbon/factors
    description: >
      List active emission factors (GLOBAL reference data, kg CO2e per
      activity unit). Fields: name, code, category, scope, factor_value,
      factor_unit, activity_unit, country, source, tags.
    requires_auth: true
    requires_confirmation: false

  - name: list_gwp_gases
    app: carbon
    method: GET
    path: /carbon-api/carbon/gwp
    description: >
      List global warming potentials (GLOBAL reference data) with AR5/AR6
      GWP values for the 20-year and 100-year horizons.
    requires_auth: true
    requires_confirmation: false

  - name: list_reporting_periods
    app: carbon
    method: GET
    path: /carbon-api/carbon/periods
    description: >
      List reporting periods (GLOBAL) with name, start/end dates, status,
      and baseline flag.
    requires_auth: true
    requires_confirmation: false

  - name: get_calculation_summary
    app: carbon
    method: GET
    path: /carbon-api/carbon/calculations/summary
    description: >
      Aggregated calculation summary for the reporting period given by
      optional query param reporting_period_id. Totals are in kg CO2e
      broken down by scope, status, and MODULE (branch/campus — e.g.
      South Valley, Smart Village, Abu Qir, Alamein). Scope 2 totals
      include scope2_method (location-based or market-based) and
      by_scope2_method. O1 electricity is location-based. Do not invent
      a residual mix. Chat may quote a kilogram only when that number is
      in this turn's payload. This is the endpoint
      for questions about a specific branch's emissions/footprint: filter
      the by_module breakdown to the named branch. Plus latest run and
      last audit.
    requires_auth: true
    requires_confirmation: false

  - name: get_chairman_overview
    app: carbon
    method: GET
    path: /carbon-api/carbon/chairman
    description: >
      Single-call chairman overview (ORG-SCOPED): footprint in tonnes CO2e
      (kg / 1000), coverage, SBTi targets, actions, and trajectory.
      Optional query param reporting_period_id.
    requires_auth: true
    requires_confirmation: false

  - name: list_organizational_boundaries
    app: carbon
    method: GET
    path: /carbon-api/carbon/boundaries/
    description: >
      List organizational boundaries. Fields include name and
      consolidation_approach (equity_share, financial_control, or
      operational_control).
    requires_auth: true
    requires_confirmation: false

  - name: list_inventory_sources
    app: carbon
    method: GET
    path: /carbon-api/carbon/inventory-sources/
    description: >
      List declared inventory sources. Fields include source_name, scope,
      and org unit. A campus with no row is absent, not zero.
    requires_auth: true
    requires_confirmation: false

  - name: get_inventory_coverage
    app: carbon
    method: GET
    path: /carbon-api/carbon/coverage/
    description: >
      Read inventory coverage for the reporting period given by query
      param reporting_period. Returns the declared denominator, covered
      count, gaps, and exclusions. Does not create a coverage goal.
    requires_auth: true
    requires_confirmation: false

  - name: get_onboarding_status
    app: carbon
    method: GET
    path: /carbon-api/carbon/onboarding/o1/
    description: >
      Read the O1 onboarding checklist for the open period. Returns pass/fail
      codes for the boundary, one open period, required Smart Village sources,
      an active factor, and the not-assured state. It does not read a kilogram.
    requires_auth: true
    requires_confirmation: false

  - name: list_coverage_goals
    app: carbon
    method: GET
    path: /carbon-api/carbon/coverage-goals/
    description: >
      List coverage goals (org unit x scope x goal percent x quality floor).
      These are policy rows; live Missing / Entered / Excluded state is
      reported by the stream status surface, not here.
    requires_auth: true
    requires_confirmation: false

  - name: list_coverage_targets
    app: carbon
    method: GET
    path: /carbon-api/carbon/coverage-targets/
    description: >
      List data-completeness targets for the open period. Progress is derived
      (measured, not claimed) from real streams and never reads "complete".
    requires_auth: true
    requires_confirmation: false

  - name: list_coverage_tasks
    app: carbon
    method: GET
    path: /carbon-api/carbon/coverage-tasks/
    description: >
      List coverage tasks under a target. A task closes only when its host
      evidence is met AND the declared completeness gap actually changed.
    requires_auth: true
    requires_confirmation: false

  - name: list_inventory_source_statuses
    app: carbon
    method: GET
    path: /carbon-api/carbon/inventory-source-statuses/
    description: >
      List the per-period stream status. This is the surface that reports
      Missing, Entered, In progress, Awaiting factor and Excluded. A missing
      stream is not 0 kg.
    requires_auth: true
    requires_confirmation: false

  - name: list_recalculation_triggers
    app: carbon
    method: GET
    path: /carbon-api/carbon/recalculation-triggers/
    description: >
      List base-year recalculation triggers (structural change, methodology
      change, error correction, significance threshold) and their status.
    requires_auth: true
    requires_confirmation: false

  - name: list_calculation_rules
    app: carbon
    method: GET
    path: /carbon-api/carbon/rules/
    description: >
      List calculation rules with scope, data quality tier, and the factor
      selection mapping that keeps location-based and market-based Scope 2
      apart.
    requires_auth: true
    requires_confirmation: false

  - name: list_report_configs
    app: carbon
    method: GET
    path: /carbon-api/carbon/report-configs/
    description: >
      List reporting configurations (frameworks and included scopes) used by
      the reporting surface.
    requires_auth: true
    requires_confirmation: false

  - name: get_disclosure_export
    app: carbon
    method: GET
    path: /carbon-api/carbon/disclosure/
    description: >
      Projection of existing calculation, source, period and boundary fields
      into ESRS E1-6, IFRS S2 and CDP C6 column names. Shape only; it is not a
      filing and computes no new kilogram.
    requires_auth: true
    requires_confirmation: false

  - name: get_my_data
    app: carbon
    method: GET
    path: /carbon-api/carbon/my-data/
    description: >
      Consolidated data-owner workspace for the open period: the source rows
      this user may enter or review, and the current period state.
    requires_auth: true
    requires_confirmation: false

  - name: get_console
    app: carbon
    method: GET
    path: /carbon-api/carbon/console/
    description: >
      Operational landing payload: open-period health, data completeness,
      data-quality notices and recent activity.
    requires_auth: true
    requires_confirmation: false

  - name: run_calculation
    app: carbon
    method: POST
    path: /carbon-api/carbon/calculate/
    description: >
      Run a calculation for the named period. A host write: Agent or a host
      screen only, after a person approves.
    requires_auth: true
    requires_confirmation: true

  - name: submit_coverage_row
    app: carbon
    method: POST
    path: /carbon-api/carbon/inventory-sources/{id}/submit/
    description: >
      Submit one activity row for a source, prefilled from the coverage row.
      A host write: Agent or a host screen only, after a person approves.
    requires_auth: true
    requires_confirmation: true

  - name: exclude_coverage_row
    app: carbon
    method: POST
    path: /carbon-api/carbon/inventory-sources/{id}/exclusion/
    description: >
      Record an exclusion for a source with a reason. An exclusion is a record,
      never a zero. A host write: Agent or a host screen only.
    requires_auth: true
    requires_confirmation: true

  - name: record_assurance_engagement
    app: carbon
    method: POST
    path: /carbon-api/carbon/intake/assurance/
    description: >
      Record the five verification fields (assurer name, engagement type,
      standard, opinion date, statement id) for a period. Recording them does
      not assure the inventory. A host write: Agent or a host screen only.
    requires_auth: true
    requires_confirmation: true

