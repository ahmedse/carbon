# Carbon Data Trust Platform — Pulse instance configuration.
#
# This file is the ONLY place where Carbon-specific domain knowledge is
# declared for the intelligence layer. engine_runtime.py reads it at boot;
# the engine core (cognition/, memory/, learning/) never imports from here.
#
# To bootstrap Pulse for a new project: copy engine/ to the new project,
# replace this file with instances/<new_name>/instance.yaml, write a new
# host_executor.py, and update the api_catalog + navigation_routes below.

display_name: "Carbon Data Trust Platform"

dials:
  - ask
  - plan
  - agent

description: >
  A data trust platform for the organisation's data workflows —
  the assistant helps with the data areas the user can access.

# Whole-organisation identity for Chat grounding (ORG-NAME GUARD).
tenant_org:
  name: "AASTMT"
  short_name: "AASTMT"
  aliases:
    - AASTMT
    - aastmt
    - Arab Academy
    - Arab Academy for Science, Technology & Maritime Transport
  summary: >
    Arab Academy for Science, Technology & Maritime Transport. This Carbon
    instance holds the campus data-trust spine (catalog, DQ, emissions).

persona: >
  A precise, grounded data-platform assistant. Never claim an action
  succeeded unless a tool result confirmed it. Never reveal other users'
  data, platform internals (components, databases, technologies, or how
  the assistant works), or capabilities the current user cannot access.
  For questions about platform data, ground every answer in tool results.
  For general knowledge and domain concepts, answer helpfully and connect
  to platform data when relevant. For real-time lookups relevant to the
  user's work (regulatory updates, external standards, exchange rates),
  answer and connect to platform context. For personal or unrelated
  real-time lookups (weather, sports scores, entertainment), politely
  redirect to platform capabilities instead of answering.
  Never disclose the underlying model name, AI provider, or vendor
  (e.g. Claude, GPT, OpenAI, Anthropic) — if asked what model or AI
  system powers you, reply only: "I'm the Carbon Data Trust assistant."
  You have long-term memory.
  When a user asks you to remember or store something, propose it; it is
  only saved after the user confirms the proposal.
  Never claim you lack memory or that memory is unavailable.
  For the AASTMT inventory onboarding, do not state a kilogram or tonne
  figure unless the tool result for this turn contains that figure. If it
  does not, say the period is opening. Do not copy quantities from a
  deployment sketch. The open work is Smart Village electricity and Smart
  Village diesel for one open period. South Valley, Abu Qir, and Alamein
  stay declared or explicitly excluded. Chat does not create or change
  inventory records.

domain_topics:
  - data quality
  - data catalog
  - governance
  - carbon emissions
  - sustainability reporting
  - general knowledge and reasoning

# Opt in to Phase 6 Carbon business context injection (reporting period,
# emission factors, DQ-rule count). Other instances omit this flag or set
# it to false; they never receive Carbon-domain context.
domain_context_enabled: true

api_catalog:
  - name: get_data_product_details
    app: carbon
    method: GET
    path: /carbon-api/dataschema/tables/?module_id={id}
    description: >
      Get the data tables belonging to a data product (module).
      Path param {id} is the module/data-product id.
    requires_auth: true
    requires_confirmation: false

  - name: list_data_tables
    app: carbon
    method: GET
    path: /carbon-api/dataschema/tables/
    description: >
      List data tables visible to the user, optionally filtered
      by query param module_id.
    requires_auth: true
    requires_confirmation: false

  - name: list_dq_rules
    app: carbon
    method: GET
    path: /carbon-api/dq/rules/
    description: >
      List data-quality rules so an existing rule can be reused
      instead of creating a duplicate.
    requires_auth: true
    requires_confirmation: false

  - name: create_table
    app: carbon
    method: POST
    path: /carbon-api/dataschema/tables/
    description: >
      Create a new data table (schema change). Body:
      {"title": str, "description": str, "module": <module id>,
      "fields": [{"name": str, "label": str,
      "type": "string|number|date|boolean|select|multiselect",
      "required": bool, "description": str}]}
    requires_auth: true
    requires_confirmation: true

  - name: create_dq_rule
    app: carbon
    method: POST
    path: /carbon-api/dq/rules/
    description: >
      Create a new data-quality rule. Body:
      {"name": str, "rule_level": "business|field",
      "rule_type": str, "severity": "error|warn|info",
      "description": str,
      "dimension": "accuracy|completeness|consistency|integrity|reasonability|timeliness|uniqueness|validity",
      "definition": {"schema_version": 1, "name": str, "type": str,
      "level": "business|field", "dimension": str,
      "severity": "error|warn|info", "active": true, "params": {}}}
    requires_auth: true
    requires_confirmation: true

  - name: bind_dq_rules
    app: carbon
    method: POST
    path: /carbon-api/dq/rule-assignments/
    description: >
      Bind a DQ rule to a data table. Body:
      {"rule": <rule id>, "data_table": <table id>, "data_field": <field id|null>}.
      Alternatively pass {"table_id": <id>, "dq_rule_ids": [<ids>]}.
    requires_auth: true
    requires_confirmation: true

  - name: list_emission_factors
    app: carbon
    method: GET
    path: /carbon-api/carbon/factors
    description: >
      List active emission factors (GLOBAL reference data, kg CO2e per
      activity unit). Fields: name, code, category, scope, factor_value,
      factor_unit, activity_unit, country, source, tags.
    requires_auth: true
    requires_confirmation: false

  - name: list_gwp_gases
    app: carbon
    method: GET
    path: /carbon-api/carbon/gwp
    description: >
      List global warming potentials (GLOBAL reference data) with AR5/AR6
      GWP values for the 20-year and 100-year horizons.
    requires_auth: true
    requires_confirmation: false

  - name: list_reporting_periods
    app: carbon
    method: GET
    path: /carbon-api/carbon/periods
    description: >
      List reporting periods (GLOBAL) with name, start/end dates, status,
      and baseline flag.
    requires_auth: true
    requires_confirmation: false

  - name: get_calculation_summary
    app: carbon
    method: GET
    path: /carbon-api/carbon/calculations/summary
    description: >
      Aggregated calculation summary for the reporting period given by
      optional query param reporting_period_id. Totals are in kg CO2e
      broken down by scope, status, and MODULE (branch/campus — e.g.
      South Valley, Smart Village, Abu Qir, Alamein). Scope 2 totals
      include scope2_method (location-based or market-based) and
      by_scope2_method. O1 electricity is location-based. Do not invent
      a residual mix. Chat may quote a kilogram only when that number is
      in this turn's payload. This is the endpoint
      for questions about a specific branch's emissions/footprint: filter
      the by_module breakdown to the named branch. Plus latest run and
      last audit.
    requires_auth: true
    requires_confirmation: false

  - name: get_chairman_overview
    app: carbon
    method: GET
    path: /carbon-api/carbon/chairman
    description: >
      Single-call chairman overview (ORG-SCOPED): footprint in tonnes CO2e
      (kg / 1000), coverage, SBTi targets, actions, and trajectory.
      Optional query param reporting_period_id.
    requires_auth: true
    requires_confirmation: false

  - name: list_organizational_boundaries
    app: carbon
    method: GET
    path: /carbon-api/carbon/boundaries/
    description: >
      List organizational boundaries. Fields include name and
      consolidation_approach (equity_share, financial_control, or
      operational_control).
    requires_auth: true
    requires_confirmation: false

  - name: list_inventory_sources
    app: carbon
    method: GET
    path: /carbon-api/carbon/inventory-sources/
    description: >
      List declared inventory sources. Fields include source_name, scope,
      and org unit. A campus with no row is absent, not zero.
    requires_auth: true
    requires_confirmation: false

  - name: get_inventory_coverage
    app: carbon
    method: GET
    path: /carbon-api/carbon/coverage/
    description: >
      Read inventory coverage for the reporting period given by query
      param reporting_period. Returns the declared denominator, covered
      count, gaps, and exclusions. Does not create a coverage goal.
    requires_auth: true
    requires_confirmation: false

navigation_routes:
  - name: carbon_onboarding
    app: carbon
    type: page
    path: /carbon/onboarding
    description: >
      AASTMT inventory onboarding. Staff open one period and enter Smart
      Village electricity and diesel, or record an explicit gap.
    label: Inventory onboarding
    labels:
      en: [onboarding, inventory onboarding, carbon onboarding, smart village]
      ar: [التهيئة, تهيئة المخزون, تهيئة البصمة, القرية الذكية]

  - name: carbon_home
    app: carbon
    type: app
    path: /carbon/chairman
    description: Carbon footprint app home (chairman dashboard).
    label: Carbon Dashboard
    labels:
      en: [carbon, carbon app, carbon footprint, chairman, chairman dashboard, emissions, footprint]
      ar: [الكربون, البصمة الكربونية, لوحة الرئيس, الانبعاثات, البصمة]

  - name: carbon_dashboard
    app: carbon
    type: page
    path: /carbon/dashboard
    description: Carbon analytics dashboard.
    label: Carbon Analytics
    labels:
      en: [carbon dashboard, analytics, analytics dashboard, emissions dashboard]
      ar: [لوحة التحليلات, تحليلات الكربون, لوحة الانبعاثات]

  - name: dq_home
    app: carbon
    type: app
    path: /dq
    description: Data-quality workspace (rules, results, reference sets).
    label: Data Quality
    labels:
      en: [data quality, dq, dq workspace, data quality rules, quality]
      ar: [جودة البيانات, جودة, قواعد الجودة]

  - name: catalog_home
    app: carbon
    type: app
    path: /catalog
    description: Data catalog (products, tables, metadata, mdm).
    label: Data Catalog
    labels:
      en: [catalog, data catalog, metadata, data products, mdm]
      ar: [الكتالوج, فهرس البيانات, البيانات الوصفية, منتجات البيانات]

  - name: emissions_home
    app: carbon
    type: app
    path: /emissions
    description: Emissions dashboard and reporting.
    label: Emissions
    labels:
      en: [emissions, emissions report, emissions reporting]
      ar: [الانبعاثات, تقارير الانبعاثات]

  - name: dq_rule_detail
    app: carbon
    type: entity
    path: /dq/rules/{id}
    description: Data-quality rule detail page.

  - name: dq_rule_results
    app: carbon
    type: entity
    path: /dq/rules/{id}/results
    description: Data-quality rule results page.
