tracks:
  D: {title: "إدخال البيانات وجمعها", blurb: "مصادرك: اعثر عليها، واملأها، وحافظ على نظافتها."}
  L: {title: "إدارة الجرد", blurb: "افتح الفترة، وعرّف المصادر، وغطِّها أو استبعدها."}
  C: {title: "الفترة والرقم", blurb: "ماذا يسمح به reporting period مفتوحة، وماذا يعني data quality tier."}
blockers:
  no_open_period: {title: "لا توجد reporting period مفتوحة", body: "إدخال البيانات يحتاج reporting period واحدة بالضبط. يفتح قائد الكربون واحدة من صفحة فترات التقارير."}
  many_open_periods: {title: "أكثر من reporting period مفتوحة", body: "يجب أن تكون reporting period واحدة فقط مفتوحة. يقفل قائد الكربون الأخريات أو يغلقها من صفحة فترات التقارير."}
  no_source_in_scope: {title: "لم يُسند إليك أي source بعد", body: "يعتمد هذا الدرس على مصادرك أنت. يعرّفها قائد الكربون في coverage ويمنحك الوحدة التنظيمية."}
  probe_missing: {title: "الدرس غير متاح", body: "هذا الدرس غير مرتبط بالتطبيق بعد."}
journey:
  title: "رحلة الكربون التعريفية"
  intro: "تعلّمك هذه الرحلة مهمة الجرد الكربوني كاملة، لا مجرد جولة في الصفحات. تسير بك من فتح reporting period، إلى تعريف المصادر وcoverage، إلى إدخال activity data وفحصها، إلى calculation والقفل وذكر الرقم بصدق. كل station مفتوحة دائمًا ولا شيء مقفل. لا تكتمل station إلا عندما يثبتها التطبيق الحقيقي: row محفوظ، أو source مغطّى، أو boundary، أو calculation شغّلتها. يمكنك العمل أثناء القراءة: ثبّت الرحلة في الجانب وأبقِ صفحة التطبيق أمامك."
stages:
  setup: {title: "التهيئة والسياسة", what: "تُضبط هنا reporting period المفتوحة الواحدة وemission factor. تبقى period واحدة مفتوحة، ويحتاج كل source إلى emission factor نشط من النطاق نفسه. هنا يأخذ العام عموده الفقري."}
  coverage: {title: "أهداف coverage", what: "ينتهي كل source معرَّف إلى مغطّى بالبيانات أو مستبعد بسبب مذكور. نطاقك التنظيمي يحدد المصادر التي تراها. هنا لا يبقى شيء ناقصًا بصمت."}
  data_products: {title: "منتجات البيانات", what: "ستجلب منتجات البيانات القابلة لإعادة الاستخدام صفوفًا كثيرة في شكل واحد. هذا المسار غير موصول بالتطبيق بعد، فلا يوجد عمل مطلوب هنا اليوم."}
  data_entry: {title: "إدخال البيانات", what: "Campus intake هي حيث تُدخل activity rows لهذه الفترة: أضف صفًا من قراءة عدّاد أو فاتورة حقيقية فقط، بالوحدة التي يتوقعها factor؛ والمصدر بلا صف حقيقي يبقى ناقصًا — لا يُختَرع شيء. الrow المحفوظ هو الإثبات على اكتمال هذه station."}
  calculation: {title: "الاحتساب والجودة", what: "يحوّل calculation صفوف activity data إلى انبعاثات باستخدام factor المصدر. تشير علامات الجودة إلى الصفوف الناجحة أو التحذيرية أو الفاشلة. أصلح الفاشلة قبل التحذيرات."}
  lock: {title: "القفل والإغلاق", what: "اضبط boundary، ثم انقل reporting period من مفتوحة إلى مقفلة إلى مقدَّمة، وليقرر مدقق الاعتماد أو الرفض. لا تُغلق period مباشرة من المفتوحة."}
  report: {title: "التقرير والإفصاح", what: "اقرأ ملخص calculation وبيّن scope أي رقم قبل الاقتباس منه. الفترة في رأس الصفحة عنوان وليست مرشِّحًا."}
competencies:
  open_period: {title: "أبقِ reporting period واحدة فقط مفتوحة", good: "تعرض فترات التقارير صفًا واحدًا بحالة open، ولا صف open ثانٍ."}
  sources_factors: {title: "عرّف المصادر وطابِق emission factor نشطًا", good: "لكل source معرَّف emission factor نشط من النطاق والوحدة نفسيهما."}
  period_status: {title: "اقرأ حالة reporting period", good: "تستطيع تسمية ما هو مسموح الآن من الحالة وحدها."}
  tiers: {title: "اقرأ data quality tier ووسم not assured", good: "تستطيع تفسير سبب عرض رقم من tier 4 أو 5 على أنه not assured."}
  cover_exclude: {title: "غطِّ كل source أو استبعده بسبب", good: "تعرض coverage كل source إما مغطّى بجدول مرتبط أو مستبعدًا بسبب."}
  handoff: {title: "سلّم الصفوف إلى القائد", good: "تخبر القائد أن الصفوف وصلت ونظيفة، والقائد يملك قرار coverage."}
  what_owed: {title: "سمِّ ما هو مطلوب منك هذه الفترة", good: "تستطيع الإشارة إلى source الأقل صفوفًا وبيان سبب كونه فجوة."}
  one_row: {title: "احفظ activity row واحدًا لمصدرك", good: "يعرض My Data صفًا حفظته بالوحدة التي يتوقعها factor دون تقريب ليكون مرتبًا."}
  data_product: {title: "استخدم data product لجلب صفوف كثيرة", good: "تمرّر ملفًا بترتيب: upload ثم map columns ثم validate."}
  calculation: {title: "شغّل calculation واقرأ أعدادَه", good: "يوجد run باسمك، وتقرأ أعداد created وskipped وerror قبل إعادة التشغيل."}
  restate: {title: "أعِد إدخال الrow دون محو activity", good: "تصلح الrow دون مضاعفة احتساب activity."}
  quality: {title: "اقرأ حالة جودة الrow", good: "تصلح الصفوف الفاشلة أولًا وتشرح لماذا يمكن للتحذيرات أن تنتظر."}
  boundary: {title: "اضبط boundary لـ reporting period المفتوحة", good: "تشير reporting period المفتوحة إلى boundary له نهج توحيد."}
  legal_transition: {title: "سمِّ الانتقال القانوني التالي للـ period", good: "تسمّي الانتقال من open إلى locked، ولا تُغلق مباشرة من open."}
  lock_read: {title: "اقرأ reporting period مقفلة أو مرفوضة", good: "تقرأ ملاحظة المدقق وتجهّز تصحيحًا بدل إعادة إدخال الصفوف."}
  quote_scope: {title: "بيّن scope أي إجمالي تقتبسه", good: "تذكر بالكلمات ما الذي يجمعه الرقم قبل الاقتباس منه."}
lessons:
  D1:
    title: "ما المطلوب مني في هذه الفترة"
    know: "تعرض صفحة إدخال البيانات المنتجات التي تملكها في reporting period المفتوحة. كل منتج source يعتمد عليه غيرك. الsource بلا صفوف فجوة، والإجمالي لا يكتمل إلا بمصادره."
    do: "افتح إدخال البيانات واقرأ القائمة. ابحث عن الsource الأقل صفوفًا."
    dont: "لا تُدخل بيانات لـ source لا تملكه. لن يظهر في قائمتك."
    steps:
      - {title: "أدخل صفوف هذه الفترة في Campus intake", do: "Campus intake هي حيث تُدخل activity rows لهذه الفترة. أضف صفًا من قراءة عدّاد أو فاتورة حقيقية فقط؛ والمصدر بلا صف حقيقي يبقى ناقصًا — لا يُختَرع شيء."}
      - {title: "افتح My Data", do: "افتح My Data واقرأ المصادر المعروضة في reporting period المفتوحة."}
      - {title: "اعثر على الsource الأنحف", do: "اختر الsource الأقل صفوفًا. تلك هي الفجوة التي تبدأ بها."}
    question: "أي صفحة تعرض البيانات التي تملكها في هذه الفترة؟"
    options:
      - "إدخال البيانات"
      - "نظرة رئيس المجلس"
      - "عوامل الانبعاث"
    explain: "إدخال البيانات محصور في وحداتك التنظيمية. صفحة الرئيس تعرض الصورة الكاملة، وعوامل الانبعاث إعدادات."
  D2:
    title: "أدخل activity row واحدًا"
    know: "الrow نشاط واحد — لترات وقود أو كيلوواط ساعة — مكتوب بالوحدة التي يتوقعها factor."
    do: "افتح إدخال البيانات، أضف هذا الrow إلى sourceك، واحفظه."
    dont: "لا تقرّب الرقم ولا تحوّل وحدته ليبدو مرتبًا. أدخل ما يقوله العداد أو الفاتورة."
    steps:
      - {title: "افتح My Data", do: "افتح My Data وافتح الsource الذي اخترته."}
      - {title: "أضف activity row", do: "أضف صفًا واحدًا بالكمية والوحدة كما يذكرهما العداد أو الفاتورة بالضبط."}
      - {title: "احفظ الrow", do: "اضغط حفظ. الrow المحفوظ هو الإثبات على اكتمال هذا الدرس."}
    question: "يكتمل هذا الدرس عندما تظهر صفحة إدخال البيانات صفًا حفظته."
  D3:
    title: "لماذا لم يتغير إجماليي"
    know: "حفظ الrow يسجّل activity ولا يحسب الانبعاثات. الcalculation يحوّل الصفوف إلى انبعاثات، وينفذه من يملك صلاحية الحساب، وغالبًا قائد الكربون."
    do: "بعد حفظ الrow افتح صفحة الحسابات. يظهر صفك بعد تشغيل calculation."
    dont: "لا تُدخل الrow مرة أخرى لأن الإجمالي لم يتغير. ذلك يضاعف activity."
    steps:
      - {title: "افتح Calculations", do: "افتح Calculations وتحقق هل يغطي run حالي صفك أم لا."}
    question: "حفظت الrow لكن الإجمالي لم يتغير. من يشغّل calculation؟"
    options:
      - "أنت، بتحديث الصفحة"
      - "من يملك صلاحية الحساب، وغالبًا قائد الكربون"
      - "المدقق عند الموافقة"
    explain: "الإدخال والحساب خطوتان منفصلتان بصلاحيتين منفصلتين. اطلب من قائدك تشغيله."
  D4:
    title: "اقرأ حالة الجودة"
    know: "تصنّف فحوص الجودة الrow على أنه ناجح أو تحذير أو فاشل. الفاشل يخالف قاعدة. التحذير شك يستحق نظرة ثانية."
    do: "افتح صفًا عليه علامة واقرأ السبب. أصلح الصفوف الفاشلة أولًا."
    dont: "لا تؤرشف صفًا فاشلًا ليختفي. السبب جزء من السجل."
    steps:
      - {title: "افتح الصفوف المعلّمة", do: "افتح My Data، أظهر علامة الجودة، واقرأ السبب على كل صف معلَّم."}
    question: "صف فاشل وآخر عليه تحذير. ماذا تصلح أولًا؟"
    options:
      - "التحذير"
      - "الصف الفاشل"
      - "لا شيء حتى يطلب القائد"
    explain: "الصفوف الفاشلة تخالف قاعدة وقد تعطّل الفترة. التحذيرات تنتظر حتى تزول حالات الفشل."
  D5:
    title: "مقفلة أو مرفوضة: ماذا الآن"
    know: "عند قفل reporting period تصبح صفوفها للقراءة فقط. وعند رفضها تبيّن ملاحظة المدقق ما يجب إصلاحه. في الحالتين ينقل قائد الكربون period، لا أنت."
    do: "اقرأ حالة period في إدخال البيانات. إن كانت مرفوضة فاقرأ الملاحظة وجهّز الrow المصحَّح."
    dont: "لا تؤرشف الصفوف وتعيد إدخالها للالتفاف على القفل."
    steps:
      - {title: "اقرأ حالة period", do: "افتح My Data واقرأ حالة period وأي ملاحظة مدقق قبل أن تتصرف."}
    question: "الperiod مقفلة. هل تستطيع تعديل الصفوف؟"
    options:
      - "نعم إن أسرعت"
      - "لا. اطلب من قائد الكربون إعادة فتحها"
      - "نعم، بالأرشفة وإعادة الإضافة"
    explain: "القفل يحمي ما قُدّم. القائد وحده يعيد period إلى الحالة المفتوحة."
  D6:
    title: "التسليم إلى القائد"
    know: "أنت تقدّم البيانات. وقائد الكربون يقرر هل الsource مغطّى أم مستبعد بسبب. ينتهي دورك عندما تُدخل الصفوف وتكون نظيفة."
    do: "انظر إلى حالة sourceك في القائمة. إن كانت معرَّفًا فأخبر قائدك أن الصفوف جاهزة."
    dont: "لا تستبعد source لأن جمعه صعب. هذا قرار القائد ويحتاج سببًا."
    steps:
      - {title: "تحقق من حالة الsource", do: "افتح My Data وتأكد أن sourceك يعرض أن الصفوف وصلت ونظيفة."}
    question: "من يقرر أن الsource مغطّى أو مستبعد؟"
    options:
      - "أنت بصفتك مالك البيانات"
      - "قائد الكربون"
      - "رئيس المجلس"
    explain: "الcoverage قرار جرد له صلاحيته. مالك البيانات يقدّم الصفوف والقائد يقرر coverage."
  D7:
    title: "الكثير من الصفوف: الاستيراد الجماعي"
    know: "الصفوف الكثيرة هي المهمة نفسها في ملف واحد: ارفع، ثم اربط كل عمود، ثم تحقق."
    do: "في جدولك اختر استيراد وأسقط ملفًا واحدًا حتى 10 ميغابايت."
    dont: "لا توزّع شهرًا واحدًا على عدة ملفات. استخدم ملفًا واحدًا لكل استيراد."
    steps:
      - {title: "ابدأ الاستيراد", do: "افتح My Data، اختر استيراد، وأسقط ملفًا واحدًا حتى 10 ميغابايت."}
    question: "ما خطوات المعالج بالترتيب؟"
    options:
      - "الرفع، ربط الأعمدة، التحقق"
      - "التحقق، الرفع، ربط الأعمدة"
      - "ربط الأعمدة، التحقق، الرفع"
    explain: "ترفع أولًا ليقرأ المعالج أعمدتك، ثم تربطها، ثم يتحقق قبل حفظ أي شيء."
  C2:
    title: "اقرأ حالة reporting period"
    know: "تمر period بمسودة، ثم مفتوحة، ثم مقفلة، ثم مقدَّمة، ثم موثَّقة أو مرفوضة، وأخيرًا مغلقة. الحالة تخبرك بما هو مسموح الآن."
    do: "ابحث عن period الحالية واقرأ حالتها."
    dont: "لا تفترض أن period مفتوحة لمجرد أنك تراها."
    steps:
      - {title: "افتح Reporting Periods", do: "افتح Reporting Periods واقرأ الحالة على period الحالية."}
    question: "ماذا يُسمح به أثناء فتح reporting period؟"
    options:
      - "إدخال البيانات وcalculation"
      - "لا شيء. للقراءة فقط"
      - "التوثيق فقط"
    explain: "المفتوحة هي حالة العمل. القفل يجمّدها للتقديم والتوثيق."
  C3:
    title: "المستويات و«not assured»"
    know: "لكل source data quality tier من 1 (مدقَّق) إلى 5 (تقريبي). كلما قلّ الرقم قويت الأدلة. الأرقام المبنية على مستويات ضعيفة يجب أن تصرّح بذلك."
    do: "انظر إلى tier مصدر في القائمة."
    dont: "لا تعرض رقمًا من tier 4 أو 5 على أنه موثَّق."
    steps:
      - {title: "افتح coverage", do: "افتح Inventory Coverage واقرأ data quality tier على source."}
    question: "source من tier 5 (تقريبي). كيف يُعامل رقمه؟"
    options:
      - "على أنه موثَّق"
      - "يوسَم «not assured» حتى تتوفر بيانات أفضل"
      - "يُخفى"
    explain: "التقريب تقدير مفيد وليس دليلًا. يُعرض ويوسم ويتحسن مع الوقت."
  L2:
    title: "reporting period مفتوحة واحدة"
    know: "يعمل الجرد على reporting period مفتوحة واحدة بالضبط. من دونها لا يستطيع أحد الإدخال، ومع فترتين تصبح الإجماليات والأقفال ملتبسة."
    do: "في فترات التقارير تأكد أن period واحدة فقط مفتوحة. افتح واحدة إن لم توجد، واقفل الزائدة إن تعددت."
    dont: "لا تُبقِ period قديمة مفتوحة ليكمل أحدهم إدخالًا متأخرًا."
    steps:
      - {title: "تحقق من period المفتوحة", do: "افتح Reporting Periods وتأكد أن period واحدة فقط حالتها open."}
    question: "كم period يجب أن تكون مفتوحة؟"
    options:
      - "واحدة بالضبط"
      - "واحدة لكل حرم"
      - "بقدر الحاجة"
    explain: "period مفتوحة واحدة تبقي الإدخال وcalculation والقفل على النافذة نفسها."
  L3:
    title: "عرّف المصادر واربطها بـ factor"
    know: "الsource شيء يجب قياسه: مولد أو عداد أو أسطول. عرّفه مع نطاقه. يحتاج كل source emission factor نشطًا من النطاق نفسه."
    do: "في coverage عرّف source وتأكد من وجود factor لنطاقه."
    dont: "لا تعرّف الsource نفسه مرتين بأسماء مختلفة."
    steps:
      - {title: "عرّف الsource", do: "افتح Inventory Coverage وعرّف كل source مع نطاقه."}
      - {title: "تأكد من الfactor", do: "تحقق من وجود emission factor نشط بالنطاق والوحدة نفسيهما."}
    question: "ما الذي يجب أن يتطابق بين activity row وemission factor؟"
    options:
      - "الوحدة، مثل اللتر أو الكيلوواط ساعة"
      - "عنوان الجدول"
      - "الشهر"
    explain: "الfactor يضرب كمية بوحدة محددة. عدم التطابق يعطي رقمًا خاطئًا أو لا يعطي رقمًا."
  L5:
    title: "غطِّ أو استبعد مع السبب"
    know: "كل source معرَّف ينتهي إما مغطّى بالبيانات أو مستبعدًا عن قصد. الاستبعاد يحتاج سببًا: غير جوهري أو بيانات غير كافية أو خارج boundary أو غير ذلك."
    do: "في coverage اجعل الsource مغطّى بعد ربط جدوله، أو استبعده مع سبب."
    dont: "لا تستبعد source بصمت. الفجوة غير المفسَّرة تبدو خطأ."
    steps:
      - {title: "قرّر لكل source", do: "في coverage اجعل كل source مغطّى بجدول مرتبط أو مستبعدًا بسبب مذكور."}
    question: "ماذا يتطلب استبعاد source؟"
    options:
      - "لا شيء"
      - "سبب مذكور"
      - "موافقة رئيس المجلس"
    explain: "السبب هو ما يجعل الاستبعاد قرارًا لا إغفالًا."
  L1:
    title: "الboundary أولًا"
    know: "تحدد boundary أي الكيانات تُحتسب في الجرد وكيف تُوحَّد: حصة الملكية أو السيطرة المالية أو السيطرة التشغيلية. يجب أن تشير reporting period المفتوحة إلى boundary."
    do: "في الحدود التنظيمية تأكد أن لـ period المفتوحة boundary له نهج."
    dont: "لا تغيّر النهج بعد إدخال البيانات. ستصبح كل الأرقام تعني شيئًا آخر بصمت."
    steps:
      - {title: "اضبط boundary", do: "افتح Organizational Boundaries وامنح period المفتوحة boundary له نهج توحيد."}
    question: "ماذا تحدد boundary؟"
    options:
      - "أي emission factor ينطبق"
      - "أي الكيانات تُحتسب وكيف تُوحَّد"
      - "من يحق له إدخال البيانات"
    explain: "الboundary أول قرار في الجرد. المصادر والعوامل والإجماليات كلها داخلها."
  L4:
    title: "شغّل calculation"
    know: "الcalculation يحوّل صفوف activity data إلى انبعاثات بعامل المصدر. صلاحيته منفصلة عن إدخال البيانات، وكل تشغيل يكتب سطر تدقيق يبيّن من شغّله."
    do: "في صفحة الحسابات شغّل calculation للـ period المفتوحة، ثم اقرأ أعداد التشغيل: المنشأ والمتجاوَز والأخطاء."
    dont: "لا تعِد التشغيل لترى النتيجة أسرع. اقرأ أعداد المتجاوَز والأخطاء أولًا."
    steps:
      - {title: "شغّل calculation", do: "افتح Calculations وشغّله للـ period المفتوحة."}
      - {title: "اقرأ الأعداد", do: "اقرأ أعداد created وskipped وerror قبل إعادة التشغيل."}
    question: "من يستطيع أن يرى أنك شغّلت calculation؟"
    options:
      - "كل من لديه صلاحية التدقيق: كل تشغيل يُسجَّل باسم مستخدمه"
      - "لا أحد: التشغيلات لا تُسجَّل"
      - "أنت فقط"
    explain: "كل تشغيل يكتب سطر تدقيق فيه المستخدم والوقت والأعداد."
  L6:
    title: "أقفل أو قدّم أو وثّق أو ارفض"
    know: "تنتقل period من مسودة إلى مفتوحة ثم مقفلة ثم مقدَّمة. بعدها يوثّقها المدقق أو يرفضها، والموثَّقة يمكن إغلاقها. المرفوضة تعود للإصلاح ثم تُقدَّم من جديد. الإغلاق مباشرة من المفتوحة مرفوض."
    do: "في فترات التقارير اقرأ حالة period وسمِّ الخطوة القانونية التالية."
    dont: "لا تحاول إغلاق period ما زالت مفتوحة. أقفلها أولًا."
    steps:
      - {title: "سمِّ الانتقال التالي", do: "افتح Reporting Periods، اقرأ الحالة، وسمِّ الخطوة القانونية التالية. الopen تنتقل إلى locked، ولا تُغلق مباشرة."}
    question: "الperiod مفتوحة وانتهى إدخال البيانات. ما الخطوة التالية؟"
    options:
      - "أقفلها"
      - "وثّقها"
      - "أغلقها"
    explain: "المفتوحة تنتقل إلى مقفلة. التوثيق والإغلاق يأتيان بعد التقديم."
  L7:
    title: "تحقق من الرقم قبل ذكره"
    know: "قبل أن تذكر إجماليًا اعرف ما الذي يجمعه. صفحة الرئيس تجمع كل الحسابات عبر جميع الفترات. والperiod في رأس الصفحة عنوان وليست مرشِّحًا."
    do: "افتح صفحة الرئيس وقارن إجماليها بحسابات period التي تنوي ذكرها."
    dont: "لا تذكر period الرأس على أنها scope الرقم."
    steps:
      - {title: "قارن الإجماليات", do: "افتح صفحة الرئيس وقارن إجماليها بحسابات period التي تنوي ذكرها."}
    question: "تعرض صفحة الرئيس إجماليًا تحت period س. ماذا يجمع هذا الإجمالي؟"
    options:
      - "period س فقط"
      - "كل الحسابات عبر جميع الفترات. الperiod عنوان"
      - "الصفوف الموثَّقة فقط"
    explain: "اذكر scope الرقم بالكلمات عند الاقتباس. عنوان الصفحة وحده لا يحدده."
