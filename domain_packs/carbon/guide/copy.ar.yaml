tracks:
  D: {title: "إدخال البيانات وجمعها", blurb: "مصادرك: اعثر عليها، واملأها، وحافظ على نظافتها."}
  L: {title: "إدارة الجرد", blurb: "افتح الفترة، وعرّف المصادر، وغطِّها أو استبعدها."}
  C: {title: "الفترة والرقم", blurb: "ماذا يسمح به فترة مفتوحة، وماذا يعني مستوى الجودة."}
blockers:
  no_open_period: {title: "لا توجد فترة مفتوحة", body: "إدخال البيانات يحتاج فترة مفتوحة واحدة بالضبط. يفتح قائد الكربون فترة من صفحة فترات التقارير."}
  many_open_periods: {title: "أكثر من فترة مفتوحة", body: "يجب أن تكون فترة واحدة فقط مفتوحة. يقفل قائد الكربون الفترات الأخرى أو يغلقها من صفحة فترات التقارير."}
  no_source_in_scope: {title: "لم يُسند إليك أي مصدر بعد", body: "يعتمد هذا الدرس على مصادرك أنت. يعرّفها قائد الكربون في تغطية الجرد ويمنحك الوحدة التنظيمية."}
  probe_missing: {title: "الدرس غير متاح", body: "هذا الدرس غير مرتبط بالتطبيق بعد."}
lessons:
  D1:
    title: "ما المطلوب مني في هذه الفترة"
    know: "تعرض صفحة إدخال البيانات المنتجات التي تملكها في الفترة المفتوحة. كل منتج مصدر يعتمد عليه غيرك. المصدر بلا صفوف فجوة، والإجمالي لا يكتمل إلا بمصادره."
    do: "افتح إدخال البيانات واقرأ القائمة. ابحث عن المصدر الأقل صفوفًا."
    dont: "لا تُدخل بيانات لمصدر لا تملكه. لن يظهر في قائمتك."
    question: "أي صفحة تعرض البيانات التي تملكها في هذه الفترة؟"
    options:
      - "إدخال البيانات"
      - "نظرة رئيس المجلس"
      - "عوامل الانبعاث"
    explain: "إدخال البيانات محصور في وحداتك التنظيمية. صفحة الرئيس تعرض الصورة الكاملة، وعوامل الانبعاث إعدادات."
  D2:
    title: "أدخل صف نشاط واحدًا"
    know: "الصف يسجّل نشاطًا واحدًا: لترات وقود أو كيلوواط ساعة. أدخل الكمية بالوحدة التي يتوقعها العامل. نطاق المصدر يحدد أي عامل ينطبق."
    do: "في إدخال البيانات أضف صفًا واحدًا إلى مصدرك واحفظه. يكتمل الدرس عندما يوجد الصف وتجيب عن السؤال."
    dont: "لا تقرّب الرقم ولا تحوّل وحدته ليبدو مرتبًا. أدخل ما يقوله العداد أو الفاتورة."
    question: "في أي نطاق من نطاقات الغازات الدفيئة يقع {source}؟"
    options:
      - "النطاق 1: انبعاثات مباشرة"
      - "النطاق 2: طاقة مشتراة"
      - "النطاق 3: سلسلة القيمة"
    explain: "يُحدَّد النطاق عند تعريف المصدر، وهو يحدد العامل المستخدم. تحقق منه قبل الإدخال."
  D3:
    title: "لماذا لم يتغير إجماليي"
    know: "حفظ الصف يسجّل النشاط ولا يحسب الانبعاثات. الحساب يحوّل الصفوف إلى انبعاثات، وينفذه من يملك صلاحية الحساب، وغالبًا قائد الكربون."
    do: "بعد حفظ الصف افتح صفحة الحسابات. يظهر صفك بعد تشغيل الحساب."
    dont: "لا تُدخل الصف مرة أخرى لأن الإجمالي لم يتغير. ذلك يضاعف نشاطك."
    question: "حفظت الصف لكن الإجمالي لم يتغير. من يشغّل الحساب؟"
    options:
      - "أنت، بتحديث الصفحة"
      - "من يملك صلاحية الحساب، وغالبًا قائد الكربون"
      - "المدقق عند الموافقة"
    explain: "الإدخال والحساب خطوتان منفصلتان بصلاحيتين منفصلتين. اطلب من قائدك تشغيله."
  D4:
    title: "اقرأ حالة الجودة"
    know: "تصنّف فحوص الجودة الصف على أنه ناجح أو تحذير أو فاشل. الفاشل يخالف قاعدة. التحذير شك يستحق نظرة ثانية."
    do: "افتح صفًا عليه علامة واقرأ السبب. أصلح الصفوف الفاشلة أولًا."
    dont: "لا تؤرشف صفًا فاشلًا ليختفي. السبب جزء من السجل."
    question: "صف فاشل وآخر عليه تحذير. ماذا تصلح أولًا؟"
    options:
      - "التحذير"
      - "الصف الفاشل"
      - "لا شيء حتى يطلب القائد"
    explain: "الصفوف الفاشلة تخالف قاعدة وقد تعطّل الفترة. التحذيرات تنتظر حتى تزول حالات الفشل."
  D5:
    title: "مقفلة أو مرفوضة: ماذا الآن"
    know: "عند قفل الفترة تصبح صفوفها للقراءة فقط. وعند رفضها تبيّن ملاحظة المدقق ما يجب إصلاحه. في الحالتين ينقل قائد الكربون الفترة، لا أنت."
    do: "اقرأ حالة الفترة في إدخال البيانات. إن كانت مرفوضة فاقرأ الملاحظة وجهّز الصف المصحَّح."
    dont: "لا تؤرشف الصفوف وتعيد إدخالها للالتفاف على القفل."
    question: "الفترة مقفلة. هل تستطيع تعديل الصفوف؟"
    options:
      - "نعم إن أسرعت"
      - "لا. اطلب من قائد الكربون إعادة فتحها"
      - "نعم، بالأرشفة وإعادة الإضافة"
    explain: "القفل يحمي ما قُدّم. القائد وحده يعيد الفترة إلى الحالة المفتوحة."
  D6:
    title: "التسليم إلى القائد"
    know: "أنت تقدّم البيانات. وقائد الكربون يقرر هل المصدر مغطّى أم مستبعد بسبب. ينتهي دورك عندما تُدخل الصفوف وتكون نظيفة."
    do: "انظر إلى حالة مصدرك في القائمة. إن كانت معرَّفًا فأخبر قائدك أن الصفوف جاهزة."
    dont: "لا تستبعد مصدرًا لأن جمعه صعب. هذا قرار القائد ويحتاج سببًا."
    question: "من يقرر أن المصدر مغطّى أو مستبعد؟"
    options:
      - "أنت بصفتك مالك البيانات"
      - "قائد الكربون"
      - "رئيس المجلس"
    explain: "التغطية قرار جرد له صلاحيته. مالك البيانات يقدّم الصفوف والقائد يقرر التغطية."
  D7:
    title: "الكثير من الصفوف: الاستيراد الجماعي"
    know: "لإدخال صفوف كثيرة استورد ملفًا. للمعالج ثلاث خطوات: الرفع، ثم ربط أعمدتك بحقول الجدول، ثم التحقق. يقبل ملفًا واحدًا حتى 10 ميغابايت."
    do: "في جدولك اختر استيراد، وأسقط ملفًا واحدًا، واربط كل عمود، وأصلح ما يشير إليه التحقق."
    dont: "لا توزّع شهرًا واحدًا على عدة ملفات. استخدم ملفًا واحدًا لكل استيراد."
    question: "ما خطوات المعالج بالترتيب؟"
    options:
      - "الرفع، ربط الأعمدة، التحقق"
      - "التحقق، الرفع، ربط الأعمدة"
      - "ربط الأعمدة، التحقق، الرفع"
    explain: "ترفع أولًا ليقرأ المعالج أعمدتك، ثم تربطها، ثم يتحقق قبل حفظ أي شيء."
  C2:
    title: "اقرأ حالة الفترة"
    know: "تمر الفترة بمسودة، ثم مفتوحة، ثم مقفلة، ثم مقدَّمة، ثم موثَّقة أو مرفوضة، وأخيرًا مغلقة. الحالة تخبرك بما هو مسموح الآن."
    do: "ابحث عن الفترة الحالية واقرأ حالتها."
    dont: "لا تفترض أن الفترة مفتوحة لمجرد أنك تراها."
    question: "ماذا يُسمح به أثناء فتح الفترة؟"
    options:
      - "إدخال البيانات والحساب"
      - "لا شيء. للقراءة فقط"
      - "التوثيق فقط"
    explain: "المفتوحة هي حالة العمل. القفل يجمّدها للتقديم والتوثيق."
  C3:
    title: "المستويات و«غير موثَّق»"
    know: "لكل مصدر مستوى جودة بيانات من 1 (مدقَّق) إلى 5 (تقريبي). كلما قلّ الرقم قويت الأدلة. الأرقام المبنية على مستويات ضعيفة يجب أن تصرّح بذلك."
    do: "انظر إلى مستوى مصدر في القائمة."
    dont: "لا تعرض رقمًا من المستوى 4 أو 5 على أنه موثَّق."
    question: "مصدر من المستوى 5 (تقريبي). كيف يُعامل رقمه؟"
    options:
      - "على أنه موثَّق"
      - "يوسَم «غير موثَّق» حتى تتوفر بيانات أفضل"
      - "يُخفى"
    explain: "التقريب تقدير مفيد وليس دليلًا. يُعرض ويوسم ويتحسن مع الوقت."
  L2:
    title: "فترة مفتوحة واحدة"
    know: "يعمل الجرد على فترة مفتوحة واحدة بالضبط. من دونها لا يستطيع أحد الإدخال، ومع فترتين تصبح الإجماليات والأقفال ملتبسة."
    do: "في فترات التقارير تأكد أن فترة واحدة فقط مفتوحة. افتح واحدة إن لم توجد، واقفل الزائدة إن تعددت."
    dont: "لا تُبقِ فترة قديمة مفتوحة ليكمل أحدهم إدخالًا متأخرًا."
    question: "كم فترة يجب أن تكون مفتوحة؟"
    options:
      - "واحدة بالضبط"
      - "واحدة لكل حرم"
      - "بقدر الحاجة"
    explain: "فترة مفتوحة واحدة تبقي الإدخال والحساب والقفل على النافذة نفسها."
  L3:
    title: "عرّف المصادر واربطها بعامل"
    know: "المصدر شيء يجب قياسه: مولد أو عداد أو أسطول. عرّفه مع نطاقه. يحتاج كل مصدر عامل انبعاث نشطًا من النطاق نفسه."
    do: "في تغطية الجرد عرّف مصدرًا وتأكد من وجود عامل لنطاقه."
    dont: "لا تعرّف المصدر نفسه مرتين بأسماء مختلفة."
    question: "ما الذي يجب أن يتطابق بين صف النشاط وعامل الانبعاث؟"
    options:
      - "الوحدة، مثل اللتر أو الكيلوواط ساعة"
      - "عنوان الجدول"
      - "الشهر"
    explain: "العامل يضرب كمية بوحدة محددة. عدم التطابق يعطي رقمًا خاطئًا أو لا يعطي رقمًا."
  L5:
    title: "غطِّ أو استبعد مع السبب"
    know: "كل مصدر معرَّف ينتهي إما مغطّى بالبيانات أو مستبعدًا عن قصد. الاستبعاد يحتاج سببًا: غير جوهري أو بيانات غير كافية أو خارج الحدود أو غير ذلك."
    do: "في تغطية الجرد اجعل المصدر مغطّى بعد ربط جدوله، أو استبعده مع سبب."
    dont: "لا تستبعد مصدرًا بصمت. الفجوة غير المفسَّرة تبدو خطأ."
    question: "ماذا يتطلب استبعاد مصدر؟"
    options:
      - "لا شيء"
      - "سبب مذكور"
      - "موافقة رئيس المجلس"
    explain: "السبب هو ما يجعل الاستبعاد قرارًا لا إغفالًا."
  L1:
    title: "الحدود أولًا"
    know: "تحدد الحدود أي الكيانات تُحتسب في الجرد وكيف تُوحَّد: حصة الملكية أو السيطرة المالية أو السيطرة التشغيلية. يجب أن تشير الفترة المفتوحة إلى حدود."
    do: "في الحدود التنظيمية تأكد أن للفترة المفتوحة حدودًا لها نهج."
    dont: "لا تغيّر النهج بعد إدخال البيانات. ستصبح كل الأرقام تعني شيئًا آخر بصمت."
    question: "ماذا تحدد الحدود؟"
    options:
      - "أي عامل انبعاث ينطبق"
      - "أي الكيانات تُحتسب وكيف تُوحَّد"
      - "من يحق له إدخال البيانات"
    explain: "الحدود أول قرار في الجرد. المصادر والعوامل والإجماليات كلها داخلها."
  L4:
    title: "شغّل حسابًا"
    know: "الحساب يحوّل صفوف النشاط إلى انبعاثات بعامل المصدر. صلاحيته منفصلة عن إدخال البيانات، وكل تشغيل يكتب سطر تدقيق يبيّن من شغّله."
    do: "في صفحة الحسابات شغّل الحساب للفترة المفتوحة، ثم اقرأ أعداد التشغيل: المنشأ والمتجاوَز والأخطاء."
    dont: "لا تعِد التشغيل لترى النتيجة أسرع. اقرأ أعداد المتجاوَز والأخطاء أولًا."
    question: "من يستطيع أن يرى أنك شغّلت حسابًا؟"
    options:
      - "كل من لديه صلاحية التدقيق: كل تشغيل يُسجَّل باسم مستخدمه"
      - "لا أحد: التشغيلات لا تُسجَّل"
      - "أنت فقط"
    explain: "كل تشغيل يكتب سطر تدقيق فيه المستخدم والوقت والأعداد."
  L6:
    title: "أقفل أو قدّم أو وثّق أو ارفض"
    know: "تنتقل الفترة من مسودة إلى مفتوحة ثم مقفلة ثم مقدَّمة. بعدها يوثّقها المدقق أو يرفضها، والموثَّقة يمكن إغلاقها. المرفوضة تعود للإصلاح ثم تُقدَّم من جديد. الإغلاق مباشرة من المفتوحة مرفوض."
    do: "في فترات التقارير اقرأ حالة الفترة وسمِّ الخطوة القانونية التالية."
    dont: "لا تحاول إغلاق فترة ما زالت مفتوحة. أقفلها أولًا."
    question: "الفترة مفتوحة وانتهى إدخال البيانات. ما الخطوة التالية؟"
    options:
      - "أقفلها"
      - "وثّقها"
      - "أغلقها"
    explain: "المفتوحة تنتقل إلى مقفلة. التوثيق والإغلاق يأتيان بعد التقديم."
  L7:
    title: "تحقق من الرقم قبل ذكره"
    know: "قبل أن تذكر إجماليًا اعرف ما الذي يجمعه. صفحة الرئيس تجمع كل الحسابات عبر جميع الفترات. والفترة في رأس الصفحة عنوان وليست مرشِّحًا."
    do: "افتح صفحة الرئيس وقارن إجماليها بحسابات الفترة التي تنوي ذكرها."
    dont: "لا تذكر فترة الرأس على أنها نطاق الرقم."
    question: "تعرض صفحة الرئيس إجماليًا تحت الفترة س. ماذا يجمع هذا الإجمالي؟"
    options:
      - "الفترة س فقط"
      - "كل الحسابات عبر جميع الفترات. الفترة عنوان"
      - "الصفوف الموثَّقة فقط"
    explain: "اذكر نطاق الرقم بالكلمات عند الاقتباس. عنوان الصفحة وحده لا يحدده."
