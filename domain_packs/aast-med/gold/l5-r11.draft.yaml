# DRAFT aast-med R11 gold — NOT passable on its own.
#
# Four frozen cases proving a teaching/study draft is labelled draft (ADR-0046)
# and claims no Moodle write. Chat proposes; the staff member applies the note
# in the existing Extra tab. This is CODE work: the draft door already exists
# (`_staff_draft_answer`), and the cases freeze its contract.
#
# DRAFT, not-pass. Medicine L5 stays `not_passable` while R12 has no cases and
# student_cohorts is empty (R16). Nothing here opens a student surface.
version: 1
status: draft
draft: true
not_pass: true
required_n: 4
frozen_n: 4
human_approval_required: true
real_world_prerequisite: >-
  A human must approve the draft labelling as curriculum behaviour. R11 itself
  needs no real-world data, but medicine L5 cannot flip until R12 has two real
  students and student_cohorts is non-empty (R16). No host write happens in
  any case: the reply is a proposal the staff member pastes into the Extra tab.
