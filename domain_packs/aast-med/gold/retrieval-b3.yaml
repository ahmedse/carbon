  expected_span: It is important to understand the role of the microbiota because of its significance both as a defense mechanism against infection and as a source of potentially pathogenic organisms. In addition, it is important for physicians to know the typical composition of the microbiota at various sites to avoid confusion when interpreting laboratory culture results. The composition of the human microbiota is dynamic and is influenced by age, diet, geography, medications (especially antibiotics), hormones, disease, immune status, and environmental exposures. Microbiota at different body sites 1. Blood, Body Fluids, and Tissues In health, the blood, body fluids, and tissues are sterile. Occasional organisms may be displaced across epithelial barriers as a result of trauma or during childbirth; they may be briefly recoverable from the bloodstream before they are filtered out in the pulmonary capillaries or removed by cells of the reticuloendothelial system. Such transient bacteremia may be the source of infection when structures such as damaged heart valves and foreign bodies (prostheses) are in the bloodstream. 2. Skin The skin surface provides a dry, slightly acidic, aerobic environment.
