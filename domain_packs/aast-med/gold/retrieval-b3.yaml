  expected_span: 'Asthenozoospermia: <30% progressively motile spermatozoa. Absolute asthenozoospermia is when no sperm moves at all, but they are still viable and not dead. Azoospermia: No spermatozoa in the ejaculate. Cryptozoospermia: Spermatozoa absent from fresh preparation but observed in a centrifuged pellet. Leukospermia: >1 million white blood cells/mL ejaculate (also called pyospermia and leukocytospermia). Necrospermia or Necrozoospermia: Complete when all the sperm are dead on a fresh semen sample; incomplete if 5%-45% are still viable. Normospermia: All semen parameters within the acceptable reference limits. Oligozoospermia: Sperm concentration <15 million/mL; total sperm number <39 million/ejaculate. Severe if <5 million/mL. Oligo-astheno-teratozoospermia: Disturbance of all 3 parameters. Teratozoospermia: <4% morphologically normal spermatozoa. 11 Other tests: DNA integrity test: assesses the degree of sperm DNA fragmentation. The test should be done in those with recurrent miscarriages.[94] Genetic Screening: chromosomal testing may be indicated with azoospermia or severe oligozoospermia, Imaging: Ultrasound is the initial radiological method that is used to evaluate the testis.'
