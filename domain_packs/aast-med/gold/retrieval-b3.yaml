  expected_passage_ref: MED520:file:1105:Sexual dysfunction.pdf
  expected_span: '9 Sexual dysfunction SLOs By the end of this lecture, students will be able to 1. Define erectile dysfynction 2. Describe risk factors, pathophysiology, investigations and management lines. Definition: Erectile dysfunction (ED), formerly termed impotence, is defined as the failure to achieve or maintain a rigid penile erection suitable for satisfactory sexual intercourse Physiology of erection: The critical process in penile erection activity is the relaxation of the intracavernosal smooth muscle. This process permits increased blood flow into the corpora cavernosa, which fills with blood and compresses the emissary veins, reducing venous outflow. The paraventricular and medial preoptic nuclei of the hypothalamus control this process. Signals travel through the parasympathetic nervous system to the parasympathetic nerves of the S2-S4 sacral plexus and then to the penis via the cavernosal nerves. Nitric oxide released by the cavernous nerve terminals initiates the erectile process, while nitric oxide from endothelial cells acts to maintain it. Nitric oxide stimulates the production of cyclic guanosine monophosphate (GMP) when it enters the smooth muscle.'
