  expected_passage_ref: NMD4201:file:1369:approach to patient with pain.pdf
  expected_span: 'Physician should ask the following questions: Where exactly is the pain? Does it radiate or stay localized? Radiating pain might suggest nerve involvement, while localized pain may suggest musculoskeletal issues. 2) Onset (Timing), Progress & Offset: Physician should ask about the timing of a pain, include its onset, progress and offset. The onset may be sudden or gradual. Sudden onset is typical of pain associated with an injury or with the blockage or rupture of an artery (as in myocardial infarction or a ruptured abdominal aorta) or the rupture of a viscus (such as a spontaneous pneumothorax or a perforated peptic ulcer). Most patien ts are be able to describe the precise time of onset in these examples. With a Gradual Onset , the timing may vary greatly. Acute inflammatory lesions may progress during a day or overnight, while claudication from degenerative arterial disease or the pain of an osteo -arthritic knee may build up over many years before the patient realizes that a vague ache is a specific problem and seeks medical advice. ‘Gradual’ in these examples implies a gradual awareness of the pain; it also indicates a gradual increase in the severity of the pain.'
