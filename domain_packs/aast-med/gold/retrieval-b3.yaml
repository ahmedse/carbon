  expected_span: The Centers for Disease Control and Prevention ( CDC ) issues recommendations for when and what PPE should be used to prevent exposure to infectious diseases. General rules of PPE use Don before contact with the patient. Use carefully – don’t spread contamination. Remove and discard carefully . Immediately perform hand hygiene. Factors to consider Type and degree of exposure anticipated Splash/spray versus touch Category of isolation precautions Durability and appropriateness for the task Fit or availability of correct size. Selection of PPE TYPES OF PPE Gloves – protect hands. Masks and respirators (N95)– protect mouth/nose. Gowns/aprons – protect skin and/or clothing. Goggles – protect eyes. Face shields – protect face, mouth, nose, and eyes. Head cover – protect head (hair) & forehead. SURGICAL MASK Indications of use Protect HCWs nose and mouth from splashes or sprays of large droplets. SURGICAL MASK How to don a surgical mask? Perform Hand hygiene Find the top side of the mask (nose piece up) Place over nose, mouth and chin to cover the face Fit flexible nose piece over nose bridge Secure on head with ties or elastic Fit the mask to your face and under your chin.
