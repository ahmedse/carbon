  expected_span: 'Knowing that at the beginning of the study period , there were, 200 men that were free from prostatic cancer. calculate the incidence of prostatic cancer during this year? The number of new cases = 5 The population at risk= 200 The incidence rate = (5 / 200) X 100= 2.5% Factors affecting incidence of diseases 1. Increase in the proportion of population who has the risk factor (who are at risk). 2. Appearance of new risk factors for the disease in a community. 3. Change in the etiological factors e.g., mutation of organisms; influenza virus mutation and multi-drug resistance tuberculosis (MDR-TB). 4. Change in the effectiveness of the preventive program (either decrease or increase). 5. New diagnostic tools, screening p rograms, improved case finding, and reporting of diseases may lead to apparent (or false) increase in the incident cases. Relation between incidence and prevalence Figure 1: Relation between incidence and prevalence Figure 1 shows what is called prevalence pot . It demonstrates that new cases join pre -existing cases to make up total prevalence. However prevalent cases leave the prevalence pot in one of two ways: recovery or death.'
