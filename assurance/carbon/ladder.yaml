# Carbon (emissions) hosted-app tier.
tier: carbon
title: Carbon (emissions hosted app)
owner: owner
level_names: [Unmanaged, Declared, Specified, Built, Proven, Operated, Excellent]

subjects:
  - id: carbon.module.emissions
    kind: module
    title: emissions
    owner: owner
    paths: [backend/emissions]
    tests: [backend/emissions/tests]
    adr: [.ai-toolkit/decisions/0025-typed-vs-dataschema-storage.md]
    app: emissions
  - id: carbon.ui
    kind: journey
    title: Carbon frontend app
    owner: owner
    paths:
      - carbon-frontend/src/apps/carbon
      - docs/carbon/CARBON-UI-SHELL-SPEC.md
    tests: [carbon-frontend/src/apps/carbon]
    adr: [.ai-toolkit/decisions/0016-domain-app-ai-contract.md]
  - id: carbon.pack
    kind: ai_pack
    title: Carbon Pulse pack (O1 onboarding contract)
    owner: carbon-inventory-lead
    paths:
      - domain_packs/carbon/pack.yaml
      - domain_packs/carbon/instance.yaml
      - domain_packs/carbon/vocabulary.yaml
      - domain_packs/carbon/assurance/principles.yaml
      - domain_packs/carbon/processes/inventory.onboarding.lifecycle.yaml
      - docs/carbon/CARBON-PACK-SPEC.md
    adr: [.ai-toolkit/decisions/0050-pulse-core-domain-free-versioned-packs.md]
  - id: carbon.journey.onboarding
    kind: journey
    title: AASTMT inventory onboarding leaf O1
    owner: carbon-inventory-lead
    paths:
      - domain_packs/carbon/assurance/benchmarks/O1-smart-village.yaml
      - domain_packs/carbon/assurance/principles.yaml
      - domain_packs/carbon/processes/inventory.onboarding.lifecycle.yaml
      - docs/carbon/O1-ONBOARDING-SPEC.md
      - docs/carbon/SCREEN-SPEC-O1-ONBOARDING.md
    spec:
      - domain_packs/carbon/assurance/principles.yaml
      - domain_packs/carbon/assurance/benchmarks/O1-smart-village.yaml
      - docs/carbon/O1-ONBOARDING-SPEC.md
      - docs/carbon/SCREEN-SPEC-O1-ONBOARDING.md
    adr: [.ai-toolkit/decisions/0020-inventory-coverage.md]
    tests:
      - backend/emissions/tests/test_onboarding_o1.py
      - backend/emissions/tests/test_onboarding_contract.py
      - backend/emissions/tests/test_onboarding_api.py
      - carbon-frontend/src/pages/carbon/__tests__/OnboardingPage.test.jsx

checks:
  - id: CARBON-SPC-01
    title: Emissions storage ADR is declared
    dimension: specified
    rank: 1
    collector: repo
    probe: { type: file_exists, file: .ai-toolkit/decisions/0025-typed-vs-dataschema-storage.md }
    applies_to: [module, journey]
    solution: Keep ADR-0025.
    source: ADR-0025
  - id: CARBON-COR-01
    title: Emissions module names its test tree
    dimension: correct
    rank: 1
    collector: repo
    probe: { type: tests_present }
    applies_to: [module]
    solution: "Declare tests: for the emissions module."
    source: ADR-0025
  - id: CARBON-REL-01
    title: Carbon subject has an owner
    dimension: reliable
    rank: 1
    collector: repo
    probe: { type: field_nonempty, field: owner }
    applies_to: [module, journey]
    solution: Set owner on the subject.
    source: ADR-0025
  - id: CARBON-OBS-01
    title: Carbon ladder manifest is the declared signal
    dimension: observed
    rank: 1
    collector: repo
    probe: { type: file_exists, file: assurance/carbon/ladder.yaml }
    applies_to: [module, journey]
    solution: Keep assurance/carbon/ladder.yaml.
    source: ADR-0051
  - id: CARBON-MNT-01
    title: Carbon subject paths exist
    dimension: maintainable
    rank: 1
    collector: repo
    probe: { type: paths_exist, field: paths }
    applies_to: [module, journey]
    solution: Declare paths that exist in the tree.
    source: ADR-0020

  # Pack and Carbon UI rank 1 — subject-scoped. Do not inherit onto onboarding.
  - id: CARBON-PACK-SPC-01
    title: Carbon pack names its id and version
    dimension: specified
    rank: 1
    collector: repo
    probe:
      type: file_contains
      file: domain_packs/carbon/pack.yaml
      texts: ["id: carbon", "version: 4"]
      subjects: [carbon.pack]
    applies_to: [ai_pack]
    solution: Keep pack.yaml id carbon and version 4.
    source: O1-ONBOARDING-SPEC pack rank 1
  - id: CARBON-PACK-COR-01
    title: Carbon pack principles are P-01 through P-12
    dimension: correct
    rank: 1
    collector: repo
    probe:
      type: file_contains
      file: domain_packs/carbon/assurance/principles.yaml
      texts: [P-01, P-02, P-03, P-04, P-05, P-06, P-07, P-08, P-09, P-10, P-11, P-12]
      subjects: [carbon.pack]
    applies_to: [ai_pack]
    solution: Keep the twelve principles in the pack.
    source: O1-ONBOARDING-SPEC pack rank 1
  - id: CARBON-PACK-REL-01
    title: Carbon pack subject has an owner
    dimension: reliable
    rank: 1
    collector: repo
    probe:
      type: field_nonempty
      field: owner
      subjects: [carbon.pack]
    applies_to: [ai_pack]
    solution: Keep owner on carbon.pack.
    source: O1-ONBOARDING-SPEC pack rank 1
  - id: CARBON-PACK-MNT-01
    title: Carbon pack paths exist
    dimension: maintainable
    rank: 1
    collector: repo
    probe:
      type: paths_exist
      field: paths
      subjects: [carbon.pack]
    applies_to: [ai_pack]
    solution: Keep pack paths that exist in the tree.
    source: O1-ONBOARDING-SPEC pack rank 1
  - id: CARBON-PACK-OBS-01
    title: Carbon pack does not block release
    dimension: observed
    rank: 1
    collector: repo
    probe:
      type: file_contains
      file: domain_packs/carbon/assurance/pack.yaml
      texts: ["blocks_release: []"]
      subjects: [carbon.pack]
    applies_to: [ai_pack]
    solution: Do not add a planned rule to blocks_release.
    source: O1-ONBOARDING-SPEC pack rank 1
  - id: CARBON-UI-COR-01
    title: Carbon app manifest exists
    dimension: correct
    rank: 1
    collector: repo
    probe:
      type: file_exists
      file: carbon-frontend/src/apps/carbon/manifest.js
      subjects: [carbon.ui]
    applies_to: [journey]
    solution: Keep the Carbon app manifest. Do not treat this as a test tree.
    source: O1-ONBOARDING-SPEC pack rank 1

  # Pack rank 2 — subject-scoped. Reads CARBON-PACK-SPEC.md. Does not run pack_contract.
  - id: CARBON-PACK-COR-02
    title: Pack spec has a test plan
    dimension: correct
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-PACK-SPEC.md
      text: "## Test plan"
      subjects: [carbon.pack]
    applies_to: [ai_pack]
    solution: Keep the Test plan section. Do not claim the gate ran.
    source: docs/carbon/CARBON-PACK-SPEC.md
  - id: CARBON-PACK-SEC-02
    title: Pack spec lists capabilities and roles
    dimension: secure
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-PACK-SPEC.md
      text: "## Capabilities and roles"
      subjects: [carbon.pack]
    applies_to: [ai_pack]
    solution: Keep Chat reads and confirmation on non-GET tools.
    source: docs/carbon/CARBON-PACK-SPEC.md
  - id: CARBON-PACK-REL-02
    title: Pack spec lists failure modes
    dimension: reliable
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-PACK-SPEC.md
      text: "## Failure modes"
      subjects: [carbon.pack]
    applies_to: [ai_pack]
    solution: Keep the failure-mode table.
    source: docs/carbon/CARBON-PACK-SPEC.md
  - id: CARBON-PACK-PRF-02
    title: Pack spec states the budget
    dimension: performant
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-PACK-SPEC.md
      text: "## Budget"
      subjects: [carbon.pack]
    applies_to: [ai_pack]
    solution: Keep version 4 and no invented latency.
    source: docs/carbon/CARBON-PACK-SPEC.md
  - id: CARBON-PACK-USE-02
    title: Pack staff surface has a screen spec
    dimension: usable
    rank: 2
    collector: repo
    probe:
      type: file_exists
      file: docs/carbon/SCREEN-SPEC-O1-ONBOARDING.md
      subjects: [carbon.pack]
    applies_to: [ai_pack]
    solution: Keep the O1 screen spec. Do not add a second onboarding page.
    source: docs/carbon/SCREEN-SPEC-O1-ONBOARDING.md
  - id: CARBON-PACK-MNT-02
    title: Pack module boundary is declared
    dimension: maintainable
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-PACK-SPEC.md
      text: "## Module boundary"
      subjects: [carbon.pack]
    applies_to: [ai_pack]
    solution: Keep domain words in the pack.
    source: docs/carbon/CARBON-PACK-SPEC.md
  - id: CARBON-PACK-OBS-02
    title: Pack signal threshold is defined
    dimension: observed
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-PACK-SPEC.md
      text: "## Signal threshold"
      subjects: [carbon.pack]
    applies_to: [ai_pack]
    solution: Keep version 4 and empty blocks_release as the signal.
    source: docs/carbon/CARBON-PACK-SPEC.md

  # Carbon UI shell rank 2 — subject-scoped. Does not grade every Carbon page.
  - id: CARBON-UI-SPC-02
    title: Carbon shell spec is present
    dimension: specified
    rank: 2
    collector: repo
    probe:
      type: file_exists
      file: docs/carbon/CARBON-UI-SHELL-SPEC.md
      subjects: [carbon.ui]
    applies_to: [journey]
    solution: Keep the shell spec. Do not treat it as the onboarding screen spec.
    source: docs/carbon/CARBON-UI-SHELL-SPEC.md
  - id: CARBON-UI-COR-02
    title: Shell spec has a test plan
    dimension: correct
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-UI-SHELL-SPEC.md
      text: "## Test plan"
      subjects: [carbon.ui]
    applies_to: [journey]
    solution: Keep the statement that apps/carbon has no test file.
    source: docs/carbon/CARBON-UI-SHELL-SPEC.md
  - id: CARBON-UI-SEC-02
    title: Shell spec lists capabilities and roles
    dimension: secure
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-UI-SHELL-SPEC.md
      text: "## Capabilities and roles"
      subjects: [carbon.ui]
    applies_to: [journey]
    solution: Keep role * on Inventory onboarding.
    source: docs/carbon/CARBON-UI-SHELL-SPEC.md
  - id: CARBON-UI-REL-02
    title: Shell spec lists failure modes
    dimension: reliable
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-UI-SHELL-SPEC.md
      text: "## Failure modes"
      subjects: [carbon.ui]
    applies_to: [journey]
    solution: Keep the brand-hide and hex-seed rows.
    source: docs/carbon/CARBON-UI-SHELL-SPEC.md
  - id: CARBON-UI-PRF-02
    title: Shell spec states the budget
    dimension: performant
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-UI-SHELL-SPEC.md
      text: "## Budget"
      subjects: [carbon.ui]
    applies_to: [journey]
    solution: Do not treat manifest version 1.0.0 as a latency budget.
    source: docs/carbon/CARBON-UI-SHELL-SPEC.md
  - id: CARBON-UI-USE-02
    title: Shell spec names the onboarding path
    dimension: usable
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-UI-SHELL-SPEC.md
      texts: ["/carbon/onboarding", "Inventory onboarding"]
      subjects: [carbon.ui]
    applies_to: [journey]
    solution: Keep the onboarding nav row.
    source: docs/carbon/CARBON-UI-SHELL-SPEC.md
  - id: CARBON-UI-MNT-02
    title: Shell module boundary is declared
    dimension: maintainable
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-UI-SHELL-SPEC.md
      text: "## Module boundary"
      subjects: [carbon.ui]
    applies_to: [journey]
    solution: Keep people and the engine out of this subject.
    source: docs/carbon/CARBON-UI-SHELL-SPEC.md
  - id: CARBON-UI-OBS-02
    title: Shell signal threshold is defined
    dimension: observed
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-UI-SHELL-SPEC.md
      text: "## Signal threshold"
      subjects: [carbon.ui]
    applies_to: [journey]
    solution: Keep the manifest path as the signal.
    source: docs/carbon/CARBON-UI-SHELL-SPEC.md
  - id: CARBON-UI-GOV-02
    title: Shell ADR is linked on the subject
    dimension: governed
    rank: 2
    collector: repo
    probe:
      type: paths_exist
      field: adr
      subjects: [carbon.ui]
    applies_to: [journey]
    solution: Keep ADR-0016 on carbon.ui.
    source: ADR-0016

  # O1 onboarding — subject-scoped. Do not inherit onto carbon.ui.
  - id: CARBON-ONB-COR-01
