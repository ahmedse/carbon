    applies_to: [journey]
    solution: Keep the Retry assertion. Do not add an automatic retry timer.
    source: assurance/standard/standard.yaml reliable.3
  - id: CARBON-ONB-PRF-03
    title: Two open periods stop the rest of the checklist
    dimension: performant
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/emissions/tests/test_onboarding_o1.py
      def: test_two_open_periods_ignores_factors_and_summary_kg
      texts: [O1-PRF-STOP, "factor_met", "summary_kg"]
      subjects: [carbon.journey.onboarding]
    applies_to: [journey]
    solution: Keep the early-stop assertions. Do not invent a latency number.
    source: assurance/standard/standard.yaml performant.3
  - id: CARBON-ONB-MNT-03
    title: Onboarding evaluator does not import people or the engine
    dimension: maintainable
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/emissions/tests/test_onboarding_o1.py
      def: test_onboarding_o1_module_does_not_import_people_or_engine
      texts: [O1-MNT-BOUND, "from people", "from ai.engine"]
      subjects: [carbon.journey.onboarding]
