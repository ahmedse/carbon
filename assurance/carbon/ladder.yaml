      subjects: [carbon.journey.onboarding]
    applies_to: [journey]
    solution: Keep the Failure modes table, including two open periods.
    source: assurance/standard/standard.yaml reliable.2
  - id: CARBON-ONB-PRF-02
    title: Onboarding spec states the budget
    dimension: performant
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/O1-ONBOARDING-SPEC.md
      text: "## Budget"
      subjects: [carbon.journey.onboarding]
    applies_to: [journey]
    solution: Keep the Budget section. Do not invent a latency number.
    source: assurance/standard/standard.yaml performant.2
  - id: CARBON-ONB-USE-02
    title: Onboarding screen spec is present
    dimension: usable
    rank: 2
    collector: repo
    probe:
      type: file_exists
      file: docs/carbon/SCREEN-SPEC-O1-ONBOARDING.md
      subjects: [carbon.journey.onboarding]
    applies_to: [journey]
    solution: Keep docs/carbon/SCREEN-SPEC-O1-ONBOARDING.md.
    source: assurance/standard/standard.yaml usable.2
  - id: CARBON-ONB-MNT-02
    title: Onboarding module boundary is declared
    dimension: maintainable
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/O1-ONBOARDING-SPEC.md
      text: "## Module boundary"
      subjects: [carbon.journey.onboarding]
    applies_to: [journey]
    solution: Keep the Module boundary section.
    source: assurance/standard/standard.yaml maintainable.2
  - id: CARBON-ONB-OBS-02
    title: Onboarding signal threshold is defined
    dimension: observed
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/O1-ONBOARDING-SPEC.md
      text: "## Signal threshold"
      subjects: [carbon.journey.onboarding]
    applies_to: [journey]
    solution: Keep the Signal threshold section.
    source: assurance/standard/standard.yaml observed.2
  - id: CARBON-ONB-GOV-03
    title: Onboarding ADR is linked on the subject
    dimension: governed
    rank: 2
    collector: repo
    probe:
      type: paths_exist
      field: adr
      subjects: [carbon.journey.onboarding]
    applies_to: [journey]
    solution: Keep ADR-0020 under adr on carbon.journey.onboarding.
    source: assurance/standard/standard.yaml governed.2
  - id: CARBON-ONB-SPC-10
    title: Evaluator test cites O1-COR-EVAL
    dimension: specified
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/emissions/tests/test_onboarding_o1.py
      def: test_two_open_periods_fail_closed
      texts: [O1-COR-EVAL, "open_period_count", "summary_kg"]
      subjects: [carbon.journey.onboarding]
    applies_to: [journey]
    solution: Keep the O1-COR-EVAL citation in test_two_open_periods_fail_closed.
    source: assurance/standard/standard.yaml specified.3
  - id: CARBON-ONB-SEC-03
    title: Nibras is refused the onboarding GET
    dimension: secure
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/emissions/tests/test_onboarding_api.py
      def: test_nibras_brand_is_forbidden
      texts: [O1-SEC-BRAND, "assert resp.status_code == 403", "nibras"]
      subjects: [carbon.journey.onboarding]
