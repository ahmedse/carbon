      text: "## Test plan"
      subjects: [carbon.journey.onboarding]
    applies_to: [journey]
    solution: Keep the Test plan section, with the four named suites.
    source: assurance/standard/standard.yaml correct.2
  - id: CARBON-ONB-SEC-02
    title: Onboarding spec lists capabilities and roles
    dimension: secure
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/O1-ONBOARDING-SPEC.md
      text: "## Capabilities and roles"
      subjects: [carbon.journey.onboarding]
    applies_to: [journey]
    solution: Keep the Capabilities and roles section.
    source: assurance/standard/standard.yaml secure.2
  - id: CARBON-ONB-REL-02
    title: Onboarding spec lists failure modes
    dimension: reliable
    rank: 2
    collector: repo
    probe:
      type: file_contains
