      type: file_contains
      file: docs/carbon/CARBON-MODULE-SPEC.md
      text: "## Test plan"
      subjects: [carbon.module.emissions]
    applies_to: [module]
    solution: Keep the named suites. Do not steal onboarding --run tokens.
    source: docs/carbon/CARBON-MODULE-SPEC.md
  - id: CARBON-MOD-SEC-02
    title: Emissions module spec lists capabilities and roles
    dimension: secure
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/carbon/CARBON-MODULE-SPEC.md
