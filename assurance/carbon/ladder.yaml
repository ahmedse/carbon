      text: "## Module boundary"
      subjects: [carbon.module.emissions]
    applies_to: [module]
    solution: Keep people and the engine out of evaluate_o1.
    source: docs/carbon/CARBON-MODULE-SPEC.md
  - id: CARBON-MOD-OBS-02
    title: Emissions module signal threshold is defined
    dimension: observed
    rank: 2
