  - id: CARBON-ONB-USE-06
    title: Coverage quote test cites O1-USE-QUOTE
    dimension: usable
    rank: 3
    collector: repo
    probe:
      type: file_contains
      file: carbon-frontend/src/pages/carbon/__tests__/InventoryCoveragePage.test.jsx
      texts: [O1-USE-QUOTE, "are not the O1", "1+2"]
      subjects: [carbon.journey.onboarding]
    applies_to: [journey]
    solution: Keep the coverage warning and new-goal scope 1+2.
    source: O1-USE-QUOTE
  - id: CARBON-ONB-USE-07
    title: Chairman quote test cites O1-QUOTE
    dimension: usable
    rank: 3
