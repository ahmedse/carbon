  - id: CARBON-ONB-USE-05
    title: O1 quote screen spec exists
    dimension: usable
    rank: 2
    collector: repo
    probe:
      type: file_exists
      file: docs/carbon/SCREEN-SPEC-O1-QUOTE.md
