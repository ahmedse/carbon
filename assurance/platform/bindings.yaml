bindings:
  - rule_id: PL-VERIFY-01
    file: .ai-toolkit/scripts/verify.sh
    must_contain:
      - "ai dq accounts people"
    detail: Default local pytest set includes people.

  - rule_id: PL-CI-01
    file: .github/workflows/ci.yml
    must_contain:
      - "python -m pytest"
      - "working-directory: backend"
    detail: CI backend job runs pytest. GitHub branch protection was read separately and is not enabled.

  - rule_id: PL-SSE-01
    file: backend/core/assurance_api.py
    must_contain:
      - text/event-stream
      - "Does not run pytest"
      - AssuranceStreamView
    must_not_contain:
      - plans_api
      - task_inbox
    detail: Assurance SSE is its own staff route. It is not the Pulse chat stream.
