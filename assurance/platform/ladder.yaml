      code:
        - backend/inbound
        - carbon-frontend/src/components/inbound
      base_env: GITHUB_BASE_SHA
      base_default: HEAD~1
      diff: three_dot
      git_failure: unknown
      no_code_diff: pass
      missing: unknown
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Same merge as the studio doc or ADR-0060. Do not score a file read.
    source: assurance/standard/standard.yaml specified.5
