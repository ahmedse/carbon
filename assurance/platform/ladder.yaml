# Platform tier — Excellence Ladder (ADR-0051).
# Checks here are inherited by every tier and cannot be lowered by a pack.
# Keep rank 1 small and undeniable; add ranks only after rank 1 is credible.
tier: platform
title: Platform core
owner: owner

subjects:
  - id: platform.module.accounts
    kind: module
    title: accounts (identity, CBAC, birthright)
    owner: owner
    paths: [backend/accounts]
    tests: [backend/accounts/tests]
    adr: [.ai-toolkit/decisions/0048-birthright-duty-scope.md]
    app: accounts
  - id: platform.module.core
    kind: module
    title: core (settings glue, throttles, assurance API)
    owner: owner
    paths: [backend/core]
    tests: [backend/core/tests]
    app: core
  - id: platform.module.appregistry
    kind: module
    title: appregistry (AppManifest, activation)
    owner: owner
    paths: [backend/appregistry]
    tests: [backend/appregistry/tests]
    app: appregistry
  - id: platform.module.dataschema
    kind: module
    title: dataschema (field policies, typed storage)
    owner: owner
    paths: [backend/dataschema]
    tests: [backend/dataschema/tests]
    adr: [.ai-toolkit/decisions/0025-typed-vs-dataschema-storage.md]
    app: dataschema
  - id: platform.module.connections
    kind: module
    title: connections
    owner: owner
    paths: [backend/connections]
    tests: [backend/connections/tests]
    app: connections
  - id: platform.module.importexport
    kind: module
    title: importexport
    owner: owner
    paths: [backend/importexport]
    tests: [backend/importexport/tests]
    app: importexport
  - id: platform.module.inbound
    kind: module
    title: inbound (Data Migration Studio pipe)
    owner: owner
    paths: [backend/inbound]
    tests: [backend/inbound/tests]
    adr: [.ai-toolkit/decisions/0060-data-migration-studio.md]
    app: inbound
  - id: platform.module.evidence
    kind: module
    title: evidence (attachments)
    owner: owner
    paths: [backend/evidence]
    tests: [backend/evidence/tests]
    app: evidence
  - id: platform.module.regulations
    kind: module
    title: regulations
    owner: owner
    paths: [backend/regulations]
    app: regulations
  - id: platform.module.excellence
    kind: module
    title: excellence (this ledger)
    owner: owner
    paths: [backend/excellence]
    tests: [backend/excellence/tests]
    adr: [.ai-toolkit/decisions/0051-excellence-ledger.md]
    app: excellence
  - id: platform.module.shell
    kind: module
    title: frontend shell (navigation, auth, AI workspace chrome)
    owner: owner
    paths: [carbon-frontend/src/shell]
    tests: [carbon-frontend/src/shell/__tests__, carbon-frontend/src/__tests__/AIMessageBubble.operations.test.jsx]
    vitest: src/__tests__/AIMessageBubble.operations.test.jsx
  - id: platform.repo
    kind: artifact
    title: repository hygiene (verify.sh antipatterns, DoD, toolkit)
    owner: owner
    paths: [.ai-toolkit/shared/definition-of-done.md, .ai-toolkit/scripts/verify.sh]
    ci: [.github/workflows/ci.yml]
    runbook: [docs/QUICKSTART_DEPLOYMENT.md, docs/SECURITY_DEPLOYMENT.md, docs/deployment.md]

checks:
  # ── rank 1 · Declared ─────────────────────────────────────────────────────
  - id: PLAT-GOV-01
    title: Subject has a named owner
    dimension: governed
    rank: 1
    collector: repo
    probe: { type: field_nonempty, field: owner }
    solution: Set `owner` on the subject in its ladder.yaml.
    source: ADR-0051 §2
  - id: PLAT-GOV-02
    title: Declared paths exist in the repository
    dimension: governed
    rank: 1
    collector: repo
    probe: { type: paths_exist, field: paths }
    solution: Point `paths` at real directories or remove the subject.
    source: ADR-0051 §2 (declared, not derived)
  - id: PLAT-MNT-01
    title: Repository passes verify.sh antipatterns
    dimension: maintainable
    rank: 1
    collector: antipatterns
    probe: { type: verify_antipatterns, subjects: [platform.repo] }
    applies_to: [artifact]
    solution: Fix the antipattern hits reported by `.ai-toolkit/scripts/verify.sh antipatterns`.
    source: .ai-toolkit/shared/definition-of-done.md §5

  - id: PLAT-SEC-01
    title: RBAC isolation journey is declared
    dimension: secure
    rank: 1
    collector: rbac
    probe:
      type: marker
      file: carbon-frontend/e2e/journeys/journey-06-rbac-isolation.spec.ts
      marker: RBAC
    applies_to: [module, process, journey, ai_pack]
    solution: Keep the RBAC isolation journey, and the word rbac in it.
    source: e2e/journeys/journey-06
  - id: PLAT-PRF-01
    title: A numeric budget ceiling is declared
    dimension: performant
    rank: 1
    collector: budget
    probe: { type: ceiling, file: docs/pulse/evidence/PV2.1-budget-ceiling.json }
    applies_to: [module, process, journey, ai_pack]
    solution: Keep a JSON object of numeric limits at the ceiling path.
    source: PV2.1-budget-ceiling.json
  - id: PLAT-USE-01
    title: Excellence console uses tokens, not raw hex or a raw table
    dimension: usable
    rank: 1
    collector: design_lint
    probe:
      type: no_hex_or_raw_table
      files:
        - carbon-frontend/src/pages/admin/excellence/ExcellenceConsolePage.jsx
        - carbon-frontend/src/pages/admin/excellence/ExcellenceCellMap.jsx
    applies_to: [module, process, journey, ai_pack]
    solution: Replace hex colors and raw MUI Table with theme tokens and FilteredDataGrid.
    source: design-system RULE 1 and RULE 14

  # inbound rank 1 — subject-scoped. Do not inherit onto other modules.
  - id: INBOUND-SPC-01
    title: Inbound subject states its purpose in one line
    dimension: specified
    rank: 1
    collector: repo
    probe: { type: field_nonempty, field: title, subjects: [platform.module.inbound] }
    applies_to: [module]
    solution: Set title on platform.module.inbound.
    source: assurance/standard/standard.yaml specified.1
  - id: INBOUND-COR-01
    title: Inbound test location is declared
    dimension: correct
    rank: 1
    collector: repo
    probe: { type: field_nonempty, field: tests, subjects: [platform.module.inbound] }
    applies_to: [module]
    solution: "Set tests to backend/inbound/tests."
    source: assurance/standard/standard.yaml correct.1
  - id: INBOUND-REL-01
    title: Inbound names a failure owner
    dimension: reliable
    rank: 1
    collector: repo
    probe: { type: field_nonempty, field: owner, subjects: [platform.module.inbound] }
    applies_to: [module]
    solution: Set owner on platform.module.inbound.
    source: assurance/standard/standard.yaml reliable.1
  - id: INBOUND-MNT-01
    title: Inbound paths exist
    dimension: maintainable
    rank: 1
    collector: repo
    probe: { type: paths_exist, field: paths, subjects: [platform.module.inbound] }
    applies_to: [module]
    solution: Point paths at backend/inbound.
    source: assurance/standard/standard.yaml maintainable.1
  - id: INBOUND-OBS-01
    title: Inbound signal document is named
    dimension: observed
    rank: 1
    collector: repo
    probe:
      type: file_exists
      file: docs/migration/DATA-MIGRATION-STUDIO.md
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep docs/migration/DATA-MIGRATION-STUDIO.md.
    source: assurance/standard/standard.yaml observed.1

  # inbound rank 2 — markers must exist in the studio spec. Scoped.
  - id: INBOUND-COR-02
    title: Inbound spec has a test plan
    dimension: correct
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/migration/DATA-MIGRATION-STUDIO.md
      text: "## Test plan"
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the Test plan section, with suite names.
    source: assurance/standard/standard.yaml correct.2
  - id: INBOUND-SEC-02
    title: Inbound spec lists capabilities and roles
    dimension: secure
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/migration/DATA-MIGRATION-STUDIO.md
      text: "## Capabilities and roles"
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the Capabilities and roles section.
    source: assurance/standard/standard.yaml secure.2
  - id: INBOUND-REL-02
    title: Inbound spec lists failure modes
    dimension: reliable
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/migration/DATA-MIGRATION-STUDIO.md
      text: "## Failure modes"
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the Failure modes table.
    source: assurance/standard/standard.yaml reliable.2
  - id: INBOUND-PRF-02
    title: Inbound spec states the v1 budget
    dimension: performant
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/migration/DATA-MIGRATION-STUDIO.md
      text: "## Budget"
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the Budget section. Do not invent a latency number.
    source: assurance/standard/standard.yaml performant.2
  - id: INBOUND-USE-02
    title: Inbound screen spec is present
    dimension: usable
    rank: 2
    collector: repo
    probe:
      type: file_exists
      file: docs/migration/SCREEN-SPEC-DMS.md
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep docs/migration/SCREEN-SPEC-DMS.md.
    source: assurance/standard/standard.yaml usable.2
  - id: INBOUND-MNT-02
    title: Inbound module boundary is declared
    dimension: maintainable
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/migration/DATA-MIGRATION-STUDIO.md
      text: "## Module boundary"
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the Module boundary section.
    source: assurance/standard/standard.yaml maintainable.2
  - id: INBOUND-OBS-02
    title: Inbound signal threshold is defined
    dimension: observed
    rank: 2
    collector: repo
    probe:
      type: file_contains
      file: docs/migration/DATA-MIGRATION-STUDIO.md
      text: "## Signal threshold"
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the Signal threshold section.
    source: assurance/standard/standard.yaml observed.2
  - id: INBOUND-GOV-02
    title: Inbound ADR is linked on the subject
    dimension: governed
    rank: 2
    collector: repo
    probe: { type: paths_exist, field: adr, subjects: [platform.module.inbound] }
    applies_to: [module]
    solution: Link ADR-0060 under adr.
    source: assurance/standard/standard.yaml governed.2

  # inbound rank 3 — each probe reads a real test, scan, or screen. Scoped.
  - id: INBOUND-SPC-03
    title: Pipe tests cite DMS-COR-PIPE
    dimension: specified
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/inbound/tests/test_pipe.py
      def: test_parse_csv_headers_and_count
      texts: [DMS-COR-PIPE, "assert parsed[\"row_count\"] == 25"]
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the DMS-COR-PIPE citation in test_pipe.py.
    source: assurance/standard/standard.yaml specified.3
  - id: INBOUND-SPC-04
    title: Boundary test cites DMS-COR-BOUND
    dimension: specified
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/inbound/tests/test_boundary.py
      def: test_inbound_never_imports_people
      texts: [DMS-COR-BOUND, "assert not offenders"]
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the DMS-COR-BOUND citation in test_boundary.py.
    source: assurance/standard/standard.yaml specified.3
  - id: INBOUND-SPC-05
    title: Product adapter tests cite DMS-COR-PRODUCT
    dimension: specified
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/inbound/tests/test_data_product_adapter.py
      def: test_smoke_writes_zero_datarows
      texts: [DMS-COR-PRODUCT, "DataRow.objects.filter(data_table=product_table).count() == 0"]
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the DMS-COR-PRODUCT citation in test_data_product_adapter.py.
    source: assurance/standard/standard.yaml specified.3
  - id: INBOUND-SPC-06
    title: Leave cartridge tests cite DMS-COR-LEAVE
    dimension: specified
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/people/tests/test_inbound_cartridges.py
      def: test_leave_history_does_not_add_used_days
      texts: [DMS-COR-LEAVE, "assert ent.used_days == Decimal('5')"]
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the DMS-COR-LEAVE citation in test_inbound_cartridges.py.
    source: assurance/standard/standard.yaml specified.3
  - id: INBOUND-SPC-07
    title: Recovery test cites DMS-REL-03
    dimension: specified
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/inbound/tests/test_pipe.py
      def: test_unmapped_required_blocks_smoke
      texts: [DMS-REL-03, "assert res.status_code == 400", "InboundBatch.STATUS_SMOKED"]
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the DMS-REL-03 citation next to the remap-and-smoke assertions.
    source: assurance/standard/standard.yaml specified.3
  - id: INBOUND-SPC-08
    title: Sample-cap test cites DMS-PRF-03
    dimension: specified
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/inbound/tests/test_pipe.py
      def: test_parse_csv_headers_and_count
      texts: [DMS-PRF-03, "assert len(parsed[\"sample\"]) == 20"]
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the DMS-PRF-03 citation next to the sample-length assertion.
    source: assurance/standard/standard.yaml specified.3
  - id: INBOUND-SEC-03
    title: People owner is refused a product batch
    dimension: secure
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/inbound/tests/test_data_product_adapter.py
      def: test_people_owner_cannot_create_data_product
      texts: ["assert res.status_code == 403", "data_product"]
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the 403 test for people:manage on kind data_product.
    source: assurance/standard/standard.yaml secure.3
  - id: INBOUND-REL-03
    title: A rejected map can be corrected and smoked
    dimension: reliable
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/inbound/tests/test_pipe.py
      def: test_unmapped_required_blocks_smoke
      texts: ["assert res.status_code == 400", "InboundBatch.STATUS_SMOKED"]
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the remap-after-400 smoke assertions. Do not add an automatic retry.
    source: assurance/standard/standard.yaml reliable.3
  - id: INBOUND-PRF-03
    title: Parser sample cap is 20 rows
    dimension: performant
    rank: 3
    collector: repo
    probe:
      type: file_contains
      file: backend/inbound/parse.py
      text: "'sample': rows[:20]"
      skip_comments: true
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep rows[:20] in parse.py. Do not invent a latency number.
    source: assurance/standard/standard.yaml performant.3
  - id: INBOUND-PRF-04
    title: The 25-row test asserts the sample cap
    dimension: performant
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/inbound/tests/test_pipe.py
      def: test_parse_csv_headers_and_count
      texts: ["assert len(parsed[\"sample\"]) == 20", "assert parsed[\"row_count\"] == 25"]
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep both assertions in test_parse_csv_headers_and_count.
    source: assurance/standard/standard.yaml performant.3
  - id: INBOUND-USE-03
    title: Inbound chrome has no hex and no raw table
    dimension: usable
    rank: 3
    collector: design_lint
    probe:
      type: no_hex_or_raw_table
      files:
        - carbon-frontend/src/components/inbound/InboundList.jsx
        - carbon-frontend/src/components/inbound/InboundStudio.jsx
        - carbon-frontend/src/components/inbound/InboundStatRow.jsx
        - carbon-frontend/src/pages/admin/migration/CartridgeListPage.jsx
        - carbon-frontend/src/pages/admin/migration/CartridgeDetailPage.jsx
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep inbound chrome on theme tokens and FilteredDataGrid.
    source: assurance/standard/standard.yaml usable.3
  - id: INBOUND-USE-04
    title: Inbound list has the data states and the shared primitives
    dimension: usable
    rank: 3
    collector: repo
    probe:
      type: file_contains
      file: carbon-frontend/src/components/inbound/InboundList.jsx
      texts:
        - "<LoadingSkeleton"
        - "error === 'forbidden'"
        - importEmpty
        - importNoResults
        - "<ErrorAlert"
        - "<FilteredDataGrid"
        - "<SystemDialog"
        - "<SearchSelect"
      skip_comments: true
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep loading, empty, no-results, error, and forbidden on the shared components.
    source: assurance/standard/standard.yaml usable.3
  - id: INBOUND-MNT-03
    title: Inbound import boundary is clean
    dimension: maintainable
    rank: 3
    collector: repo
    probe:
      type: forbidden_import
      root: backend/inbound
      names: [people, emissions, gradevance]
      skip_tests: true
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Remove the hosted-app import. Cartridges register from the app.
    source: assurance/standard/standard.yaml maintainable.3
  - id: INBOUND-OBS-03
    title: Smoke stores the envelope on the batch
    dimension: observed
    rank: 3
    collector: repo
    probe:
      type: file_contains
      file: backend/inbound/services.py
      text: "batch.smoke = envelope"
      skip_comments: true
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the smoke assignment. Do not add a log line to pass this rung.
    source: assurance/standard/standard.yaml observed.3
  - id: INBOUND-GOV-03
    title: The import-boundary test is the contract gate
    dimension: governed
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/inbound/tests/test_boundary.py
      def: test_inbound_never_imports_people
      texts: ["assert not offenders", "for name in BANNED"]
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep test_inbound_never_imports_people.
    source: assurance/standard/standard.yaml governed.3

  - id: INBOUND-SPC-10
    title: Cartridge tests cite DMS-COR-CART
    dimension: specified
    rank: 3
    collector: repo
    probe:
      type: def_contains
      file: backend/inbound/tests/test_cartridges.py
      def: test_studio_label_survives_reregister
      texts: [DMS-COR-CART, "assert row.label == 'Studio name'"]
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: Keep the studio-label assertion in test_studio_label_survives_reregister.
    source: assurance/standard/standard.yaml specified.3

  # inbound rank 4 — each check runs its own nodes. Scoped.
  # usable rank 4 is the People-door journey. observed rank 4 is the series writer.
  - id: INBOUND-SPC-09
    title: Every inbound criterion suite is green
    dimension: specified
    rank: 4
    collector: pytest
    probe:
      type: pytest_app
      app: inbound-criteria
      nodes:
        - inbound/tests/test_pipe.py
        - inbound/tests/test_boundary.py
        - inbound/tests/test_data_product_adapter.py
        - inbound/tests/test_cartridges.py
        - people/tests/test_inbound_cartridges.py
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: "python -m excellence.gauge --run pytest:inbound-criteria"
    source: assurance/standard/standard.yaml specified.4
  - id: INBOUND-SEC-04
    title: Forbidden-path tests are green
    dimension: secure
    rank: 4
    collector: pytest
    probe:
      type: pytest_app
      app: inbound-secure
      nodes:
        - inbound/tests/test_data_product_adapter.py::test_people_owner_cannot_create_data_product
        - inbound/tests/test_pipe.py::test_same_user_commit_403
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: "python -m excellence.gauge --run pytest:inbound-secure"
    source: assurance/standard/standard.yaml secure.4
  - id: INBOUND-REL-04
    title: Remap-after-reject and snapshot idempotency are green
    dimension: reliable
    rank: 4
    collector: pytest
    probe:
      type: pytest_app
      app: inbound-reliable
      nodes:
        - inbound/tests/test_pipe.py::test_unmapped_required_blocks_smoke
        - people/tests/test_inbound_cartridges.py::test_employee_snapshot_commit_idempotent
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: "python -m excellence.gauge --run pytest:inbound-reliable"
    source: assurance/standard/standard.yaml reliable.4
  - id: INBOUND-PRF-05
    title: Sample-cap test is green
    dimension: performant
    rank: 4
    collector: pytest
    probe:
      type: pytest_app
      app: inbound-performant
      nodes:
        - inbound/tests/test_pipe.py::test_parse_csv_headers_and_count
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: "python -m excellence.gauge --run pytest:inbound-performant"
    source: assurance/standard/standard.yaml performant.4
  - id: INBOUND-MNT-04
    title: Import-boundary test is green
    dimension: maintainable
    rank: 4
    collector: pytest
    probe:
      type: pytest_app
      app: inbound-boundary
      nodes:
        - inbound/tests/test_boundary.py::test_inbound_never_imports_people
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: "python -m excellence.gauge --run pytest:inbound-boundary"
    source: assurance/standard/standard.yaml maintainable.4
  - id: INBOUND-GOV-04
    title: Contract-gate test is green
    dimension: governed
    rank: 4
    collector: pytest
    probe:
      type: pytest_app
      app: inbound-boundary
      nodes:
        - inbound/tests/test_boundary.py::test_inbound_never_imports_people
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: "python -m excellence.gauge --run pytest:inbound-boundary"
    source: assurance/standard/standard.yaml governed.4
  - id: INBOUND-USE-05
    title: People door journey is green on HEAD
    dimension: usable
    rank: 4
    collector: playwright
    probe:
      type: journey
      file: carbon-frontend/e2e/journeys/journey-dms-people-door.spec.ts
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: "python -m excellence.gauge --run playwright:carbon-frontend/e2e/journeys/journey-dms-people-door.spec.ts"
    source: assurance/standard/standard.yaml usable.4
  - id: INBOUND-OBS-04
    title: Smoke series matches the envelope stored on the batch
    dimension: observed
    rank: 4
    collector: pytest
    probe:
      type: pytest_app
      app: inbound-observed
      nodes:
        - inbound/tests/test_observe_series.py::test_smoke_series_matches_the_saved_envelope
      subjects: [platform.module.inbound]
    applies_to: [module]
    solution: "python -m excellence.gauge --run pytest:inbound-observed"
    source: assurance/standard/standard.yaml observed.4

  # Rank 5 is defined and unmet. inbound_operated is registered and
  # fail-closed: a missing file or GitHub run is unknown, never a pass.
