    title: Pack contract gate passes (versioned, self-contained, core domain-free)
    dimension: governed
    rank: 3
    collector: pulse_gauge
    probe: { type: packs_gate }
    applies_to: [ai_pack]
    solution: python -m ai.eval.pack_contract --gate ; move the vocabulary into the pack.
    source: ADR-0050
