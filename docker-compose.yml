services:
  backend:
    build: ./backend
    container_name: carbon-backend
    restart: unless-stopped
    env_file: ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - carbon_static:/static
      - carbon_media:/media
    ports:
      - "8009:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput && 
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./carbon-frontend
      dockerfile: Dockerfile
    container_name: carbon-frontend
    restart: unless-stopped
    ports:
      - "5179:5173"
    volumes:
      - ./carbon-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8009/carbon-api/
    command: npm run dev -- --host 0.0.0.0

  scheduler:
    build: ./backend
    container_name: carbon-scheduler
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - carbon_static:/static
      - carbon_media:/media
    # Phase H — supervisor hardening: give the AsyncIOScheduler a grace window
    # to stop jobs cleanly on SIGTERM, and healthcheck the liveness heartbeat
    # the loop writes every COGNITION_HEARTBEAT_INTERVAL seconds.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time; p='/tmp/cognition_loop.heartbeat'; exit(0 if os.path.exists(p) and (time.time()-os.path.getmtime(p)) < 180 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py run_cognition_loop"

  # Sprint 11 — learning-feedback sweep sidecar. Consumes judged AIMessage
  # outcomes that the real-time trigger left unconsumed (transient failures).
  learning-scheduler:
    build: ./backend
    container_name: carbon-learning-scheduler
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - LEARNING_SWEEP_INTERVAL=${LEARNING_SWEEP_INTERVAL:-300}
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - carbon_static:/static
      - carbon_media:/media
    stop_grace_period: 30s
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py run_learning_loop"

volumes:
  carbon_static:
  carbon_media:            