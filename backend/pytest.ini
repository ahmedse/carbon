[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
addopts = -p _testbrand --reuse-db --nomigrations -p no:warnings
# CI default excludes opt-in LLM tests: run ``pytest -m "not live"``.
# The live judge harness is run explicitly with ``-m live`` + PULSE_EVAL_LIVE=1.
markers =
    live: opt-in end-to-end tests requiring a real LLM (excluded from CI via -m "not live")
    eval_golden: PEC-4A Nibras golden eval harness (CI-invokable; fabrication_rate must be 0)