# ADR-0052 plan-contract goldens. Shapes, not model output.
cases:
  - id: aec8f39a-within-band
    brief: October payroll variance, within band, then a board pack
    blocking: []
    steps:
      - step_id: 0
        intent: variance read
        tool_name: call_host_api
        tool_args: {api_name: list_payroll_runs}
      - step_id: 1
        intent: band decision
        depends_on: [0]
      - step_id: 2
        intent: read lines bound to the run
        tool_name: call_host_api
        tool_args: {api_name: list_payroll_runs}
        depends_on: [1]
        guard: {step: 1, field: within_band, value: true}
      - step_id: 3
        intent: board pack word excel pdf png
        tool_name: export_document
        tool_args: {title: Board, columns: [id, status]}
        depends_on: [2]
        guard: {step: 1, field: within_band, value: true}
  - id: aec8f39a-over-band
    brief: October payroll variance, over band, escalate, no export
    blocking: []
    steps:
      - step_id: 0
        intent: variance read
        tool_name: call_host_api
        tool_args: {api_name: list_payroll_runs}
      - step_id: 1
        intent: band decision
        depends_on: [0]
      - step_id: 2
        intent: hand off to a person
        depends_on: [1]
        gap: hand off to a person
        guard: {step: 1, field: within_band, value: false}
  - id: aec8f39a-both-branches
    brief: the failed run shape, export and escalate both runnable
    blocking: [output_fit, branch]
    steps:
      - step_id: 0
        intent: variance read
        tool_name: call_host_api
        tool_args: {api_name: list_payroll_runs}
      - step_id: 2
        intent: band decision
        depends_on: [0]
      - step_id: 6
        intent: board pack
        tool_name: export_document
        tool_args: {title: Board, columns: [id, status]}
        depends_on: [2]
      - step_id: 7
        intent: escalate
        depends_on: [2]
        gap: hand off to a person
  - id: 0bd5072d-workforce
    brief: weekly workforce briefing
    blocking: []
    steps:
      - step_id: 0
        intent: headcount by org unit
        tool_name: call_host_api
        tool_args: {api_name: analyze_employees, dimension: org_unit}
      - step_id: 1
        intent: list runs
        tool_name: call_host_api
        tool_args: {api_name: list_payroll_runs}
      - step_id: 2
        intent: summarize
        tool_args: {produces: [headcount]}
        depends_on: [0, 1]
      - step_id: 3
        intent: export the report
        tool_name: export_document
        tool_args: {title: Weekly, columns: [headcount]}
        depends_on: [2]
  - id: declared-output-uncovered
    brief: distribution the catalog cannot produce
    blocking: [output_fit]
    steps:
      - step_id: 0
        intent: headcount
        tool_name: call_host_api
        tool_args: {api_name: analyze_employees, dimension: org_unit}
      - step_id: 1
        intent: export claimed columns
        tool_name: export_document
        tool_args:
          title: Report
          columns: [average, median, range]
        depends_on: [0]
  - id: declared-output-covered
    brief: headcount the catalog does declare
    blocking: []
    steps:
      - step_id: 0
        intent: headcount
        tool_name: call_host_api
        tool_args: {api_name: analyze_employees, dimension: org_unit}
      - step_id: 1
        intent: export the declared column
        tool_name: export_document
        tool_args:
          title: Report
          columns: [headcount]
        depends_on: [0]
  - id: declared-output-unnamed
    brief: a file whose reads declare no fields
    blocking: [output_fit]
    steps:
      - step_id: 0
        intent: validate
        tool_name: call_host_api
        tool_args: {api_name: validate_payroll_run}
      - step_id: 1
        intent: export
        tool_name: export_document
        tool_args: {title: Board}
        depends_on: [0]
  - id: declared-output-live-shape
    brief: compute hops then an unnamed workbook
    blocking: [output_fit, output_fit]
    steps:
      - step_id: 0
        intent: latest run
        tool_name: call_host_api
        tool_args: {api_name: list_payroll_runs}
      - step_id: 1
        intent: lines
        tool_name: call_host_api
        tool_args: {api_name: list_payslip_lines}
        depends_on: [0]
      - step_id: 2
        intent: compute groups
        depends_on: [1]
      - step_id: 3
        intent: export workbook
        tool_name: export_document
        tool_args: {title: Report, format: xlsx}
        depends_on: [2]
  - id: declared-output-eight-step
    brief: the live propose shape — three reads, four compute hops, unnamed xlsx
    blocking: [output_fit, output_fit, output_fit, output_fit, output_fit]
    steps:
      - step_id: 1
        intent: latest committed run
        tool_name: call_host_api
        tool_args: {api_name: list_payroll_runs}
      - step_id: 2
        intent: employee sample
        tool_name: call_host_api
        tool_args: {api_name: list_employees}
        depends_on: [1]
      - step_id: 3
        intent: payslip lines
        tool_name: call_host_api
        tool_args: {api_name: list_payslip_lines}
        depends_on: [1]
      - step_id: 4
        intent: compute by org
        depends_on: [2, 3]
      - step_id: 5
        intent: compute by nationality
        depends_on: [2, 3]
      - step_id: 6
        intent: compute by position
        depends_on: [2, 3]
      - step_id: 7
        intent: compute by employment
        depends_on: [2, 3]
      - step_id: 8
        intent: export workbook
        tool_name: export_document
        tool_args: {title: Salary Distribution Report, format: xlsx}
        depends_on: [4, 5, 6, 7]
