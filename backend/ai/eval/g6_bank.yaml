# Q0 G6 understanding bank — dual-language cases (13 categories × ≥3).
# Scored offline via ai.eval.g6_runner (preferred_self_api baseline only).
#
# tier (optional, default `baseline`):
#   baseline — the legacy lexical ladder must pass (offline gate, misses == []).
#   v21      — goldens the legacy ladder is NOT expected to pass. Scored by the
#              understand call (`python -m ai.eval.g6_runner --mode understand`,
#              ADR-0049 §5 gate G6 ≥ 0.95). Adding a regex to make the offline
#              ladder pass a v21 case is the anti-pattern ADR-0049 rejects.
# history (optional): prior messages given to the scorer (state for follow-ups).

