id: composite-brief-ar-01
objective_ids: [C1, C5, C6]
language: ar
surface: chat
persona: emp_1067
# One coherent Plan session. Ask and Plan are separate conversations; this bank
# must not mix their state in one conversation.
turns:
  - user: "راجع قروضي المفتوحة ورصيد إجازتي في الوقت نفسه. إذا كان لدي قرض مفتوح، توقف. إذا لا، قدّم طلب قرض ٥٠٠ دينار لمدة ١٢ شهراً."
    process_mode: plan
    stub_reply: "خطة مقترحة: ١) قراءة قروضي المفتوحة ورصيد الإجازة معاً. ٢) إن وُجد قرض مفتوح — توقف. ٣) وإلا — مسودة طلب قرض ٥٠٠ دينار لمدة ١٢ شهراً للمراجعة. لا يُرسل شيء قبل موافقتك."
    expect:
      decision_in: [tool_answer]
      language: ar
      max_llm_calls: 0
      mentions_any: ["الشرط", "قرض مفتوح"]
      mentions_none: ["أي نوع قرض تريد"]

  - user: "بالعربي وبالتفصيل"
    process_mode: plan
    stub_reply: "بالتفصيل: أولاً أقرأ قروضي المفتوحة ورصيد الإجازة معاً، ثم إن وُجد قرض مفتوح أتوقف، وإلا أُجهّز مسودة طلب قرض ٥٠٠ دينار لمدة ١٢ شهراً للمراجعة قبل أي إرسال."
    expect:
      decision_in: [answer]
      language: ar
      max_llm_calls: 1
      mentions_none: ["ما هو الموضوع", "أي نوع قرض تريد", "Plan Review"]

  - user: "ما حالة الخطة؟"
    process_mode: plan
    stub_reply: "الخطة بانتظار موافقتك في المهام."
    expect:
      decision_in: [answer]
      language: ar
      max_llm_calls: 0
      mentions_any: ["بانتظار موافقتك", "المهام"]

  - user: "ما وضع طلب القرض؟"
    process_mode: plan
    stub_reply: "الخطة بانتظار موافقتك في المهام."
    expect:
      decision_in: [answer]
      language: ar
      max_llm_calls: 0
      mentions_any: ["بانتظار موافقتك", "المهام"]

  - user: "ما الخطوات التي ستقوم بها بالترتيب؟"
    process_mode: plan
    stub_reply: "أولاً أقرأ القروض ورصيد الإجازة بالتوازي، ثم أتحقق من الشرط، ثم أُجهّز طلب ٥٠٠ دينار لمدة ١٢ شهراً فقط إذا لم يوجد قرض مفتوح."
    expect:
      decision_in: [answer, tool_answer]
      language: ar
      max_llm_calls: 2
      mentions_any: ["٥٠٠", "500", "١٢", "12"]
      mentions_none: ["أي نوع قرض تريد"]

  - user: "هل تم تقديم القرض فعلاً؟"
    process_mode: plan
    stub_reply: "لا. لم يُقدَّم القرض؛ الخطة مسودة بانتظار موافقتك ولم تُنفّذ."
    expect:
      decision_in: [answer, tool_answer]
      language: ar
      max_llm_calls: 2
      mentions_any: ["لم يُقدَّم", "لم تُنفّذ", "بانتظار موافقتك"]

  - user: "اختصر الإجابة السابقة بالعربية"
    process_mode: plan
    stub_reply: "لا، القرض لم يُقدَّم. الخطة تنتظر موافقتك."
    expect:
      decision_in: [answer]
      language: ar
      max_llm_calls: 1
      mentions_none: ["ما هو الموضوع", "أي نوع قرض تريد"]

  - user: "شكراً"
    process_mode: plan
    stub_reply: "على الرحب والسعة."
    expect:
      decision_in: [answer, navigate]
      language: ar
      max_llm_calls: 0
