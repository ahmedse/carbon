id: grounded-recall-01
objective_ids: [C2, C10]
language: en
surface: chat
persona: emp_1067
turns:
  - user: "What is my employee number?"
    stub_reply: "Your employee number is 1067."
    expect:
      decision_in: [answer]
      language: en
      max_llm_calls: 2
      mentions_any: ["1067"]
  
  - user: "What department am I in?"
    # Host /people/me/ for emp_1067: Coiled Tubing. Engineering was never on the row.
    stub_reply: "You are in the Coiled Tubing department."
    expect:
      decision_in: [answer]
      language: en
      max_llm_calls: 2
      mentions_any: ["Coiled Tubing"]
  
  - user: "And who is my manager?"
    stub_reply: "Your manager is Mohammad Bolto Ali."
    expect:
      decision_in: [answer]
      language: en
      max_llm_calls: 2
      mentions_any: ["Mohammad", "Bolto"]
  
  - user: "Correct. My name is Mohamed Hassan"
    stub_reply: "Got it. I've noted that your name is Mohamed Hassan."
    expect:
      decision_in: [answer]
      language: en
      max_llm_calls: 2
  
  - user: "What number did you give me?"
    stub_reply: "I told you your employee number is 1067."
    expect:
      decision_in: [answer]
      language: en
      max_llm_calls: 2
      mentions_any: ["1067"]
  
  - user: "And what department did I mention?"
    stub_reply: "You did not mention a department. Your record shows Coiled Tubing."
    expect:
      decision_in: [answer]
      language: en
      max_llm_calls: 2
      mentions_any: ["Coiled Tubing", "did not mention", "didn't mention"]
  
  - user: "My manager's name is?"
    stub_reply: "Your manager's name is Mohammad Bolto Ali."
    expect:
      decision_in: [answer]
      language: en
      max_llm_calls: 2
      mentions_any: ["Mohammad", "Bolto"]
  
  - user: "What is my full name?"
    stub_reply: "Your full name is Mohamed Hassan."
    expect:
      decision_in: [answer]
      language: en
      max_llm_calls: 2
      mentions_any: ["Mohamed", "Hassan"]
