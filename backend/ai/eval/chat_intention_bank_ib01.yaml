# IB-01 — grounding (PULSE-INTENTION-CONTRACT §5, IRP-5).
#
# Live Chat Ask, read-only. Every figure the reply prints must be in the
# payload the turn was shown. The check unions the committed tool payload
# (``tool_digest`` / ``tool_trace``) with the host record the tool reads:
# ``me`` = ``/people/me/`` (salary, employee_no, ...) and ``lb`` =
# ``/people/me/leave-balance/`` (the ``get_my_leave_balance`` payload). A reply
# figure in neither is a miss (``pass=false``); the digest truncates at ~200
# chars, so the host oracle is the full payload, not a bypass.
#
# Sample: 8 threads x 2 turns = 16 (4 EN / 4 AR threads), threshold 100%,
# 0 ungrounded figures. Turn text lives here, never in engine/**. Language is
# IB-02's axis, so it is not asserted here.
#
# Checks (shared with chat_retest_bank.yaml, extended in chat_retest.py):
#   numbers_grounded: true   every figure is in the tool/host payload
#   ground_objects: [refs]   extra host payloads (me / lb / emp:<no>)
#   not_degraded: true       no typed degradation sentence

bank: IB-01
purpose: "Grounding — every figure in the reply is in the tool payload."
tier: live_intention
surface: chat
sample_threads: 8
sample_turns: 16
language_threads: {en: 4, ar: 4}
threshold: "100% threads; 0 ungrounded figures"
run: live_read

threads:
  - id: ib01-salary-en
    turns:
      - say: "What is my basic salary on the record? Include the number."
        numbers_grounded: true
        ground_objects: [me]
        not_degraded: true
      - say: "Say that basic salary again, the number only."
        numbers_grounded: true
        ground_objects: [me]
        not_degraded: true

  - id: ib01-salary-ar
    turns:
      - say: "ما هو راتبي الأساسي في السجل؟ اذكر الرقم."
        numbers_grounded: true
        ground_objects: [me]
        not_degraded: true
      - say: "ما هو الراتب الأساسي مرة أخرى؟ الرقم فقط."
        numbers_grounded: true
        ground_objects: [me]
        not_degraded: true

  - id: ib01-leave-en
    turns:
      - say: "How many annual leave days do I have left?"
        numbers_grounded: true
        ground_objects: [lb]
        not_degraded: true
      - say: "Show me my full leave balance with the remaining days per type."
        numbers_grounded: true
        ground_objects: [lb]
        not_degraded: true

  - id: ib01-leave-ar
    turns:
      - say: "كم يوم إجازة سنوية متبقٍ لدي؟"
        numbers_grounded: true
        ground_objects: [lb]
        not_degraded: true
      - say: "اعرض رصيد إجازاتي الكامل مع الأيام المتبقية لكل نوع."
        numbers_grounded: true
        ground_objects: [lb]
        not_degraded: true

  - id: ib01-no-en
    turns:
      - say: "What is my employee number? Digits only."
        numbers_grounded: true
        ground_objects: [me]
        not_degraded: true
      - say: "Give me just my staff number from the record."
        numbers_grounded: true
        ground_objects: [me]
        not_degraded: true

  - id: ib01-no-ar
    turns:
      - say: "ما هو رقم الموظف الخاص بي؟ الرقم فقط."
        numbers_grounded: true
        ground_objects: [me]
        not_degraded: true
      - say: "أعطني رقمي الوظيفي من السجل، بلا أي كلام آخر."
        numbers_grounded: true
        ground_objects: [me]
        not_degraded: true

  - id: ib01-entitlement-en
    turns:
      - say: "How many annual leave days am I entitled to? Number only."
        numbers_grounded: true
        ground_objects: [lb]
        not_degraded: true
      - say: "How many annual leave days have I used so far? The number only."
        numbers_grounded: true
        ground_objects: [lb]
        not_degraded: true

  - id: ib01-entitlement-ar
    turns:
      - say: "كم يوم إجازة سنوية أستحق؟ الرقم فقط."
        numbers_grounded: true
        ground_objects: [lb]
        not_degraded: true
      - say: "كم يوم إجازة سنوية استخدمت حتى الآن؟ الرقم فقط."
        numbers_grounded: true
        ground_objects: [lb]
        not_degraded: true
