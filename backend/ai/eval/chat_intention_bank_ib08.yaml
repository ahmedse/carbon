# IB-08 — voice / register / persona-scope per surface
# (PULSE-INTENTION-CONTRACT §5, IF-07).
#
# Live Chat, read-only. Two addressed registers on the pack persona:
#   * ``coworker`` — a peer/named-coworker read must be answered in the
#     declared scope (or 403-honest), never scope-refused.
#   * ``tutor`` — an explain/how-to ask must get an in-scope explanatory
#     answer, never scope-refused.
# On the nibras pack both registers run on the single pack persona
# (``instance.yaml persona``); there is no separate transport dial, so the
# ``surface`` label selects the register wording of the ask, and the checks
# assert "answered inside the declared scope + register" (no refusal, no
# degradation, language follows the message).
#
# Sample: 8 threads x 1 turn per surface x 2 surfaces = 16 (4 EN / 4 AR per
# surface). Threshold 100% threads. Text here, never in engine/**.

bank: IB-08
purpose: "Voice/register/persona-scope per surface (coworker, tutor)."
tier: live_intention
surface: chat
surfaces: [coworker, tutor]
sample_threads: 16
sample_turns: 16
language_threads: {en: 8, ar: 8}
threshold: "100% threads answer inside the declared scope + register"
run: live_read

threads:
  - id: ib08-coworker-en-1
    surface: coworker
    turns:
      - say: "What is the job title of employee 2400?"
        decision_not: [refuse]
        language: en
        not_degraded: true

