turn/runner_render.py::_DELIVERY_INJECTION:
  items:
    analyze: get insight — patterns, extremes, and what drives it
    compare: compare the relevant entries side by side
    explain: understand what this is, how it is used, and why it matters
    list: see the full list of records
    lookup: find one specific value
    summarize: get a high-level summary
  kind: dict
turn/runner_render.py::_DELIVERY_SYNTHESIS:
  items:
    analyze: The user wants insight — surface the extremes (highest/lowest), the groupings,
      and patterns. Lead with the finding, then support it with a Markdown table.
    compare: The user wants a side-by-side comparison — contrast the entries on the
      dimensions that matter using a Markdown table.
    explain: The user wants to UNDERSTAND this dataset, not just see rows. Lead with
      what it IS and how it is used, group it meaningfully (by category/scope), name
      the notable entries and what they mean, and present the data as a Markdown table
      so it is readable. End with one natural next step.
    list: The user wants the complete record set — present every row in a clean Markdown
      table (meaningful columns only) and add a chart if the values are comparable.
    lookup: The user wants one specific value — answer with that value directly, bold
      it, and keep surrounding detail minimal.
    summarize: The user wants a roll-up — give headline numbers and a compact table
      of the main groups, no exhaustive list.
  kind: dict
