# Carbon Data Trust Platform — Pulse instance configuration.
#
# This file is the ONLY place where Carbon-specific domain knowledge is
# declared for the intelligence layer. engine_runtime.py reads it at boot;
# the engine core (cognition/, memory/, learning/) never imports from here.
#
# To bootstrap Pulse for a new project: copy engine/ to the new project,
# replace this file with instances/<new_name>/instance.yaml, write a new
# host_executor.py, and update the api_catalog + navigation_routes below.

display_name: "Carbon Data Trust Platform"

description: >
  A data trust platform for the organisation's data workflows —
  the assistant helps with the data areas the user can access.

persona: >
  A precise, grounded data-platform assistant. Never claim an action
  succeeded unless a tool result confirmed it. Never reveal other users'
  data, platform internals (components, databases, technologies, or how
  the assistant works), or capabilities the current user cannot access.
  For questions about platform data, ground every answer in tool results.
  For general knowledge, domain concepts, or real-time lookups, answer
  helpfully and offer to connect the findings to the user's platform data
  when relevant. You have long-term memory through the learn_fact tool.
  When a user asks you to remember or store something, propose it with the
  learn_fact tool; it is only saved after the user confirms the proposal.
  Never claim you lack memory or that memory is unavailable.

domain_topics:
  - data quality
  - data catalog
  - governance
  - carbon emissions
  - sustainability reporting
  - general knowledge and reasoning

api_catalog:
  - name: get_data_product_details
    method: GET
    path: /carbon-api/dataschema/tables/?module_id={id}
    description: >
      Get the data tables belonging to a data product (module).
      Path param {id} is the module/data-product id.
    requires_auth: true
    requires_confirmation: false

  - name: list_data_tables
    method: GET
    path: /carbon-api/dataschema/tables/
    description: >
      List data tables visible to the user, optionally filtered
      by query param module_id.
    requires_auth: true
    requires_confirmation: false

  - name: list_dq_rules
    method: GET
    path: /carbon-api/dq/rules/
    description: >
      List data-quality rules so an existing rule can be reused
      instead of creating a duplicate.
    requires_auth: true
    requires_confirmation: false

  - name: create_table
    method: POST
    path: /carbon-api/dataschema/tables/
    description: >
      Create a new data table (schema change). Body:
      {"title": str, "description": str, "module": <module id>,
      "fields": [{"name": str, "label": str,
      "type": "string|number|date|boolean|select|multiselect",
      "required": bool, "description": str}]}
    requires_auth: true
    requires_confirmation: true

  - name: create_dq_rule
    method: POST
    path: /carbon-api/dq/rules/
    description: >
      Create a new data-quality rule. Body:
      {"name": str, "rule_level": "business|field",
      "rule_type": str, "severity": "error|warn|info",
      "description": str,
      "dimension": "accuracy|completeness|consistency|integrity|reasonability|timeliness|uniqueness|validity",
      "definition": {"schema_version": 1, "name": str, "type": str,
      "level": "business|field", "dimension": str,
      "severity": "error|warn|info", "active": true, "params": {}}}
    requires_auth: true
    requires_confirmation: true

  - name: bind_dq_rules
    method: POST
    path: /carbon-api/dq/rule-assignments/
    description: >
      Bind a DQ rule to a data table. Body:
      {"rule": <rule id>, "data_table": <table id>, "data_field": <field id|null>}.
      Alternatively pass {"table_id": <id>, "dq_rule_ids": [<ids>]}.
    requires_auth: true
    requires_confirmation: true

  - name: list_emission_factors
    method: GET
    path: /carbon-api/carbon/factors
    description: >
      List active emission factors (GLOBAL reference data, kg CO2e per
      activity unit). Fields: name, code, category, scope, factor_value,
      factor_unit, activity_unit, country, source, tags.
    requires_auth: true
    requires_confirmation: false

  - name: list_gwp_gases
    method: GET
    path: /carbon-api/carbon/gwp
    description: >
      List global warming potentials (GLOBAL reference data) with AR5/AR6
      GWP values for the 20-year and 100-year horizons.
    requires_auth: true
    requires_confirmation: false

  - name: list_reporting_periods
    method: GET
    path: /carbon-api/carbon/periods
    description: >
      List reporting periods (GLOBAL) with name, start/end dates, status,
      and baseline flag.
    requires_auth: true
    requires_confirmation: false

  - name: get_calculation_summary
    method: GET
    path: /carbon-api/carbon/calculations/summary
    description: >
      Aggregated calculation summary for the reporting period given by
      optional query param reporting_period_id. Totals are in kg CO2e
      broken down by scope, status, and MODULE (branch/campus — e.g.
      South Valley, Smart Village, Abu Qir, Alamein). This is the endpoint
      for questions about a specific branch's emissions/footprint: filter
      the by_module breakdown to the named branch. Plus latest run and
      last audit.
    requires_auth: true
    requires_confirmation: false

  - name: get_chairman_overview
    method: GET
    path: /carbon-api/carbon/chairman
    description: >
      Single-call chairman overview (ORG-SCOPED): footprint in tonnes CO2e
      (kg / 1000), coverage, SBTi targets, actions, and trajectory.
      Optional query param reporting_period_id.
    requires_auth: true
    requires_confirmation: false

navigation_routes:
  - name: dq_rule_detail
    path: /dq/rules/{id}
    description: Data-quality rule detail page.

  - name: dq_rule_results
    path: /dq/rules/{id}/results
    description: Data-quality rule results page.
