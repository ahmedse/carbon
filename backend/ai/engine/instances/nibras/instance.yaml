# Tools excluded for this instance — Carbon-domain tools not relevant here.
excluded_tools:
  - create_dq_rule
  - run_ops_workflow

# Slug resolution: legacy name→id path for get_employee / list_employees.
# SUPERSEDED (ECF-7 cutover 2026-09-16): ECF resolve_entity is the primary
# lookup when ECF_ENABLED=True (ADR-0032). Keep this block as fallback for
# 30 days — do NOT delete until the fallback window closes.
tools:
  slug_resolution:
    - detail_endpoint: get_employee
      list_endpoint: list_employees
      match_fields: [employee_no, name_en_given, name_en_family]
    # Payroll lifecycle — planners invent demo-oct-2026; resolve via list + period.
    - detail_endpoint: get_payroll_run
      list_endpoint: list_payroll_runs
      match_fields: [id, period_start]
    - detail_endpoint: compute_payroll_run
      list_endpoint: list_payroll_runs
      match_fields: [id, period_start]
    - detail_endpoint: validate_payroll_run
      list_endpoint: list_payroll_runs
      match_fields: [id, period_start]
    - detail_endpoint: commit_payroll_run
      list_endpoint: list_payroll_runs
      match_fields: [id, period_start]

# ECF entity descriptors (ADR-0032) — loaded when ECF_ENABLED=True.
# Each descriptor drives the generic resolve/search/get/aggregate/describe
# capabilities. The algorithm is engine-generic; knowledge is declared here.
entities:
  - name: employee
    model: people.models.Employee
    identifiers: [employee_no, civil_id, id]
    search_fields:
      - {field: full_name,      lang: en, weight: 1.0}
      - {field: name_en_given,  lang: en, weight: 0.9}
      - {field: name_en_family, lang: en, weight: 0.9}
      - {field: name_ar_given,  lang: ar, weight: 1.0, normalize: arabic}
      - {field: name_ar_family, lang: ar, weight: 1.0, normalize: arabic}
      - {field: employee_no,    lang: any, weight: 3.0}
      - {field: civil_id,       lang: any, weight: 2.0}
    label_map:
      position:  {model: people.models.Position,  field: title}
      org_unit:  {model: mdm.models.OrgUnit,       field: name}
    masking:
      basic_salary: {capability: people:view_compensation}
    metrics:
      # ONE canonical definition each — kills the 55-vs-5 Kuwaiti inconsistency.
      # nationality is a ReferenceValue FK (NSR-7); live code is KWT (not legacy CharField KW).
      headcount: {filter: {is_active: true},      description: "Total active employees"}
      kuwaiti:   {filter: {nationality__code: "KWT"}, description: "Employees with nationality.code=KWT (not the kuwaitization boolean)"}
    scope_lookup: org_unit_id__in

  # Entity #2 — ECF-8 generalize proof: descriptor only, zero new algorithm code.
  - name: leave_record
    model: people.models.LeaveRecord
    identifiers: [id]
    search_fields:
      - {field: status,     lang: any, weight: 1.0}
      - {field: start_date, lang: any, weight: 1.5}
      - {field: end_date,   lang: any, weight: 1.2}
    label_map:
      employee:   {model: people.models.Employee,        field: full_name}
      leave_type: {model: mdm.models.ReferenceValue,     field: label}
    metrics:
      open_leave_count:     {filter: {status: "submitted"}, description: "Leave records awaiting decision (status=submitted)"}
      approved_leave_count: {filter: {status: "approved"},  description: "Approved leave records"}
    scope_lookup: employee__org_unit_id__in

# Bilingual outcome copy for fully bound process_dial submits (PV2-3A).
# Rendered from bound write_slots — never LLM prose. Placeholders are
# {field} names matching the catalog body (leave_type, principal, …).
step_templates:
  submit_my_leave:
    en: >-
      Leave request submitted: {leave_type}, {start_date} → {end_date}
      ({days} day(s)). Awaiting manager review in Team.
    ar: >-
      تم تقديم طلب الإجازة: {leave_type}، من {start_date} إلى {end_date}
      ({days} أيام). بانتظار مراجعة المدير في الفريق.
  submit_my_loan:
    en: >-
      Loan request submitted: {loan_type}, {principal} over {term_months}
      months, start {start_date}. Awaiting manager then finance review in Team.
    ar: >-
      تم تقديم طلب القرض: {loan_type}، مبلغ {principal} لمدة {term_months}
      شهرًا، يبدأ {start_date}. بانتظار مراجعة المدير ثم المالية في الفريق.
  submit_my_attendance_permission:
    en: >-
      Attendance permission submitted: {permission_type} on {date}
      ({hours} hours). Awaiting manager review in Team.
    ar: >-
      تم تقديم إذن الحضور: {permission_type} بتاريخ {date}
      ({hours} ساعات). بانتظار مراجعة المدير في الفريق.
  submit_correspondence:
    en: >-
      Request submitted: {title}. Open it in My.
    ar: >-
      تم تقديم الطلب: {title}. افتحه في حسابي.

# Pre-LLM topic guard: patterns matched against the user's message text.
# Any match returns a canned refusal WITHOUT calling the LLM.  This is
# a hard gate — it cannot be bypassed by prompt injection or roleplay.
topic_guard:
  refusal: >
    I'm the Nibras People & Payroll assistant — that topic is outside my
    scope. I can help with payroll runs, payslips, GOSI/WPS, leave,
    loans, attendance, and HR advisory. What would you like to know?
  # Same refusal for Arabic users (the runner picks by message language).
  refusal_ar: >
    أنا مساعد نبراس للموارد البشرية والرواتب — هذا الموضوع خارج نطاقي.
    يمكنني المساعدة في مسيرات الرواتب، وقسائم الراتب، والتأمينات الاجتماعية
    وحماية الأجور، والإجازات، والقروض، والحضور، والاستشارات الخاصة بالموارد
    البشرية. بماذا يمكنني مساعدتك؟
  # Declared scope: an ask naming one of these is never scope-refused by the
  # intent classifier's off_limits zone (jailbreak / bypass wording still is).
  in_scope:
    en: [loan, leave, vacation, time off, payroll, payslip, salary, salaries,
         net pay, attendance, absence, overtime, gosi, wps, deduction]
    ar: [قرض, سلفه, سلفة, اجازه, إجازة, رواتب, راتب, مرتب, قسيمه, قسيمة,
         حضور, غياب, دوام, استئذان, تامينات, تأمينات, خصم]
  patterns:
    - "(?i)global\\s+warming\\s+potential|\\bGWP\\b"
    - "(?i)emission\\s+factor|emissions?\\s+factor"
    - "(?i)\\bScope\\s+[123]\\b.*emission|emission.*\\bScope\\s+[123]\\b"
    - "(?i)carbon\\s+(emissions?|footprint|dashboard|data|account)"
    - "(?i)greenhouse\\s+gas|\\bGHG\\b"
    - "(?i)\\btCO2e\\b|\\bkgCO2\\b|CO2\\s+equivalent"
    - "(?i)(list|show|get|retrieve|display|give)\\s+.{0,40}(data\\s+quality|\\bDQ\\b)\\s+(rule|check)"
    - "(?i)data\\s+catalog\\s+(content|table|asset|schema)"
    - "(?i)show\\s+.{0,40}\\bDQ\\s+rule|\\bDQ\\s+rule.{0,40}system"
    # org units are IN SCOPE for Nibras (GOFSCO org tree) — do not block them.
    - "(?i)(check|show|list|get|retrieve)\\s+.{0,50}\\b(catalog|mdm|data.schema|dataschema|connection|emission)\\b"
    - "(?i)data\\s+trust|carbon\\s+platform|carbon\\s+instance"
