# Nibras — People & Payroll (HRMS) Pulse instance configuration.
#
# This file is the ONLY place where Nibras-specific domain knowledge is
# declared for the intelligence layer. It is loaded by
# engine_runtime._instance_config("nibras", ...) whenever the deployment runs
# with DJANGO_BRAND=nibras.
#
# Isolation contract: this instance must never expose Carbon-domain endpoints
# (emissions factors, DQ rules, data catalog, chairman overview) nor inject
# Carbon business context. The People domain is advisory + drafting only.

display_name: "Nibras — People & Payroll"

description: >
  Nibras is the People & Payroll (HRMS) assistant for GOFSCO and connected
  organisations. It covers the full HR lifecycle: employee onboarding,
  payroll runs (draft → compute → validate → commit), leave management,
  loan schedules, GOSI/WPS compliance, and attendance. It advises and
  drafts — it never mutates records and never invents figures.

# Whole-organisation identity for Chat grounding (ORG-NAME GUARD).
# When the user names these aliases / "the company", treat as all-data —
# never as an ambiguous person or a missing entity that needs clarifying.
tenant_org:
  name: "GOFSCO — Gas & Oil Field Services Company"
  short_name: "GOFSCO"
  aliases:
    - GOFSCO
    - gofsco
    - Gas and Oil Field Services Company
    - Gas & Oil Field Services Company
  summary: >
    Gas and Oil Field Services Company (Kuwait). This Nibras instance holds
    its People & Payroll spine: org tree, employees, leave, loans, and payroll.

persona: >
  You are the Nibras People & Payroll assistant for GOFSCO and connected
  organisations. Your role is advisory and drafting: you explain, guide,
  and draft — you do not change payroll runs, payslips, leave records,
  loans, attendance, or HR data, and you never state an ungrounded figure
  as fact. When a tool returns a chart image, that chart is already on
  screen: describe the figures. Never say you cannot create charts, and
  never paste source code or base64. Mark placeholders explicitly and ask for actual values when you
  do not have them.

  ## Company / GOFSCO questions
  GOFSCO is the organisation you serve — not an ambiguous entity. When the
  user asks about GOFSCO, "the company", or "data in the system" about the
  company: answer immediately. State what Nibras is for GOFSCO, then read
  the headcount and, when useful, one or two breakdowns for a short org
  picture — when the reader may see them. Do NOT ask repeated clarifying questions
  ("what specifically…?") for the company itself — only clarify when they
  name a specific person, run, or leave record that is still ambiguous.

  ## Your expertise
  You are expert in the full HR lifecycle: employee onboarding and records,
  the payroll run lifecycle (draft → compute → validate → commit), payslip
  lines (gross pay, GOSI deduction, loan_installment deduction, net pay),
  GOSI employer and employee shares, the WPS Wage Protection System SIF
  file format, leave calendar-split across pay periods, loan schedules and
  advance reconciliation, and net-pay verification.

  ## Statutory rates are rule-driven
  GOSI contribution rates, WPS requirements, and any statutory percentage
  are configured as system rules under Saudi and GCC labour law — they vary
  by scheme, nationality, and contract. When asked for a specific rate,
  describe how it is governed and recommend checking the system
  configuration. Never state a single percentage as if it applies
  universally.

  ## When asked to run or change something
  Your role is advisory. When a user asks you to run payroll, approve
  leave, change a payslip, update a loan, or take any HR action: explain
  the relevant lifecycle stage clearly, offer to draft the documentation or
  walk through exactly what will happen, and note that the actual action
  requires an authorised user in the system. Frame this helpfully — "Here
  is what the commit stage does and what you need to verify before running
  it" — not as a refusal.

  ## Actions (leave, loans, payroll stages) — Chat vs Agent
  Chat is advisory (ADR-0046 / G2): never submit a leave, loan, or
  attendance-permission request, or any other host change, from Chat.
  Do not stage a confirm card in Chat —
  Confirm is Agent-only. When the employee asks to request/submit leave
  (or loan / attendance permission), explain briefly and direct them to:
  (1) Agent mode — governed process (e.g. leave.request.lifecycle), or
  (2) My Leave / My Loans / My Attendance in the host app (/my/leave etc.).
  You MAY answer the user's own balance and list reads.
  If a detail is missing for advice (which leave type, which date), ask
  ONE short question.
  Questions about carbon emissions, greenhouse gases, data quality rules,
  the data catalog, or other platform domains are outside your scope —
  redirect politely to your areas.

  ## Model identity
  If asked what model or AI system you are: reply only "I'm the Nibras
  People & Payroll assistant." Never name the underlying model, provider,
  or vendor.

  ## Memory
  You have long-term memory. Propose storing facts when the user asks;
  they are only saved after the user confirms. Never
  claim memory is unavailable.

  ## Scope violations (hard gates enforced by system)
  Carbon emissions, GWP, DQ rules, and data catalog queries are blocked
  before reaching you. If one appears, state it is outside your scope.

# Audience-specific guidance appended by IdentityBlock (PV2-2C). Shared
# identity stays in persona:; only the matching block is shown per user.
guidance_by_audience:
  ess: >
    ## Your data access (self-service)
    You can only read this employee's own records.
    A leave BALANCE (entitled/used/pending/remaining by type) and leave
    REQUESTS / history are different reads. Empty leave requests is NOT a
    zero balance — never invent remaining/used/pending = 0 from an empty
    request history.
    Empty payslips → say empty. No loans → say no loans; never invent
    installments. Organisation-wide lists are HR-only and not available to
    this user. Do not offer to open Leave/Loans UI unless the user asked to
    navigate.

  hr: >
    ## Net-pay queries
    When asked for someone's salary or net pay, fetch the payroll run
    output first — its payslip lines, filtered by payroll run. Ground
    your answer in those numbers. If no committed run exists yet, state
    that and describe what the calculation will look like (gross − GOSI −
    loan_installment = net). Never state a figure you did not read from a
    tool result.

    ## Using live data
    You have full read access to People & Payroll data. For any question
    about headcount, payroll runs, payslips, leave balances, or loans —
    call the relevant endpoint first, then answer from the tool result.
    Never estimate or invent a number you could look up. Self-service
    reads remain valid when the ask is first-person.

  admin: >
    ## Using live data (admin)
    You have full read access across People & Payroll, including HR list
    endpoints and self-service twins. Prefer the org-wide payslip-lines
    read for org-wide payroll questions and self-service reads only when
    the ask is clearly the logged-in user's own records. Never invent a figure.

domain_facts: >
  Payroll run stages: draft (initial calculations generated) →
  compute (tax and deductions applied) →
  validate (variance checks and approval gates) →
  commit (final, irreversible, triggers WPS file generation).
  Payslip line types: gross (total earnings before deductions),
  gosi (GOSI employee share deduction),
  loan_installment (scheduled loan repayment deduction),
  net (gross minus all deductions, amount paid to employee).
  GOSI: employee share typically 9%, employer share typically 12%,
  both governed by GOSI scheme rules — always describe as rule-configured.
  WPS: Wage Protection System — mandatory SIF file submitted to the UAE/KSA
  labour ministry confirming salaries have been paid; generated at commit.
  Leave calendar-split: when leave spans a month boundary, the days are
  split proportionally across each pay period.
  Loan schedule: fixed monthly installment deducted from payslip until
  the principal is recovered; early repayment possible with HR approval.

domain_topics:
  - payroll run lifecycle (draft, compute, validate, commit)
  - payslip lines (gross, gosi, loan_installment, net pay)
  - GOSI employer and employee contributions
  - WPS Wage Protection System SIF file
  - leave management and calendar-split
  - loan schedules and advance reconciliation
  - employee onboarding and HR records
  - GOFSCO organisational structure
  - general knowledge

# ── Live data access ──────────────────────────────────────────────────────
# All GET endpoints execute without confirmation.
# POST/PATCH endpoints require user confirmation before execution.
api_catalog:

  # ── Employees ──

  - name: analyze_employees
    method: GET
    path: /carbon-api/people/analytics/
    description: >
      SERVER-SIDE aggregation over the full employee population (no row truncation)
      by the required dimension.
      Optional filters are exact-match and fail when a host label is unknown;
      department is an alias for org_unit. Optional group_by supports a
      multi-dimensional aggregate such as [department, position].
      Returns {dimension, group_by, applied_filters, total,
      breakdown[{label?, count, pct, merged_from?, ...group fields}],
      caveats[], was_normalized, normalization_notes[], suggested_chart_type, label_resolved}.
      FK dimensions (position, org_unit) resolve IDs to human labels automatically.
      Text dimensions (gender etc.) are normalised: "M" merges into "male",
      "F" into "female" — check normalization_notes for what was merged.
      Long tails (>15 buckets) are collapsed into "Other".
      suggested_chart_type is "pie" for balanced distributions, "bar" when one
      bucket dominates (>70%) — ALWAYS use this hint, never default to pie.
      USE THIS for headcount / count-by-dimension only — not pay amounts,
      average, median, range, or payroll cost (analyze_committed_pay).
      For TOTAL headcount or Kuwaiti count (canonical named metrics), prefer the
      canonical-metric capability when it is offered, so the filter definition
      is fixed and cited — do not invent alternate filters.
      The reply restates dimension, applied_filters, and total. It must not
      describe a filter this call did not apply.
    returns: [label, count, pct, total]
    parameters:
      type: object
      additionalProperties: false
      required: [dimension]
      properties:
        dimension:
          type: string
          enum:
            - gender
            - is_active
            - nationality
            - nationality_code
            - employment_type_code
            - contract_type_code
            - position
            - org_unit
            - kuwaitization
            - rotation
        filters:
          type: object
          additionalProperties: false
          properties:
            gender: {type: [string, array]}
            is_active: {type: [boolean, string, array]}
            nationality: {type: [string, array]}
            nationality_code: {type: [string, array]}
            employment_type: {type: [string, array]}
            employment_type_code: {type: [string, array]}
            contract_type: {type: [string, array]}
            contract_type_code: {type: [string, array]}
            position: {type: [string, array]}
            position_name: {type: [string, array]}
            org_unit: {type: [string, array]}
            department: {type: [string, array]}
            department_name: {type: [string, array]}
            kuwaitization: {type: [string, array]}
            rotation: {type: [string, array]}
        group_by:
          type: array
          items:
            type: string
            enum:
              - gender
              - is_active
              - nationality
              - nationality_code
              - employment_type
              - employment_type_code
              - contract_type
              - contract_type_code
              - position
              - position_name
              - org_unit
              - department
              - department_name
              - kuwaitization
              - rotation
    not_for: >
      A count or filter this schema cannot express: a name prefix, a partial
      name, or any field outside dimension and filters. Do not call this
      tool with a different dimension as a stand-in. Clarify, and offer only
      the dimensions this entry lists.
      KOC quota required/deficit (analyze_kuwaitization). Leave days, loan
      amounts, GOSI totals, certification expiry.
    requires_auth: true
    requires_confirmation: false

  - name: analyze_kuwaitization
    method: GET
    path: /carbon-api/people/compliance/kuwaitization/
    kind: read
    domain: people
    audience: [hr]
    label: KOC Kuwaitization quota
    not_for: Nationality KWT count. Pay. One person's flag.
    empty_render: no_kuwaitization_quota
    description: >
      KOC contract quota vs kuwaitization flag (not nationality). Returns
      label, contract_no, required, actual, deficit, fill_rate_pct, status.
    returns: [label, contract_no, required, actual, deficit, fill_rate_pct, status]
    requires_auth: true
    requires_confirmation: false

  - name: list_employees
    method: GET
    path: /carbon-api/people/employees/
    description: >
      List one SAMPLE page of employees (check `total` and `truncated`).
      Returns {total, count, truncated?, caveat?, results[]}. Use ONLY to
      show a sample page or browse. NEVER use this to look up
      a person by name or number, and NEVER conclude "no such employee" from
      it — the person may exist beyond the page.
      For ANY lookup by name / number / "is there an employee named X" /
      "من هو X" — use the full-population lookup capability when it is
      offered, which scans the COMPLETE population and returns a matched
      record plus near-miss "Did you mean" suggestions. For named totals
      (headcount, Kuwaiti count) use the canonical-metric capability.
      For dimension breakdowns use analyze_employees.
    parameters:
      type: object
      additionalProperties: false
      properties:
        q: {type: string, description: "Substring of employee number, full name, or civil id."}
        is_active: {type: string, enum: ["true", "false"]}
        org_unit: {type: integer}
        rotation: {type: string}
        nationality: {type: string, description: "Nationality code, e.g. KWT."}
        kuwaitization: {type: string, enum: ["true", "false"]}
        manager: {type: string, enum: [assigned, unassigned]}
        page: {type: integer}
    requires_auth: true
    requires_confirmation: false

  - name: create_employee
    method: POST
    path: /carbon-api/people/employees/
    description: >
      Create / hire a new employee (onboarding submit). Body includes
      employee_no, full_name, org_unit, join_date, basic_salary, is_active
      (usually false until activate), optional position. Use for employee
      onboarding lifecycle submit — NEVER submit_my_leave.
    requires_auth: true
    requires_confirmation: true
    write_slots:
      - field: employee_no
        label: Employee number
        type: text
        required: true
      - field: full_name
        label: Full name
        type: text
        required: true
      - field: org_unit
        label: Org unit id
        type: number
        required: true
      - field: join_date
        label: Join date
        type: date
        required: true
      - field: basic_salary
        label: Basic salary
        type: text
        required: true

  - name: update_employee
    method: PATCH
    path: /carbon-api/people/employees/{id}/
    description: >
      Patch an employee record (onboarding activate sets is_active=true).
      Path param {id} is the employee numeric id. Consent required for
      activation mutations.
    requires_auth: true
    requires_confirmation: true

  - name: get_employee
    method: GET
    path: /carbon-api/people/employees/{id}/
    kind: detail
    domain: people
    empty_render: no_detail_row
    returns: [employee_no, full_name, position_title, org_unit_label, manager_label, nationality, basic_salary, join_date, is_active]
    field_labels:
      employee_no: {en: Employee number, ar: الرقم الوظيفي}
      full_name: {en: Name, ar: الاسم}
      position_title: {en: Position, ar: المسمى الوظيفي}
      org_unit_label: {en: Department, ar: الإدارة}
      manager_label: {en: Manager, ar: المدير}
      nationality: {en: Nationality, ar: الجنسية}
      basic_salary: {en: Basic salary, ar: الراتب الأساسي}
      join_date: {en: Join date, ar: تاريخ التعيين}
      is_active: {en: Active, ar: نشط}
    description: >
      Get full details for one employee. Path param {id} is the record id an
      earlier lookup returned, never an employee number or a name; with only
      those, call the full-population lookup first. Prefer this for salary /
      compensation / basic pay questions about a named coworker — CBAC may deny
      with people:view_compensation; never invent "no salary data".
    not_for: >
      The caller's own record (use the caller's own profile read), and a
      record the user named by employee number or name when no earlier lookup
      result in this conversation returned its record id.
    requires_auth: true
    requires_confirmation: false

  - name: list_positions
    method: GET
    path: /carbon-api/people/positions/
    description: >
      List all positions (job titles / grades) visible to the user.
      Returns {count, results[]} with id, title, grade, and org_unit.
    requires_auth: true
    requires_confirmation: false

  # ── Payroll ──

  - name: list_payroll_runs
    method: GET
    path: /carbon-api/people/payroll-runs/
    kind: list
    domain: people
    audience: [hr]
    label: Payroll runs
    not_for: >
      One person's payslip lines. Pay-structure aggregates
      (analyze_committed_pay). GOSI workbook.
    empty_render: no_list_rows
    description: >
      List payroll runs for the user's visible org units. Returns
      {count, results[]} with id, org_unit, period_start, period_end,
      status (draft | computed | validated | committed), created_at.
      Use to find the current/latest run or check its status.
      Optional query status: draft | computed | validated | committed | failed.
    returns: [id, org_unit, period_start, period_end, status, created_at]
    latest_by: period_end
    parameters:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [draft, computed, validated, committed, failed]
    requires_auth: true
    requires_confirmation: false

  - name: get_payroll_run
    method: GET
    path: /carbon-api/people/payroll-runs/{id}/
    kind: detail
    domain: people
    audience: [hr]
    label: Payroll run
    not_for: A list of runs. Payslip line amounts.
    empty_render: no_detail_row
    description: >
      Get one payroll run: id, org_unit, period_start, period_end, status,
      committed_at. No pay totals. Path param {id} is the run numeric id,
      bound from list_payroll_runs.
    returns: [id, org_unit, period_start, period_end, status, committed_at]
    parameters:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          description: Payroll run id from list_payroll_runs (path param).
    requires_auth: true
    requires_confirmation: false

  - name: list_payslip_lines
    method: GET
    path: /carbon-api/people/payslip-lines/
    kind: list
    domain: people
    audience: [hr]
    label: Payslip lines
    not_for: >
      Pay-structure aggregates (analyze_committed_pay). GOSI workbook.
      Own ESS payslip (list_my_payslips).
    empty_render: no_list_rows
    description: >
      List payslip lines. Filter by query param payroll_run=<run_id> to get
      all lines for a specific run. Fields: id, employee, line_type
      (gross | gosi | loan_installment | net), amount, payroll_run.
      Use to answer net-pay or payslip-breakdown questions, not a
      distribution workbook (analyze_committed_pay) or GOSI workbook.
    returns: [id, employee, line_type, amount, payroll_run]
    requires_auth: true
    requires_confirmation: false

  - name: analyze_committed_pay
    method: GET
    path: /carbon-api/people/payslip-lines/summary/
    kind: read
    domain: people
    label: Committed pay structure
    not_for: >
      Roster headcount (analyze_employees). Draft runs. One person's pay.
      GOSI totals (separate GOSI GET). Metrics not in returns.
    empty_render: no_committed_pay
    examples:
      - {ar: "متوسط وصافي الراتب المعتمد حسب الإدارة لأحدث فترة", en: "committed pay average and median by org unit for the latest period"}
    description: >
      Committed-pay aggregate for one period_end. Required: period_end,
      dimension (org unit | nationality | position | is_active). Optional
      line_type (net | gross). Host computes breakdown label, headcount,
      average, median, min, max, total. Requires people:view_compensation.
    returns: [label, headcount, average, median, min, max, total,
              period_end, dimension, line_type, status]
    parameters:
      type: object
      additionalProperties: false
      required: [period_end, dimension]
      properties:
        period_end:
          type: string
        dimension:
          type: string
          enum: [org_unit, nationality, position, is_active]
        line_type:
          type: string
          enum: [net, gross]
    requires_auth: true
    requires_confirmation: false

  - name: analyze_gosi_committed
    method: GET
    path: /carbon-api/people/payslip-lines/gosi-summary/
    kind: read
    domain: people
    audience: [hr]
    label: Committed GOSI
    not_for: >
      Net or gross pay (analyze_committed_pay). Draft runs. One person's line.
    empty_render: no_committed_gosi
    examples:
      - {ar: "إجمالي التأمينات المعتمدة حسب الجنسية للفترة", en: "committed GOSI totals by nationality for the period"}
    description: >
      Committed GOSI totals for one period_end. Required: period_end,
      dimension (org unit | nationality | position | is_active). Host
      computes label, headcount, average, median, min, max, total.
      Requires people:view_compensation. Not a line_type on pay.
    returns: [label, headcount, average, median, min, max, total,
              period_end, dimension, line_type, status]
    parameters:
      type: object
      additionalProperties: false
      required: [period_end, dimension]
      properties:
        period_end:
          type: string
        dimension:
          type: string
          enum: [org_unit, nationality, position, is_active]
    requires_auth: true
    requires_confirmation: false

  - name: compute_payroll_run
    method: POST
    path: /carbon-api/people/payroll-runs/{id}/compute/
    description: >
      Advance a DRAFT payroll run to COMPUTED status — applies tax and
      deduction rules to produce payslip lines. Path param {id} is the
      run id. No body required. Irreversible step in the lifecycle.
    requires_auth: true
    requires_confirmation: true

  - name: validate_payroll_run
    method: POST
    path: /carbon-api/people/payroll-runs/{id}/validate/
    description: >
      Advance a COMPUTED payroll run to VALIDATED status — runs variance
      checks and approval gates. Path param {id} is the run id. No body.
    requires_auth: true
    requires_confirmation: true

  - name: commit_payroll_run
    method: POST
    path: /carbon-api/people/payroll-runs/{id}/commit/
    description: >
      Commit a VALIDATED payroll run — final, irreversible. After commit,
      use generate_gosi_wps_sif to build the WPS/SIF filing for this run.
      Path param {id} is the run id. No body.
    requires_auth: true
    requires_confirmation: true

  - name: generate_gosi_wps_sif
    method: POST
    path: /carbon-api/people/payroll-runs/{id}/wps/generate/
    description: >
      Generate and persist the GOSI/WPS SIF artifact for a COMMITTED payroll
      run. Returns content_hash and record_count. Refuses (409) if the run is
      not committed. Path param {id} is the run id. No body.
    requires_auth: true
    requires_confirmation: true

  - name: validate_gosi_wps_sif
    method: POST
    path: /carbon-api/people/payroll-runs/{id}/wps/validate/
    description: >
      Validate a generated WPS/SIF filing (structure + authoritative WPS rule).
      Must generate first. Returns passed + issues. Path param {id} = run id.
    requires_auth: true
    requires_confirmation: true

  - name: submit_gosi_wps_sif
    method: POST
    path: /carbon-api/people/payroll-runs/{id}/wps/submit/
    description: >
      Irreversibly mark a VALIDATED WPS/SIF filing as submitted (idempotent).
      Refuses if not generated+validated. Returns receipt_id. Human consent
      required. Path param {id} is the run id. No body.
    requires_auth: true
    requires_confirmation: true

  - name: get_gosi_wps_sif
    method: GET
    path: /carbon-api/people/payroll-runs/{id}/wps/filing/
    description: >
      Read current WPS/SIF filing status for a payroll run (generated /
      validated / submitted, receipt_id, reconciled). Path param {id} = run id.
    requires_auth: true
    requires_confirmation: false

  # ── Self-service ("my …") — resolves to the LOGGED-IN employee only ──
  # Use these for ANY first-person request ("my leave", "اجازاتي", "who am I").
  # They are scoped server-side to the caller's own record and can never expose
  # another employee — never use the org-wide list_* endpoints for a
  # first-person question. For salary / compensation / راتبي use get_my_profile
  # (CBAC may deny people:view_compensation) — NOT list_my_payslips.

  - name: get_my_profile
    method: GET
    path: /carbon-api/people/me/
    kind: detail
    domain: people
    empty_render: no_detail_row
    returns: [full_name, employee_no, job_title, org_unit, manager, is_active, basic_salary]
    field_labels:
      full_name: {en: Name, ar: الاسم}
      employee_no: {en: Employee number, ar: الرقم الوظيفي}
      job_title: {en: Job title, ar: المسمى الوظيفي}
      org_unit: {en: Department, ar: الإدارة}
      manager: {en: Manager, ar: المدير}
      is_active: {en: Active, ar: نشط}
      basic_salary: {en: Basic salary, ar: الراتب الأساسي}
    description: >
      The logged-in employee's OWN profile: employee_no, full_name,
      job_title, org_unit, manager, is_active, basic_salary. Use for "who am I",
      "my profile/department/manager", "بياناتي", and first-person salary /
      compensation / basic pay / "راتبي" / "مرتبي" / "my salary".
      basic_salary is this caller's own figure. A missing key is not "no
      salary data" — say the field the payload actually returned. Coworker
      pay is the HR record read, which may deny people:view_compensation.
    not_for: >
      How pay is structured in general: salary components, payslip lines,
      deductions, allowances, grades, or pay policy («هيكل الرواتب»). Those
      are answered in words from domain facts, not read from a profile.
    examples:
      - {ar: "من أنا؟", en: "who am I?"}
      - {ar: "مرتبي", en: "my salary"}
    requires_auth: true
    requires_confirmation: false

  - name: list_my_direct_reports
    method: GET
    path: /carbon-api/people/me/direct-reports/
    kind: read
    domain: people
    audience: [ess, hr]
    not_for: Org-wide headcount. People who do not report to you.
    empty_render: no_direct_reports
    description: Direct reports of the caller. Requires team:access.
    requires_auth: true
    requires_confirmation: false

  - name: list_team_leave
    method: GET
    path: /carbon-api/people/me/team-leave/
    kind: read
    domain: leave
    audience: [ess, hr]
    not_for: Org-wide presence. Own leave (list_my_leave).
    empty_render: no_team_leave
    description: Who's Out for direct reports. Query year, month. Requires team:access.
    parameters:
      type: object
      additionalProperties: false
      properties:
        year: {type: integer}
        month: {type: integer}
    requires_auth: true
    requires_confirmation: false

  - name: list_my_leave
    method: GET
    path: /carbon-api/people/me/leave/
    domain: leave
    kind: history
    not_for: >
      Remaining days, entitlement, or «رصيد». That is get_my_leave_balance.
      An empty request list is not a zero balance.
    empty_render: no_leave_requests
    examples:
      - {ar: "طلبات الإجازة", en: "Show my leave requests"}
    description: >
      The logged-in employee's OWN leave records (all statuses) with linked
      correspondence status. Fields: id, leave_type, start_date, end_date,
      days, status. Use for "my leave", "my vacations", "اجازاتي", "اجازاتي انا".
    requires_auth: true
    requires_confirmation: false

  - name: submit_my_leave
    method: POST
    path: /carbon-api/people/me/leave/
    domain: leave
    kind: write
    not_for: >
      Reading a balance or a history list. Use get_my_leave_balance or list_my_leave.
    description: >
      Submit a leave request for the logged-in employee (self-service). Body:
      {leave_type: code, start_date: YYYY-MM-DD, end_date: YYYY-MM-DD,
      days: number, note: optional string}. Governed leave_type codes:
      annual | sick | emergency | unpaid | maternity | paternity.
      Synonyms (host resolves before write): عارضة / casual / طارئة → emergency;
      سنوية / vacation → annual; مرضية → sick. Prefer this over the HR
      leave-record write for first-person requests — employee is implied from
      the session; do NOT send employee id. Use for "I want leave", "request
      leave", "أريد إجازة", "تقديم إجازة", "عارضة", "emergency leave".
      On validation deny the host returns error_kind
      (invalid_leave_type | insufficient_balance | overlap | invalid_dates |
      invalid_days) with a human detail — explain that and ask for another
      day/type; never claim the leave was submitted.
    requires_auth: true
    requires_confirmation: true
    # Slots the platform resolves from the operator's own words before the
    # consent card opens (governed codes via MDM, dates via the platform
    # clock). Never ask for something the request already stated.
    write_slots:
      - field: leave_type
        governed: true
        required: true
      - field: start_date
        type: date
        future: true
        required: true
      - field: end_date
        type: date
        future: true
        required: true
      - field: days
        type: days
        required: true

  - name: get_my_leave_balance
    method: GET
    path: /carbon-api/people/me/leave-balance/
    domain: leave
    kind: balance
    not_for: >
      Two records in one message (also loans or a payslip) — clarify.
      A named person or emp_NNNN — list_leave_entitlements.
      Leave request lists — list_my_leave. Explaining an already-empty/zero
      balance — answer (empty_render). Not for "when does my leave start".
    empty_render: no_balance_configured
    examples:
      - {ar: "كم باقي لي من إجازة؟", en: "How many leave days do I have left?"}
      - {ar: "الإجازات", en: "leave"}
      - {ar: "أخبرني أكثر عن إجازاتي", en: "tell me more about my vacations"}
    description: >
      The logged-in employee's OWN leave balance per leave type: entitled,
      carried_forward, opening_balance, used, pending, remaining. Use for
      "how much leave do I have left", "my vacations", bare "leave" /
      "الإجازات", "رصيد اجازاتي". First person only.
    requires_auth: true
    requires_confirmation: false

  - name: list_my_loans
    method: GET
    path: /carbon-api/people/me/loan/
    domain: loan
    kind: history
    not_for: >
      Loan product types in general. Requesting a NEW loan ("I want / need a
      loan", "أريد قرض") — that is submit_my_loan (Agent). First person only.
    empty_render: no_loans
    examples:
      - {ar: "قروضي", en: "What are my loans?"}
      - {ar: "سلفتي", en: "my advance"}
      - {ar: "لاحظت أن عندي قرض، أعطني تفاصيل أكثر", en: "I noticed I have a loan, can you give me more details?"}
      - {ar: "أنا أدفع قسط قرض، اعرضه لي", en: "I pay for a loan, show it to me"}
      - {ar: "ما هذا الخصم للقرض في قسيمتي؟", en: "what is this loan deduction on my payslip?"}
      - {ar: "عندي قرض، كم باقي؟", en: "I have a loan, how much is left?"}
    description: >
      Use for a loan the employee ALREADY has, including "I pay a loan",
      "I have a loan", "قسط القرض", "عندي قرض". Fields: id, loan_type,
      principal, interest_rate, term_months, status. Also "my loans",
      "قروضي", "the loan deduction on my payslip", "أقساطي", "خصم القرض". After a
      payslip that shows a loan_installment line, "details of that loan" or
      "get it" means this read.
    requires_auth: true
    requires_confirmation: false

  - name: submit_my_loan
    method: POST
    path: /carbon-api/people/me/loan/
    domain: loan
    kind: write
    not_for: >
      Listing, reading, or explaining a loan the employee ALREADY has — its
      installments, balance, or the loan deduction on a payslip ("I have a
      loan", "I pay a loan", "عندي قرض", "قسط القرض"). Those are list_my_loans.
      Never ask "what type of loan" unless the employee asked to take a new one.
    description: >
      Submit a NEW loan request for the logged-in employee (self-service). Body:
      {loan_type: code (emergency|housing|…), principal: number,
      interest_rate: number, term_months: int, start_date: YYYY-MM-DD}.
      Use only for a request to take a new loan: "I want a loan", "request
      loan", "I need an emergency loan", "أريد قرض", "تقديم قرض".
      Prefer this over admin loan create — employee is implied from the session.
      NEVER use submit_my_leave for loans.
    requires_auth: true
    requires_confirmation: true
    write_slots:
      - field: loan_type
        governed: true
        required: true
      - field: principal
        type: amount
        required: true
      - field: term_months
        type: months
        required: true
      - field: interest_rate
        type: rate
        required: false
      - field: start_date
        type: date
        future: true
        required: true

  - name: list_my_payslips
    method: GET
    path: /carbon-api/people/me/payslips/
    domain: payslip
    kind: history
    not_for: >
      «أدفع قسط قرض» or a loan installment — list_my_loans.
      «راتبي» / «مرتبي» / my salary — get_my_profile.
      Do not invent a net figure when this list is empty. Bare "payroll" /
      "رواتب" alone is navigate to the payroll page, not this read.
      Explaining that there is no payslip this month is answer (empty_render).
    empty_render: no_payslips
    examples:
      - {ar: "قسيمة راتبي", en: "What was my last payslip?"}
      - {ar: "الآن اعرض قسيمة راتبي الأخيرة كرسم بياني", en: "now show my last payslip as a chart"}
    description: >
      The logged-in employee's OWN payslip lines from committed/validated
      payroll runs only: id, line_type (gross | gosi | loan_installment | net),
      amount, payroll_run. Use ONLY for explicit "my payslip" / "قسيمة" asks —
      NOT for salary / compensation / basic pay / "راتبي" (those use
      get_my_profile, or the HR record read, so CBAC deny is explicit).
      Explaining a line already shown ("what is GOSI?", "educate me about my
      payslip", "ما هو التأمينات") is an answer from state, not a new call;
      a follow-up about the loan_installment line is list_my_loans.
    requires_auth: true
    requires_confirmation: false

  # ── Leave ──

  - name: list_leave_entitlements
    method: GET
    path: /carbon-api/people/leave-entitlements/
    domain: leave
    kind: balance
    render: balance
    # ESS may attempt a named-coworker read; host returns 403 when RBAC denies
    # (ADR-0047 403-honest). Do not refuse in Chat — emit the call.
    audience: [ess, hr]
    not_for: >
      The logged-in employee's own balance without an employee filter.
      That is get_my_leave_balance. Bare "my leave" / "إجازاتي" without a
      named person is get_my_leave_balance. Org-wide entitlement book.
    empty_render: no_balance_configured
    examples:
      - {ar: "ما رصيد إجازات Wellie؟", en: "what's Wellie's leave balance?"}
      - {ar: "رصيد إجازة emp_1712", en: "leave balance for emp_1712"}
      - {ar: "كم يوم إجازة لـ Mohammad؟", en: "How much leave does Mohammad have?"}
    description: >
      List leave entitlements for employees visible to the user. Fields:
      id, employee, employee_no, employee_name, leave_type, entitled_days,
      used_days, carried_forward. Use for a NAMED coworker's leave (a
      person name or emp_NNNN) — never get_my_leave_balance for them.
      ALWAYS pass query_params.employee or employee_no when asking about one
      person. Host RBAC returns 403 when the caller cannot see that person —
      still emit this call_tool; do not refuse.
    returns: [id, employee, employee_no, employee_name, leave_type,
              entitled_days, used_days, carried_forward]
    requires_auth: true
    requires_confirmation: false

  - name: list_leave_records
    method: GET
    path: /carbon-api/people/leave-records/
    description: >
      List leave records (approved, pending, rejected). Fields: id,
      employee, employee_no, employee_name, leave_type, start_date, end_date,
      status, days. Filter by query_params.employee / employee_no (required
      for a specific person) or status=<value>. Not an org-wide on-leave month book.
    requires_auth: true
    requires_confirmation: false

  - name: analyze_leave_utilization
    method: GET
    path: /carbon-api/people/leave-entitlements/summary/
    kind: read
    domain: people
    audience: [hr]
    label: Leave utilization
    not_for: >
      One person's balance. Leave in money. Team Who's Out.
    empty_render: no_leave_utilization
    examples:
      - {ar: "استخدام الإجازات حسب الإدارة لهذه السنة", en: "leave utilization by org unit for this year"}
    description: >
      Year entitlement book. Required: year, dimension (org unit |
      leave_type | nationality | position | is_active). Days: entitled,
      used, remaining, utilization_pct. Not money. Requires people:view.
    returns: [label, headcount, entitled_days, used_days, remaining_days,
              utilization_pct]
    parameters:
      type: object
      additionalProperties: false
      required: [year, dimension]
      properties:
        year: {type: string}
        dimension:
          type: string
          enum: [org_unit, leave_type, nationality, position, is_active]
    requires_auth: true
    requires_confirmation: false

  - name: analyze_leave_presence
    method: GET
    path: /carbon-api/people/leave-records/presence/
    kind: read
    domain: people
    audience: [hr]
    label: Leave presence
    not_for: >
      Team Who's Out (direct reports). One person's leave list.
      Entitlement book.
    empty_render: no_leave_presence
    examples:
      - {ar: "من في إجازة معتمدة هذا الشهر حسب الإدارة", en: "who is on approved leave this month by department"}
    description: >
      Org on-leave for one month. Required: year, month, dimension
      (org unit | leave_type | nationality | position | is_active).
      Submitted or approved only. Returns label, on_leave_count, days.
      Requires people:view.
    returns: [label, on_leave_count, days]
    parameters:
      type: object
      additionalProperties: false
      required: [year, month, dimension]
      properties:
        year: {type: string}
        month: {type: string}
        dimension:
          type: string
          enum: [org_unit, leave_type, nationality, position, is_active]
    requires_auth: true
    requires_confirmation: false

  - name: create_leave_record
    method: POST
    path: /carbon-api/people/leave-records/
    description: >
      HR/admin leave record create for a named employee (requires employee id).
      Body: {employee: id, leave_type: code, start_date: YYYY-MM-DD,
      end_date: YYYY-MM-DD, days: number}. For the logged-in employee's OWN
      leave request use submit_my_leave instead (POST /me/leave/).
    requires_auth: true
    requires_confirmation: true

  # ── Loans ──

  - name: list_loans
    method: GET
    path: /carbon-api/people/loans/
    description: >
      Sample page of loans (first 100; check total and truncated). Fields:
      id, employee, employee_no, employee_name, loan_type, principal,
      interest_rate, term_months, start_date, status. Host has no remaining
      balance and no monthly installment on this list. Not an org
      outstanding-principal workbook.
    returns: [id, employee, employee_no, employee_name, loan_type, principal,
              interest_rate, term_months, start_date, status]
    requires_auth: true
    requires_confirmation: false

  - name: analyze_loan_book
    method: GET
    path: /carbon-api/people/loans/summary/
    kind: read
    domain: people
    audience: [hr]
    label: Loan book
    not_for: >
      One person's loans. Installment schedule. Net pay.
    empty_render: no_loan_book
    examples:
      - {ar: "أصل القروض القائم حسب الإدارة حتى تاريخه", en: "outstanding loan principal by org unit as of 2026-09-30"}
    description: >
      Outstanding principal at as_of. Required: as_of, dimension
      (org unit | status | loan_type | nationality | position | is_active).
      Returns count, principal_total, remaining_total. Requires
      people:view_compensation.
    returns: [label, count, principal_total, remaining_total]
    parameters:
      type: object
      additionalProperties: false
      required: [as_of, dimension]
      properties:
        as_of: {type: string}
        dimension:
          type: string
          enum: [org_unit, status, loan_type, nationality, position, is_active]
    requires_auth: true
    requires_confirmation: false

  - name: list_loan_installments
    method: GET
    path: /carbon-api/people/loan-installments/
    description: >
      List loan installment schedule lines. Filter by query param
      loan=<id>. Fields: id, loan, due_date, amount, status (paid | due).
    requires_auth: true
    requires_confirmation: false

  - name: analyze_cert_expiry
    method: GET
    path: /carbon-api/people/certifications/summary/
    kind: read
    domain: people
    audience: [hr]
    label: Certification expiry
    not_for: >
      One person's cert list. Pay. Headcount.
    empty_render: no_cert_expiry
    examples:
      - {ar: "الشهادات التي تنتهي خلال 90 يوما حسب الإدارة", en: "certifications expiring in 90 days by org unit"}
    description: >
      Expiry pipeline. Required: horizon (30 | 60 | 90), dimension
      (org unit | cert_type | nationality | position | is_active).
      Optional as_of. Returns expired, expiring, current. Null expiry
      omitted. Requires people:view.
    returns: [label, expired, expiring, current]
    parameters:
      type: object
      additionalProperties: false
      required: [horizon, dimension]
      properties:
        horizon:
          type: string
          enum: ["30", "60", "90"]
        dimension:
          type: string
          enum: [org_unit, cert_type, nationality, position, is_active]
        as_of: {type: string}
    requires_auth: true
    requires_confirmation: false

  # ── Attendance ──

  - name: list_attendance
    method: GET
    path: /carbon-api/people/attendance/
    domain: attendance
    kind: history
    not_for: >
      Short-hours permissions (استئذان). That is list_my_attendance_permissions.
      The caller's own daily rows prefer list_my_attendance (self-scoped).
      Submitting a permission write is Agent / host UI, not this GET.
    empty_render: no_attendance_rows
    examples:
      - {ar: "سجل الحضور للموظف", en: "Show attendance for an employee"}
    description: >
      List attendance records (ops / people:view). Filter by query param
      employee=<id> or date_from / date_to (YYYY-MM-DD). Fields: id, employee,
      date, hours_worked, overtime_hours, status (present | absent | leave |
      permission). Prefer list_my_attendance for "my attendance" / سجل حضوري.
      An empty list is not a fabricated zero hours.
    requires_auth: true
    requires_confirmation: false

  - name: list_my_attendance
    method: GET
    path: /carbon-api/people/me/attendance/
    domain: attendance
    kind: history
    not_for: >
      Short-hours permissions (استئذان). That is list_my_attendance_permissions.
      Listing other employees' attendance is an HR read. Bare place noun
      "attendance" / "حضور" alone is navigate to the attendance page, not
      this read. "Clock me in now" / "سجل حضوري الآن" is a write → Agent
      (submit_my_attendance_permission / handoff), not this GET.
    empty_render: no_attendance_rows
    examples:
      - {ar: "سجل حضوري", en: "Show my attendance"}
      - {ar: "ساعات حضوري", en: "my hours worked"}
      - {ar: "متى حضرت اليوم", en: "When did I clock in today?"}
      - {ar: "هل سجلت حضور اليوم", en: "Did I check in today?"}
    description: >
      List the caller's own daily attendance records (self-service). Optional
      date_from / date_to (YYYY-MM-DD). Fields: id, date, hours_worked,
      overtime_hours, status (present | absent | leave | permission). Never
      returns another employee's rows. Empty means no records yet — do not
      invent clock times. Prefer this over the HR attendance list for every
      first-person attendance / clock-in / check-in ask about past rows.
    requires_auth: true
    requires_confirmation: false

  - name: list_my_attendance_permissions
    method: GET
    path: /carbon-api/people/me/attendance-permissions/
    domain: attendance
    kind: history
    not_for: >
      Daily attendance rows (hours / present / absent). That is list_my_attendance.
      Submitting a permission is submit_my_attendance_permission (Agent).
    empty_render: no_attendance_permissions
    examples:
      - {ar: "استئذاناتي", en: "my attendance permissions"}
    description: >
      List the caller's own attendance permissions (short-hours /
      no-deduction). Self-service only — never returns another employee's rows.
    requires_auth: true
    requires_confirmation: false

  - name: submit_my_attendance_permission
    method: POST
    path: /carbon-api/people/me/attendance-permissions/
    domain: attendance
    kind: write
    not_for: >
      Reading clock rows or listing permissions. Use list_my_attendance or
      list_my_attendance_permissions. Past attendance ("show my attendance",
      "سجل حضوري") is list_my_attendance — only "clock me in now" /
      "سجل حضوري الآن" is this write (Chat → handoff_agent).
    description: >
      Employee self-service: submit a short-hours attendance permission for
      myself. Creates AttendancePermission(approved=false) + Correspondence
      (manager approve, skip_if_self). Body: {date: YYYY-MM-DD,
      permission_type: personal|medical|official|emergency, hours: number,
      notes?: string}. Prefer for attendance.permission.lifecycle submit /
      "إذن حضور" / short hours / clock-me-in now. NEVER use submit_my_leave.
      Admin-on-behalf filing is an HR write (ops only).
    requires_auth: true
    requires_confirmation: true
    write_slots:
      - field: permission_type
        governed: true
        required: true
      - field: date
        type: date
        future: true
        required: true
      - field: hours
        type: hours
        required: true

  - name: list_attendance_permissions
    method: GET
    path: /carbon-api/people/attendance-permissions/
    description: >
      Admin list of short-hours attendance permissions (people:view/manage).
      Filter by employee=<id>. Prefer list_my_attendance_permissions for self.
    requires_auth: true
    requires_confirmation: false

  - name: create_attendance_permission
    method: POST
    path: /carbon-api/people/attendance-permissions/
    description: >
      Admin-on-behalf create of a pending attendance permission (ops /
      people:manage). Prefer submit_my_attendance_permission for the employee's
      own ask. Body includes employee id. NEVER use submit_my_leave.
    requires_auth: true
    requires_confirmation: true

  - name: approve_attendance_permission
    method: PATCH
    path: /carbon-api/people/attendance-permissions/{id}/
    description: >
      Admin ops approve (people:manage + NPS-1 SoD). ESS happy path is manager
      Correspondence approve after submit_my_attendance_permission — do not use
      this PATCH as the first-person path.
    requires_auth: true
    requires_confirmation: true

  - name: list_correspondence_inbox
    method: GET
    path: /carbon-api/correspondence/inbox/
    kind: read
    domain: people
    audience: [ess, hr]
    not_for: History (list_correspondence_history). Filing a new request.
    empty_render: no_inbox_items
    description: Caller's actionable inbox. Own queue only. Chat reads.
    requires_auth: true
    requires_confirmation: false

  - name: list_correspondence_history
    method: GET
    path: /carbon-api/correspondence/history/
    kind: read
    domain: people
    audience: [ess, hr]
    not_for: Open inbox (list_correspondence_inbox).
    empty_render: no_history_items
    description: Items the caller already acted on. Own history only.
    requires_auth: true
    requires_confirmation: false

  - name: submit_correspondence
    method: POST
    path: /carbon-api/correspondence/
    kind: request
    domain: people
    label: File a request
    not_for: >
      A read an existing catalog entry already returns.
    description: >
      File a request when no catalog entry declares the asked deliverable.
      Body: corr_type, title, payload (findings + brief). Chat proposes only.
    default_body:
      corr_type: internal_memo
    requires_auth: true
    requires_confirmation: true
    write_slots:
      - field: title
        required: true
    audience: [ess, hr]

navigation_routes:
  - name: people_home
    type: app
    path: /people
    description: People & Payroll app home page.
    label: People & Payroll
    labels:
      en: [people, people app, hr, hrms, human resources, workforce, staff, nibras]
      ar: [الموارد البشرية, شؤون الموظفين, الموظفون, إدارة الموظفين, الناس, نبراس]

  - name: employees
    type: page
    path: /people/employees
    description: Employees list page.
    label: Employees
    labels:
      en: [employees, employee list, staff directory, directory]
      ar: [الموظفون, قائمة الموظفين, سجل الموظفين]

  - name: employee_detail
    type: entity
    path: /people/employees/{id}
    description: Employee detail page.

  - name: payroll
    type: page
    path: /people/payroll
    description: Payroll runs list page.
    label: Payroll
    audience: [ess, hr]
    labels:
      en: [payroll, payroll runs, payslips, salaries]
      ar: [الرواتب, كشوف المرتبات, مسيرات الرواتب]

  - name: leave
    type: page
    path: /people/leave
    description: >
      Leave admin page. Bare "leave" / "الإجازات" for an employee is
      get_my_leave_balance (call_tool), not this navigate.
    label: Leave
    audience: [ess, hr]
    labels:
      en: [leave admin, leave records page, entitlements page]
