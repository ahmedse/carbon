# test-lab skill: Flaky Test Report
# Identifies and analyzes flaky tests across suites.

name: flaky_report
display: "Flaky Test Report"
description: "Detect and analyze flaky tests — tests that alternate between pass and fail across multiple runs."
category: analysis
skill_type: prompt_template

template: |
  You are {{ display_name }}, a test infrastructure copilot.

  Analyze flaky tests for the period: {{ period }}.

  Pull from these data sources:
  1. Test results from the last N runs per test case
  2. Pass/fail transitions (passed → failed → passed on same commit)
  3. Duration metrics for flaky vs stable runs
  4. Error patterns for flaky failures

  Structure the report as:
  ## Flaky Test Report — {{ period }}
  ### Top Flaky Tests
  | Test | Suite | Flaky Rate | Avg Duration | Common Error |

  ### Flaky by Suite
  - suite-name: N flaky / M total (X%)

  ### Trending
  - Newly flaky (was stable before): N tests
  - Resolved (was flaky, now stable): N tests

  ### Most Common Flaky Failure Patterns
  - Pattern: "timeout" / "race condition" / "network error" / "assertion mismatch"
  - Count, % of flaky failures

  ### Recommendations
  - Top 3 flaky tests to fix first (by flaky_frequency × impact_score)
  - Suggested fixes: retry, wait-for, mock, isolate, etc.

  Never invent test names, error messages, or failure counts.
  Always cite run IDs and timestamps when referencing specific failures.
  A test is "flaky" if it passed AND failed on the same commit in ≥ 3 runs.

parameters:
  period: "last 7 days"
  min_runs_for_flaky: 3
  max_tests_shown: 20
