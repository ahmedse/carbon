# ─────────────────────────────────────────────────────────────────
#  Carbon Data Trust Platform — CI/CD Pipeline
#
#  On main push / PR: backend pytest + frontend build + E2E
#  On v* tag push:  all of above → deploy to VPS on success
# ─────────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend tests ────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: carbon_ci
          POSTGRES_USER: carbon_user
          POSTGRES_PASSWORD: carbon_ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DJANGO_ENV: ci
          DJANGO_DEBUG: "False"
          SECRET_KEY: ci-secret-key-not-for-production
          DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
          DJANGO_API_PREFIX: /carbon-api/
          DB_NAME: carbon_ci
          DB_USER: carbon_user
          DB_PASSWORD: carbon_ci_pass
          DB_HOST: localhost
          DB_PORT: 5432
          CSRF_TRUSTED_ORIGINS: ""
          CORS_ALLOWED_ORIGINS: ""
        run: |
          python -m pytest --tb=short -x -q 2>&1 | tail -40

  # ── Frontend build + unit tests ──────────────────────────────
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: carbon-frontend/package-lock.json

      - name: Install dependencies
        working-directory: carbon-frontend
        run: npm ci

      - name: Run unit tests
        working-directory: carbon-frontend
        run: npm run test -- --run

      - name: Build
        working-directory: carbon-frontend
        run: npm run build

  # ── E2E tests (Playwright) ───────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: carbon_ci
          POSTGRES_USER: carbon_user
          POSTGRES_PASSWORD: carbon_ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: carbon-frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install frontend deps
        working-directory: carbon-frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: carbon-frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend & seed E2E users
        working-directory: backend
        env:
          DJANGO_ENV: ci
          DJANGO_DEBUG: "False"
          SECRET_KEY: ci-e2e-secret-key
          DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
          DJANGO_API_PREFIX: /carbon-api/
          DB_NAME: carbon_ci
          DB_USER: carbon_user
          DB_PASSWORD: carbon_ci_pass
          DB_HOST: localhost
          DB_PORT: 5432
          CSRF_TRUSTED_ORIGINS: ""
          CORS_ALLOWED_ORIGINS: ""
        run: |
          python manage.py migrate --noinput
          python manage.py bootstrap_platform 2>/dev/null || true
          python -c "
          import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          import django; django.setup()
          from django.contrib.auth import get_user_model
          User = get_user_model()
          test_users = [
              ('admin', 'admin123', True),
              ('alamien_dataowner', 'data123', False),
              ('sv_dataowner', 'data123', False),
              ('alamien_analyst', 'analyst123', False),
              ('sv_analyst', 'analyst123', False),
              ('alamien_viewer', 'viewer123', False),
              ('carbon_lead_user', 'lead123', False),
              ('auditor_user', 'audit123', False),
          ]
          for uname, pwd, is_admin in test_users:
              u, created = User.objects.get_or_create(username=uname, defaults={'is_superuser': is_admin, 'is_staff': is_admin})
              if created: u.set_password(pwd); u.save()
          print(f'Test users ready ({User.objects.count()} total)')
          "
          python manage.py runserver 0.0.0.0:8000 --noreload &
          sleep 4
          curl -sf http://127.0.0.1:8000/carbon-api/health/ || echo "Backend starting..."

      - name: Start frontend dev server
        working-directory: carbon-frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/carbon-api/
        run: |
          npx vite --port 5179 --host 0.0.0.0 --strictPort &
          sleep 5
          curl -sf http://127.0.0.1:5179/ || echo "Frontend starting..."

      - name: Run Playwright E2E tests
        working-directory: carbon-frontend
        env:
          CARBON_BASE_URL: http://127.0.0.1:5179
          CARBON_API_URL: http://127.0.0.1:8000/carbon-api/
        run: npx playwright test --reporter=list

  # ── Deploy to VPS (tag push only, after CI passes) ───────────
  deploy:
    needs: [backend, frontend, e2e]
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            TAG="${{ github.ref_name }}"
            echo "=== Deploying $TAG ==="

            cd /srv/carbon
            git fetch origin --tags --force
            git checkout -f "$TAG"

            # Backend
            cd /srv/carbon/backend
            docker build -t carbon-backend:latest .
            docker stop carbon-backend 2>/dev/null || true
            docker rm carbon-backend 2>/dev/null || true
            docker run -d \
              --name carbon-backend \
              --restart unless-stopped \
              -p 127.0.0.1:8006:8000 \
              --add-host host.docker.internal:host-gateway \
              --env-file .env.carbon \
              -v carbon_static:/static \
              -v carbon_media:/media \
              -v carbon_uploads:/app/dataschema_uploads \
              -v carbon_evidence:/app/evidence \
              carbon-backend:latest

            # Frontend
            cd /srv/carbon/carbon-frontend
            cat > .env.production <<'FRONTENV'
            VITE_API_BASE_URL=/carbon-api/
            FRONTENV
            npm ci --silent
            npm run build

            # Nginx
            sudo nginx -t && sudo systemctl reload nginx

            # Health check
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:8006/carbon-api/health/ >/dev/null 2>&1; then
                echo "=== Health OK ==="
                break
              fi
              sleep 2
            done

            # Prune old images
            docker image prune -f --filter "until=24h"

            echo "=== Deployed $TAG successfully ==="
