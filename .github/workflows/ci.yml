# ─────────────────────────────────────────────────────────────────
#  Carbon Data Trust Platform — CI
#
#  Deploy is pull-based: VPS polls for new tags every 2 min.
#  See deploy/carbon/setup-auto-deploy.sh for VPS setup.
#
#  Workflow:
#    git tag v1.0.0 && git push && git push --tags
#    → CI runs here, VPS auto-deploys within 2 min
# ─────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend tests ────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: carbon_ci
          POSTGRES_USER: carbon_user
          POSTGRES_PASSWORD: carbon_ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DJANGO_ENV: ci
          DJANGO_DEBUG: "False"
          SECRET_KEY: ci-secret-key-not-for-production
          DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
          DJANGO_API_PREFIX: /carbon-api/
          DB_NAME: carbon_ci
          DB_USER: carbon_user
          DB_PASSWORD: carbon_ci_pass
          DB_HOST: localhost
          DB_PORT: 5432
          CSRF_TRUSTED_ORIGINS: ""
          CORS_ALLOWED_ORIGINS: ""
        run: |
          python -m pytest --tb=short -x -q 2>&1 | tail -40

  # ── Frontend build + unit tests ──────────────────────────────
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: carbon-frontend/package-lock.json

      - name: Install dependencies
        working-directory: carbon-frontend
        run: npm ci

      - name: Run unit tests
        working-directory: carbon-frontend
        run: npm run test -- --run

      - name: Build
        working-directory: carbon-frontend
        run: npm run build

  # ── E2E tests (Playwright) ───────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: carbon_ci
          POSTGRES_USER: carbon_user
          POSTGRES_PASSWORD: carbon_ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: carbon-frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install frontend deps
        working-directory: carbon-frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: carbon-frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        env:
          DJANGO_ENV: ci
          DJANGO_DEBUG: "False"
          SECRET_KEY: ci-e2e-secret-key
          DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
          DJANGO_API_PREFIX: /carbon-api/
          DB_NAME: carbon_ci
          DB_USER: carbon_user
          DB_PASSWORD: carbon_ci_pass
          DB_HOST: localhost
          DB_PORT: 5432
          CSRF_TRUSTED_ORIGINS: ""
          CORS_ALLOWED_ORIGINS: ""
        run: |
          python manage.py migrate --noinput
          python manage.py runserver 0.0.0.0:8000 &
          sleep 3
          curl -sf http://127.0.0.1:8000/carbon-api/health/ || echo "Backend not ready"

      - name: Run Playwright E2E tests
        working-directory: carbon-frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/carbon-api/
        run: npx playwright test --reporter=list
