<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="medOS">
  <defs>
    <linearGradient id="mo-bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="mo-glyph" x1="40" y1="40" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#mo-bg)"/>

  <!-- rounded medical cross -->
  <rect x="52" y="30" width="24" height="68" rx="7" fill="url(#mo-glyph)"/>
  <rect x="30" y="52" width="68" height="24" rx="7" fill="url(#mo-glyph)"/>

  <!-- circuit nodes at arm tips -->
  <circle cx="64" cy="34" r="4.5" fill="#5eead4"/>
  <circle cx="64" cy="94" r="4.5" fill="#5eead4"/>
  <circle cx="34" cy="64" r="4.5" fill="#5eead4"/>
  <circle cx="94" cy="64" r="4.5" fill="#5eead4"/>

  <!-- center node -->
  <circle cx="64" cy="64" r="6.5" fill="#ccfbf1"/>
  <circle cx="64" cy="64" r="2.75" fill="#0f766e"/>
</svg>
