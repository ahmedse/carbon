  <circle cx="80" cy="38" r="3" fill="#d1fae5"/>
  <circle cx="46" cy="56" r="3" fill="#d1fae5"/>
  <circle cx="82" cy="56" r="3" fill="#d1fae5"/>
  <circle cx="46" cy="74" r="3" fill="#d1fae5"/>
