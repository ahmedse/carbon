      <stop offset="0" stop-color="#052e16"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="tc-leaf" x1="64" y1="22" x2="64" y2="104" gradientUnits="userSpaceOnUse">
