name: qbank

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moodle}
      POSTGRES_USER: ${POSTGRES_USER:-moodle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # no host port — DB is container-only (air-gap; access via `docker compose exec`)

  moodle:
    image: ${MOODLE_IMAGE:-qbank/moodle:5.2}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MOODLE_HTTPS_PORT:-443}:443"
      - "${MOODLE_HTTP_PORT:-8080}:80"
    volumes:
      - ./config/config.php:/var/www/html/config.php:ro
      - ${QBANK_ROOT:-./data}/moodledata:/var/www/moodledata
      - ./tls:/etc/ssl/moodle:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moodle}
      POSTGRES_USER: ${POSTGRES_USER:-moodle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
  pgdata:
