# ─────────────────────────────────────────────────────────────────
#  Carbon Data Trust Platform — production Docker Compose
#  Backend only (Gunicorn). Frontend is served by nginx on host.
#  PostgreSQL is on host, accessed via host.docker.internal.
#
#  This is the "carbon" instantiation of deploy/instance/ (ADR-0015:
#  one codebase, N isolated deployments). INSTANCE namespaces the
#  container + volume names; defaults to "carbon" for backward compat.
#
#  Usage:
#    docker compose --env-file backend/.env.carbon \
#                   -f deploy/carbon/docker-compose.yml up -d
# ─────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: ${INSTANCE:-carbon}-backend:${IMAGE_TAG:-latest}
    container_name: ${INSTANCE:-carbon}-backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-../../backend/.env.carbon}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${INSTANCE:-carbon}_static:/static
      - ${INSTANCE:-carbon}_media:/media
      - ${INSTANCE:-carbon}_uploads:/app/dataschema_uploads
      - ${INSTANCE:-carbon}_evidence:/app/mediafiles/evidence
      - ${INSTANCE:-carbon}_exports:/app/mediafiles/exports
      - ${INSTANCE:-carbon}_imports:/app/mediafiles/imports
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/carbon-api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ${INSTANCE:-carbon}_static:
  ${INSTANCE:-carbon}_media:
  ${INSTANCE:-carbon}_uploads:
  ${INSTANCE:-carbon}_evidence:
  ${INSTANCE:-carbon}_exports:
  ${INSTANCE:-carbon}_imports:
