# ─────────────────────────────────────────────────────────────────
#  Carbon Data Trust Platform — production Docker Compose
#  Backend only (Gunicorn). Frontend is served by nginx on host.
#  PostgreSQL is on host, accessed via host.docker.internal.
#
#  This is the "carbon" instantiation of deploy/instance/ (ADR-0015:
#  one codebase, N isolated deployments). INSTANCE namespaces the
#  container + volume names; defaults to "carbon" for backward compat.
#
#  Usage:
#    docker compose --env-file backend/.env.carbon \
#                   -f deploy/carbon/docker-compose.yml up -d
# ─────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: carbon-backend:${IMAGE_TAG:-latest}
    container_name: carbon-backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-../../backend/.env.carbon}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - carbon_static:/static
      - carbon_media:/media
      - carbon_uploads:/app/dataschema_uploads
      - carbon_evidence:/app/mediafiles/evidence
      - carbon_exports:/app/mediafiles/exports
      - carbon_imports:/app/mediafiles/imports
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/carbon-api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  carbon_static:
  carbon_media:
  carbon_uploads:
  carbon_evidence:
  carbon_exports:
  carbon_imports:
