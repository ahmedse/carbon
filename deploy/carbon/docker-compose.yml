# ─────────────────────────────────────────────────────────────────
#  Carbon Data Trust Platform — production Docker Compose
#  Backend only (Gunicorn). Frontend is served by nginx on host.
#  PostgreSQL is on host, accessed via host.docker.internal.
#
#  This is the "carbon" instantiation of deploy/instance/ (ADR-0015:
#  one codebase, N isolated deployments). INSTANCE namespaces the
#  container + volume names; defaults to "carbon" for backward compat.
#
#  Usage:
#    docker compose --env-file backend/.env.carbon \
#                   -f deploy/carbon/docker-compose.yml up -d
# ─────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: carbon-backend:${IMAGE_TAG:-latest}
    container_name: carbon-backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-../../backend/.env.carbon}
    # Release identity for /carbon-api/health/ (deployer exports these).
    # environment: wins over env_file:, so the running deploy stamps its tag.
    environment:
      CARBON_RELEASE_TAG: "${CARBON_RELEASE_TAG:-}"
      CARBON_IMAGE_BUILT_AT: "${CARBON_IMAGE_BUILT_AT:-}"
      CARBON_DEPLOYED_AT: "${CARBON_DEPLOYED_AT:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - static:/static
      - media:/media
      - uploads:/app/dataschema_uploads
      - evidence:/app/mediafiles/evidence
      - exports:/app/mediafiles/exports
      - imports:/app/mediafiles/imports
      # The carbon deployer builds a runtime jail (.runtime-packs: carbon +
      # aast-med + _platform) and points DOMAIN_PACKS_MOUNT at it, so an
      # unauthenticated sibling pack can never be loaded. Falls back to the
      # repo dir only for local/compose-up without the deployer.
      - ${DOMAIN_PACKS_MOUNT:-../../domain_packs}:/domain_packs:ro
      - ../../assurance:/assurance:ro
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/carbon-api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  static:
    name: carbon_static
  media:
    name: carbon_media
  uploads:
    name: carbon_uploads
  evidence:
    name: carbon_evidence
  exports:
    name: carbon_exports
  imports:
    name: carbon_imports
