# /etc/nginx/sites-available/carbon.clearturn.tech
#
# Carbon Data Trust Platform — production site
# Frontend : React SPA served from /srv/carbon/carbon-frontend/dist
# Backend  : Gunicorn in Docker on 127.0.0.1:8002
# Static   : /srv/carbon/backend/staticfiles
# Media    : /srv/carbon/backend/mediafiles
# API      : /carbon-api/ proxied to Docker backend
#
# After installing, run:
#   sudo ln -s /etc/nginx/sites-available/carbon.clearturn.tech \
#              /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d carbon.clearturn.tech
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS redirect ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name carbon.clearturn.tech;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS main block ──────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name carbon.clearturn.tech;

    # ── TLS — filled in by certbot ────────────────────────────────
    # ssl_certificate     /etc/letsencrypt/live/carbon.clearturn.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/carbon.clearturn.tech/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy "strict-origin"      always;
    add_header X-XSS-Protection "1; mode=block"    always;

    client_max_body_size 50M;

    # ── Compression — gzip all text/JS/CSS responses ──────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/x-javascript
        application/xml image/svg+xml;

    # ── Django static files ───────────────────────────────────────
    location /static/ {
        alias /srv/carbon/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Django media files ────────────────────────────────────────
    location /media/ {
        alias /srv/carbon/backend/mediafiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Carbon API ────────────────────────────────────────────────
    location /carbon-api/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Django admin ──────────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── React SPA (catch-all) ─────────────────────────────────────
    root /srv/carbon/carbon-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache hashed JS/CSS chunks aggressively
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|gif|webp)$ {
        root /srv/carbon/carbon-frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
}
