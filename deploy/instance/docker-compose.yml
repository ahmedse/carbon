# ─────────────────────────────────────────────────────────────────
#  Carbon — production Docker Compose for ONE isolated instance
#  (ADR-0015: one codebase, N isolated deployments).
#
#  Everything instance-specific comes from the instance env file at
#  runtime (${...}), so this single compose file serves every org.
#  ${INSTANCE} disambiguates container + volume names so multiple
#  instances can run side-by-side on one host.
#
#  Usage:
#    docker compose --env-file backend/.env.<instance> \
#                   -f deploy/<instance>/docker-compose.yml up -d
# ─────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: ${INSTANCE}-backend:${IMAGE_TAG:-latest}
    container_name: ${INSTANCE}-backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - static:/static
      - media:/media
      - uploads:/app/dataschema_uploads
      - evidence:/app/mediafiles/evidence
      - exports:/app/mediafiles/exports
      - imports:/app/mediafiles/imports
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/carbon-api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  static:
    name: ${INSTANCE}_static
  media:
    name: ${INSTANCE}_media
  uploads:
    name: ${INSTANCE}_uploads
  evidence:
    name: ${INSTANCE}_evidence
  exports:
    name: ${INSTANCE}_exports
  imports:
    name: ${INSTANCE}_imports
